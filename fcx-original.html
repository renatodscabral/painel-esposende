<script>
/* =========================================================================
   ESPOSENDE — PAINEL ANALÍTICO  (módulo autocontido)
   -------------------------------------------------------------------------
   Integração: cole este <script> DEPOIS do script principal do arquivo.
   O módulo expõe um único objeto global: window.PainelAnalitico
     • PainelAnalitico.render()       → string HTML da tela (usada no render())
     • PainelAnalitico.afterRender()  → desenha gráficos + tabela (afterRender())
   Fonte de dados:
     • Se o app principal já carregou (`state.loaded`), usa `state` — assim o
       painel reflete importações e edições feitas na tela "Gerenciar dados".
     • Caso contrário, decodifica diretamente a variável estática `SEED`.
   ========================================================================= */
const PainelAnalitico = (() => {
  'use strict';

  /* ---------------------------------------------------------------------
     1. CONFIGURAÇÃO
     --------------------------------------------------------------------- */
  const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // Meios que NÃO geram caixa no dia da venda (financiamento próprio / créditos
  // internos). Espelha NON_CASH_METHODS do app principal; boleto é ignorado.
  const MEIOS_NAO_CAIXA = new Set(['crediario', 'creditocliente', 'vale']);
  const MEIOS_EXCLUIDOS = new Set(['boleto']);
  // Taxa (MDR) por meio — reaproveita DEFAULT_TAXA_PRAZO do app principal quando existir.
  const taxaDoMeio = meio => (typeof DEFAULT_TAXA_PRAZO !== 'undefined' && DEFAULT_TAXA_PRAZO[meio]?.taxa) || 0;

  // Agrupamento gerencial do plano de contas, pelo prefixo do código contábil.
  // A ordem é FIXA: define a cor de cada grupo em todos os gráficos
  // (cor segue a entidade, nunca a posição no ranking).
  const GRUPOS = [
    { id: 'mercadoria',  label: 'Mercadorias',             cor: '#2a78d6', regra: c => /^2\./.test(c) },
    { id: 'pessoal',     label: 'Pessoal & encargos',      cor: '#eb6834', regra: c => /^4\.0[1-6]\./.test(c) || /^7\.21\./.test(c) || c === '4.38.17' },
    { id: 'ocupacao',    label: 'Ocupação (aluguel, cond.)', cor: '#1baf7a', regra: c => /^4\.10\./.test(c) },
    { id: 'impostos',    label: 'Parcelamentos fiscais',   cor: '#eda100', regra: c => /^7\.11\./.test(c) },
    { id: 'expansao',    label: 'Obras & investimentos',   cor: '#e87ba4', regra: c => /^7\.20\./.test(c) || /^4\.26\./.test(c) },
    { id: 'servicos',    label: 'Serviços & TI',           cor: '#008300', regra: c => /^4\.(09|38)\./.test(c) },
    { id: 'marketing',   label: 'Marketing',               cor: '#4a3aa7', regra: c => /^4\.33\./.test(c) },
    { id: 'outros',      label: 'Outros',                  cor: '#8a8d9f', regra: () => true }, // fallback — sempre por último
  ];
  const GRUPO_POR_ID = Object.fromEntries(GRUPOS.map(g => [g.id, g]));

  const LINHAS_POR_PAGINA = 50;

  /* ---------------------------------------------------------------------
     2. UTILITÁRIOS
     --------------------------------------------------------------------- */
  const fmtBRL = n => (n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const fmtBRLc = n => {                         // formato compacto p/ eixos: R$ 12,3 mi
    const a = Math.abs(n);
    if (a >= 1e6) return 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
    if (a >= 1e3) return 'R$ ' + (n / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil';
    return fmtBRL(n);
  };
  const fmtPct = (n, d = 1) => isFinite(n) ? (n * 100).toLocaleString('pt-BR', { maximumFractionDigits: d, minimumFractionDigits: d }) + '%' : '—';
  const fmtData = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4);
  const mesLabel = mk => MESES_ABREV[+mk.slice(5, 7) - 1] + '/' + mk.slice(2, 4);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const codigoConta = conta => String(conta || '').split('–')[0].trim();   // "4.01.01 – (-) Salários" → "4.01.01"

  /** Classifica uma conta contábil em um dos GRUPOS gerenciais. */
  const grupoDaConta = (() => {
    const cache = new Map();                     // memoização: 63 contas, milhares de lançamentos
    return conta => {
      if (!cache.has(conta)) {
        const cod = codigoConta(conta);
        cache.set(conta, GRUPOS.find(g => g.regra(cod)).id);
      }
      return cache.get(conta);
    };
  })();

  /**
   * Soma genérica com Map (O(n), uma única passada).
   * @param {Array} arr   registros
   * @param {Function} keyFn  registro → chave
   * @param {Function} valFn  registro → número
   * @returns {Map<chave, number>}
   */
  const somarPor = (arr, keyFn, valFn) =>
    arr.reduce((m, r) => { const k = keyFn(r); m.set(k, (m.get(k) || 0) + valFn(r)); return m; }, new Map());

  /** Map → array ordenado desc por valor: [[chave, valor], ...] */
  const ranking = m => [...m.entries()].sort((a, b) => b[1] - a[1]);

  /* ---------------------------------------------------------------------
     3. CAMADA DE DADOS — normalização
     Ambas as fontes (SEED compactado ou state do app) viram o MESMO formato:
       vendas: [{ date, mk, porMeio:{meio:valor}, bruto, caixa (líquida de MDR) }]
       saidas: [{ date, mk, conta, grupo, centro, tipo, valor, fornecedor, obs }]
     --------------------------------------------------------------------- */
  function normalizarVenda(date, porMeio) {
    let bruto = 0, caixa = 0;
    for (const [meio, v] of Object.entries(porMeio)) {
      if (MEIOS_EXCLUIDOS.has(meio)) continue;
      bruto += v;
      // receita-caixa = meios que geram caixa, LÍQUIDOS da taxa da adquirente
      if (!MEIOS_NAO_CAIXA.has(meio)) caixa += v * (1 - taxaDoMeio(meio));
    }
    return { date, mk: date.slice(0, 7), porMeio, bruto, caixa };
  }

  function normalizarSaida(s) {
    return { ...s, mk: s.date.slice(0, 7), grupo: grupoDaConta(s.conta), valor: +s.valor || 0 };
  }

  /** Decodifica o SEED (arrays posicionais + tabelas de lookup por índice). */
  function fromSeed(seed) {
    const vendas = seed.salesHistory.map(row => {
      const porMeio = {};
      seed.methodKeys.forEach((k, i) => { porMeio[k] = row[i + 1] || 0; });
      return normalizarVenda(row[0], porMeio);
    });
    // saidas: [data, idxConta, idxCentro, tipo(1=efetivo|0=previsto), valor, idxFornecedor, descrição]
    const saidas = seed.saidas.map(r => normalizarSaida({
      date: r[0], conta: seed.accounts[r[1]], centro: seed.costCenters[r[2]],
      tipo: r[3] === 1 ? 'efetivo' : 'previsto', valor: r[4],
      fornecedor: seed.fornecedores[r[5]] || '(sem fornecedor)', obs: r[6] || '',
    }));
    return { vendas, saidas };
  }

  /** Usa o estado vivo do app (inclui importações/edições do usuário). */
  function fromState(st) {
    return {
      vendas: st.salesHistory.map(v => normalizarVenda(v.date, v.values || {})),
      saidas: st.saidas.map(s => normalizarSaida({ ...s, fornecedor: s.fornecedor || '(sem fornecedor)' })),
    };
  }

  // Cache: só renormaliza quando os arrays de origem mudam (referência ou tamanho).
  let _cache = { ref: null, data: null };
  function getDataset() {
    const usaState = typeof state !== 'undefined' && state.loaded;
    const src = usaState ? state : (typeof SEED !== 'undefined' ? SEED : null);
    if (!src) return { vendas: [], saidas: [] };
    const assinatura = usaState
      ? [state.saidas, state.saidas.length, state.salesHistory, state.salesHistory.length]
      : [SEED];
    const mudou = !_cache.ref || assinatura.some((x, i) => x !== _cache.ref[i]);
    if (mudou) _cache = { ref: assinatura, data: usaState ? fromState(state) : fromSeed(SEED) };
    return _cache.data;
  }

  /* ---------------------------------------------------------------------
     4. CONSOLIDAÇÃO (mensal e geral)
     --------------------------------------------------------------------- */
  function consolidarReceitas(vendas) {
    const porMes = new Map();                    // mk → {bruto, caixa, dias, porMeio}
    const porMeio = {};
    for (const v of vendas) {
      const m = porMes.get(v.mk) || { bruto: 0, caixa: 0, dias: 0, porMeio: {} };
      m.bruto += v.bruto; m.caixa += v.caixa; m.dias += 1;
      for (const [k, val] of Object.entries(v.porMeio)) {
        if (MEIOS_EXCLUIDOS.has(k)) continue;
        m.porMeio[k] = (m.porMeio[k] || 0) + val;
        porMeio[k] = (porMeio[k] || 0) + val;
      }
      porMes.set(v.mk, m);
    }
    const meses = [...porMes.keys()].sort();
    const total = { bruto: 0, caixa: 0 };
    porMes.forEach(m => { total.bruto += m.bruto; total.caixa += m.caixa; });
    return { porMes, meses, porMeio, total };
  }

  function consolidarDespesas(saidas) {
    const total = saidas.reduce((a, s) => a + s.valor, 0);
    const porTipo = somarPor(saidas, s => s.tipo, s => s.valor);
    return {
      total,
      qtd: saidas.length,
      porMes: somarPor(saidas, s => s.mk, s => s.valor),
      porGrupo: somarPor(saidas, s => s.grupo, s => s.valor),
      porConta: somarPor(saidas, s => s.conta, s => s.valor),
      porCentro: somarPor(saidas, s => s.centro, s => s.valor),
      porFornecedor: somarPor(saidas, s => s.fornecedor, s => s.valor),
      porTipo,
      meses: [...new Set(saidas.map(s => s.mk))].sort(),
    };
  }

  /**
   * ATENÇÃO — as bases não se sobrepõem no tempo:
   *   receitas = Ago–Dez/2025 (histórico)  ·  despesas = Ago–Dez/2026 (programadas)
   * Por isso o comparativo alinha pelo MÊS DO CALENDÁRIO (Ago×Ago, Set×Set…),
   * usando a receita do ano anterior como base de sazonalidade, ajustável por
   * um fator de crescimento (ex.: +8% → receita projetada = 2025 × 1,08).
   */
  function alinharPorMesCalendario(rec, desp, crescimento = 0, base = 'caixa') {
    const mesesCal = new Set();
    rec.meses.forEach(mk => mesesCal.add(+mk.slice(5, 7)));
    desp.meses.forEach(mk => mesesCal.add(+mk.slice(5, 7)));
    return [...mesesCal].sort((a, b) => a - b).map(m => {
      const mkRec = rec.meses.find(mk => +mk.slice(5, 7) === m);
      const mkDesp = desp.meses.find(mk => +mk.slice(5, 7) === m);
      const receita = mkRec ? rec.porMes.get(mkRec)[base] * (1 + crescimento) : 0;
      const despesa = mkDesp ? desp.porMes.get(mkDesp) : 0;
      return { mes: m, label: MESES_ABREV[m - 1], mkRec, mkDesp, receita, despesa, saldo: receita - despesa };
    });
  }

  /* ---------------------------------------------------------------------
     5. KPIs
     --------------------------------------------------------------------- */
  function calcularKPIs(ds) {
    const rec = consolidarReceitas(ds.vendas);
    const desp = consolidarDespesas(ds.saidas);
    const g = id => desp.porGrupo.get(id) || 0;
    const top5 = ranking(desp.porFornecedor).slice(0, 5).reduce((a, [, v]) => a + v, 0);
    const picoMes = ranking(desp.porMes)[0] || ['', 0];
    const credito = (rec.porMeio.credito || 0);
    return {
      rec, desp,
      receitaBruta: rec.total.bruto,
      receitaCaixa: rec.total.caixa,
      pctCaixa: rec.total.caixa / rec.total.bruto,
      despesas: desp.total,
      cobertura: rec.total.caixa / desp.total,                   // > 1 = receita-caixa base cobre as saídas
      pctMercadoria: g('mercadoria') / rec.total.bruto,          // proxy de CMV (caixa)
      pctPessoal: g('pessoal') / rec.total.bruto,
      pctOcupacao: g('ocupacao') / rec.total.bruto,
      concentracaoTop5: top5 / desp.total,
      pctPrevisto: (desp.porTipo.get('previsto') || 0) / desp.total,
      picoMes: picoMes[0], picoValor: picoMes[1],
      pctCredito: credito / rec.total.bruto,
    };
  }

  /* ---------------------------------------------------------------------
     6. ESTADO DE UI (filtros, ordenação, paginação, opções de gráfico)
     --------------------------------------------------------------------- */
  const ui = {
    filtros: { centro: '', mes: '', fornecedor: '', grupo: '', tipo: '', busca: '' },
    ordem: { campo: 'date', dir: 1 },
    pagina: 1,
    baseReceita: 'caixa',     // 'caixa' | 'bruto'
    crescimento: 0,           // fração (0.08 = +8%)
    catModo: 'grupo',         // 'grupo' | 'conta'
  };
  const charts = {};          // instâncias Chart.js (destruídas antes de redesenhar)

  /** Aplica todos os filtros ativos — uma passada, predicados curtos. */
  function aplicarFiltros(saidas, f = ui.filtros) {
    const busca = f.busca.trim().toLowerCase();
    const forn = f.fornecedor.trim().toLowerCase();
    return saidas.filter(s =>
      (!f.centro || s.centro === f.centro) &&
      (!f.mes || s.mk === f.mes) &&
      (!f.grupo || s.grupo === f.grupo) &&
      (!f.tipo || s.tipo === f.tipo) &&
      (!forn || s.fornecedor.toLowerCase().includes(forn)) &&
      (!busca || (s.obs + ' ' + s.conta + ' ' + s.fornecedor + ' ' + s.centro).toLowerCase().includes(busca))
    );
  }

  function ordenar(arr) {
    const { campo, dir } = ui.ordem;
    return [...arr].sort((a, b) => {
      const x = a[campo], y = b[campo];
      return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR')) * dir;
    });
  }

  /* ---------------------------------------------------------------------
     7. RENDERIZAÇÃO — tela (string HTML)
     --------------------------------------------------------------------- */
  const opt = (v, label, sel) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(label)}</option>`;

  function kpiTile(lbl, val, sub, cls = '') {
    return `<div class="stat pa-kpi"><div class="lbl">${lbl}</div><div class="val ${cls}">${val}</div>${sub ? `<div class="pa-sub">${sub}</div>` : ''}</div>`;
  }

  function render() {
    const ds = getDataset();
    const k = calcularKPIs(ds);
    const f = ui.filtros;
    const periodoRec = k.rec.meses.length ? `${mesLabel(k.rec.meses[0])}–${mesLabel(k.rec.meses.at(-1))}` : '—';
    const periodoDesp = k.desp.meses.length ? `${mesLabel(k.desp.meses[0])}–${mesLabel(k.desp.meses.at(-1))}` : '—';

    const centros = [...new Set(ds.saidas.map(s => s.centro))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    const fornecedores = [...new Set(ds.saidas.map(s => s.fornecedor))].sort((a, b) => a.localeCompare(b, 'pt-BR'));

    return `
    <button class="backlink no-print" onclick="goto('landing')">← voltar</button>

    <div class="panel">
      <div class="row-flex"><div>
        <h2>Painel analítico</h2>
        <p class="desc" style="margin-bottom:0;">Receitas históricas (${periodoRec}) × saídas programadas (${periodoDesp}). Indicadores consolidados de toda a empresa.</p>
      </div></div>
      <div class="grid-4" style="margin-top:18px;">
        ${kpiTile('Receita bruta', fmtBRLc(k.receitaBruta), periodoRec)}
        ${kpiTile('Receita-caixa líquida', fmtBRLc(k.receitaCaixa), fmtPct(k.pctCaixa) + ' da bruta (após MDR e sem crediário)')}
        ${kpiTile('Saídas programadas', fmtBRLc(k.despesas), `${k.desp.qtd.toLocaleString('pt-BR')} lançamentos · ${periodoDesp}`)}
        ${kpiTile('Índice de cobertura', k.cobertura.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '×', 'receita-caixa base ÷ saídas', k.cobertura >= 1 ? 'pos' : 'neg')}
        ${kpiTile('Mercadorias / receita', fmtPct(k.pctMercadoria), 'compras + adiantamentos a fornecedores')}
        ${kpiTile('Pessoal / receita', fmtPct(k.pctPessoal), 'folha, encargos, benefícios, rescisões')}
        ${kpiTile('Ocupação / receita', fmtPct(k.pctOcupacao), 'aluguel, condomínio, fundo, IPTU')}
        ${kpiTile('Top 5 fornecedores', fmtPct(k.concentracaoTop5), 'do total de saídas')}
        ${kpiTile('Saídas "previstas"', fmtPct(k.pctPrevisto), 'ainda não confirmadas (efetivo)')}
        ${kpiTile('Mês de maior desembolso', k.picoMes ? mesLabel(k.picoMes) : '—', fmtBRLc(k.picoValor))}
        ${kpiTile('Vendas no crédito', fmtPct(k.pctCredito), 'sujeitas a MDR e prazo')}
        ${kpiTile('Ticket diário médio', fmtBRLc(k.receitaBruta / Math.max(1, ds.vendas.length)), ds.vendas.length + ' dias com venda')}
      </div>
    </div>

    <div class="panel">
      <div class="row-flex">
        <div>
          <h2>Receitas × Despesas por mês</h2>
          <p class="desc" style="margin-bottom:0;">Alinhado pelo mês do calendário: receita de 2025 como base sazonal, saídas programadas de 2026.</p>
        </div>
        <div class="pa-controls no-print">
          <div class="segmented">
            <button class="${ui.baseReceita === 'caixa' ? 'active' : ''}" onclick="PainelAnalitico.set('baseReceita','caixa')">Receita-caixa</button>
            <button class="${ui.baseReceita === 'bruto' ? 'active' : ''}" onclick="PainelAnalitico.set('baseReceita','bruto')">Receita bruta</button>
          </div>
          <label class="pa-inline">Crescimento 26/25
            <input type="number" step="1" value="${Math.round(ui.crescimento * 100)}" onchange="PainelAnalitico.set('crescimento', this.value/100)"> %
          </label>
        </div>
      </div>
      <div class="chart-wrap" style="height:300px;"><canvas id="paChartRD" role="img" aria-label="Receitas versus despesas por mês"></canvas></div>
      <div id="paRDResumo" class="pa-resumo"></div>
    </div>

    <div class="panel no-print">
      <h2>Filtros das saídas</h2>
      <p class="desc">Afetam os dois gráficos abaixo e a tabela.</p>
      <div class="pa-filtros">
        <div><label>Centro de custo</label>
          <select onchange="PainelAnalitico.filtrar('centro', this.value)">${opt('', 'Todos', f.centro)}${centros.map(c => opt(c, c, f.centro)).join('')}</select></div>
        <div><label>Mês</label>
          <select onchange="PainelAnalitico.filtrar('mes', this.value)">${opt('', 'Todos', f.mes)}${k.desp.meses.map(m => opt(m, mesLabel(m), f.mes)).join('')}</select></div>
        <div><label>Fornecedor</label>
          <input type="text" list="paFornList" placeholder="Digite parte do nome…" value="${esc(f.fornecedor)}" oninput="PainelAnalitico.filtrarDebounced('fornecedor', this.value)">
          <datalist id="paFornList">${fornecedores.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
        <div><label>Categoria</label>
          <select onchange="PainelAnalitico.filtrar('grupo', this.value)">${opt('', 'Todas', f.grupo)}${GRUPOS.map(g => opt(g.id, g.label, f.grupo)).join('')}</select></div>
        <div><label>Status</label>
          <select onchange="PainelAnalitico.filtrar('tipo', this.value)">${opt('', 'Todos', f.tipo)}${opt('previsto', 'Previsto', f.tipo)}${opt('efetivo', 'Efetivo', f.tipo)}${opt('pago', 'Pago', f.tipo)}</select></div>
        <div><label>Busca livre</label>
          <input type="text" placeholder="Descrição, conta…" value="${esc(f.busca)}" oninput="PainelAnalitico.filtrarDebounced('busca', this.value)"></div>
      </div>
      <div class="row-flex" style="margin-top:4px;">
        <div id="paFiltroResumo" class="pa-resumo" style="margin:0;"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn secondary small" onclick="PainelAnalitico.limpar()">Limpar filtros</button>
          <button class="btn secondary small" onclick="PainelAnalitico.exportar()">Exportar Excel</button>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="row-flex">
          <h2>Distribuição por categoria</h2>
          <div class="segmented no-print">
            <button class="${ui.catModo === 'grupo' ? 'active' : ''}" onclick="PainelAnalitico.set('catModo','grupo')">Grupos</button>
            <button class="${ui.catModo === 'conta' ? 'active' : ''}" onclick="PainelAnalitico.set('catModo','conta')">Top contas</button>
          </div>
        </div>
        <div class="chart-wrap" style="height:320px;"><canvas id="paChartCat" role="img" aria-label="Distribuição das saídas por categoria"></canvas></div>
      </div>
      <div class="panel">
        <h2>Top 10 fornecedores</h2>
        <p class="desc" style="margin-bottom:4px;">Clique em uma barra para filtrar a tabela.</p>
        <div class="chart-wrap" style="height:320px;"><canvas id="paChartForn" role="img" aria-label="Dez maiores fornecedores por valor"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h2>Saídas detalhadas</h2>
      <div id="paTabela"></div>
    </div>`;
  }

  /* ---------------------------------------------------------------------
     8. GRÁFICOS (Chart.js 4)
     --------------------------------------------------------------------- */
  const COR = { receita: '#1F8354', despesa: '#C0463A', saldo: '#C9993A', grid: '#EDEEF6', tinta: '#62667C' };

  function baseOptions(extra = {}) {
    return {
      responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { sort: (a, b) => a.datasetIndex - b.datasetIndex, font: { family: 'Inter', size: 12 }, color: COR.tinta, usePointStyle: true, boxWidth: 8 } },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label || c.label}: ${fmtBRL(c.parsed.y ?? c.parsed.x ?? c.parsed)}` } },
      },
      ...extra,
    };
  }

  function desenhar(id, config) {
    const canvas = document.getElementById(id);
    if (!canvas || typeof Chart === 'undefined') return;
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart(canvas, config);
  }

  /** Gráfico 1 — Receitas × Despesas (sempre consolidado da empresa). */
  function drawReceitaDespesa(ds) {
    const rec = consolidarReceitas(ds.vendas);
    const desp = consolidarDespesas(ds.saidas);
    const linhas = alinharPorMesCalendario(rec, desp, ui.crescimento, ui.baseReceita);
    const rotuloRec = (ui.baseReceita === 'caixa' ? 'Receita-caixa' : 'Receita bruta') + ' (base 2025' + (ui.crescimento ? `, ${ui.crescimento > 0 ? '+' : ''}${Math.round(ui.crescimento * 100)}%` : '') + ')';

    desenhar('paChartRD', {
      data: {
        labels: linhas.map(l => l.label),
        datasets: [
          { type: 'bar', label: rotuloRec, data: linhas.map(l => l.receita), backgroundColor: COR.receita, borderRadius: 4, maxBarThickness: 38, order: 2 },
          { type: 'bar', label: 'Saídas programadas 2026', data: linhas.map(l => l.despesa), backgroundColor: COR.despesa, borderRadius: 4, maxBarThickness: 38, order: 2 },
          { type: 'line', label: 'Saldo (receita − saídas)', data: linhas.map(l => l.saldo), borderColor: COR.saldo, backgroundColor: COR.saldo, borderWidth: 2, pointRadius: 4, tension: 0.25, order: 1 },
        ],
      },
      options: baseOptions({
        scales: {
          x: { grid: { display: false }, ticks: { color: COR.tinta } },
          y: { grid: { color: COR.grid }, ticks: { color: COR.tinta, callback: v => fmtBRLc(v) } },
        },
      }),
    });

    // Resumo textual (acessível + útil para impressão)
    const acum = linhas.reduce((a, l) => a + l.saldo, 0);
    const piores = linhas.filter(l => l.saldo < 0).map(l => l.label);
    const el = document.getElementById('paRDResumo');
    if (el) el.innerHTML = `Saldo acumulado do período: <b class="${acum >= 0 ? 'pos' : 'neg'}">${fmtBRL(acum)}</b>` +
      (piores.length ? ` · Meses com saídas acima da receita: <b class="neg">${piores.join(', ')}</b>` : ' · Nenhum mês com saídas acima da receita.');
  }

  /** Gráfico 2 — Distribuição por categoria (grupos gerenciais ou top contas). */
  function drawCategorias(filtradas) {
    const desp = consolidarDespesas(filtradas);
    let labels, valores, cores;
    if (ui.catModo === 'grupo') {
      const itens = GRUPOS.filter(g => desp.porGrupo.get(g.id));        // ordem FIXA → cor estável
      labels = itens.map(g => g.label);
      valores = itens.map(g => desp.porGrupo.get(g.id));
      cores = itens.map(g => g.cor);
    } else {
      // Top 7 contas + "Outras" (nunca mais de 8 fatias). Cor = grupo da conta.
      const rk = ranking(desp.porConta);
      const top = rk.slice(0, 7);
      const resto = rk.slice(7).reduce((a, [, v]) => a + v, 0);
      labels = top.map(([c]) => c.replace(/\(-\)\s*/, ''));
      valores = top.map(([, v]) => v);
      cores = top.map(([c]) => GRUPO_POR_ID[grupoDaConta(c)].cor);
      if (resto > 0) { labels.push('Outras contas'); valores.push(resto); cores.push('#C7CAD9'); }
    }
    const total = valores.reduce((a, b) => a + b, 0);
    desenhar('paChartCat', {
      type: 'doughnut',
      data: { labels, datasets: [{ data: valores, backgroundColor: cores, borderColor: '#fff', borderWidth: 2, hoverOffset: 6 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '58%',
        plugins: {
          legend: { position: 'right', labels: { font: { family: 'Inter', size: 11.5 }, color: COR.tinta, boxWidth: 10, padding: 10,
            generateLabels: ch => ch.data.labels.map((l, i) => ({
              text: `${l.length > 30 ? l.slice(0, 29) + '…' : l}  ${fmtPct(valores[i] / total, 0)}`,
              fillStyle: cores[i], strokeStyle: cores[i], index: i, hidden: !ch.getDataVisibility(i),
            })) } },
          tooltip: { callbacks: { label: c => ` ${c.label}: ${fmtBRL(c.parsed)} (${fmtPct(c.parsed / total)})` } },
        },
      },
    });
  }

  /** Gráfico 3 — Top 10 fornecedores (barras horizontais, clicáveis). */
  function drawFornecedores(filtradas) {
    const top = ranking(consolidarDespesas(filtradas).porFornecedor).slice(0, 10);
    desenhar('paChartForn', {
      type: 'bar',
      data: {
        labels: top.map(([f]) => f.length > 28 ? f.slice(0, 27) + '…' : f),
        datasets: [{ label: 'Saídas', data: top.map(([, v]) => v), backgroundColor: '#1B2262', borderRadius: 4, maxBarThickness: 22 }],
      },
      options: baseOptions({
        indexAxis: 'y',
        interaction: { mode: 'nearest', axis: 'y', intersect: false },
        plugins: { legend: { display: false }, tooltip: { callbacks: { title: it => top[it[0].dataIndex][0], label: c => ' ' + fmtBRL(c.parsed.x) } } },
        scales: {
          x: { grid: { color: COR.grid }, ticks: { color: COR.tinta, callback: v => fmtBRLc(v) } },
          y: { grid: { display: false }, ticks: { color: COR.tinta, font: { size: 11 } } },
        },
        onClick: (_e, els) => { if (els.length) filtrar('fornecedor', top[els[0].index][0], true); },
        onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      }),
    });
  }

  /* ---------------------------------------------------------------------
     9. TABELA DINÂMICA (ordenação + paginação + totais)
     --------------------------------------------------------------------- */
  function renderTabela(filtradas) {
    const el = document.getElementById('paTabela');
    if (!el) return;
    if (!filtradas.length) { el.innerHTML = '<div class="empty">Nenhuma saída para os filtros selecionados.</div>'; return; }

    const linhas = ordenar(filtradas);
    const paginas = Math.ceil(linhas.length / LINHAS_POR_PAGINA);
    ui.pagina = Math.min(Math.max(1, ui.pagina), paginas);
    const ini = (ui.pagina - 1) * LINHAS_POR_PAGINA;
    const pagina = linhas.slice(ini, ini + LINHAS_POR_PAGINA);
    const total = filtradas.reduce((a, s) => a + s.valor, 0);

    const th = (campo, rotulo, cls = '') => {
      const seta = ui.ordem.campo === campo ? (ui.ordem.dir === 1 ? ' ▲' : ' ▼') : '';
      return `<th class="${cls} pa-sort" onclick="PainelAnalitico.ordenarPor('${campo}')">${rotulo}${seta}</th>`;
    };
    const badge = t => `<span class="badge ${t === 'pago' ? 'green' : t === 'efetivo' ? 'blue' : 'gold'}">${t === 'pago' ? 'Pago' : t === 'efetivo' ? 'Efetivo' : 'Previsto'}</span>`;

    el.innerHTML = `
      <div class="scroll-table" style="max-height:560px;"><table>
        <thead><tr>${th('date', 'Data')}${th('fornecedor', 'Fornecedor')}${th('conta', 'Conta')}${th('centro', 'Centro de custo')}${th('obs', 'Descrição')}${th('tipo', 'Status')}${th('valor', 'Valor', 'num')}</tr></thead>
        <tbody>${pagina.map(s => `<tr>
          <td class="mono" style="white-space:nowrap;">${fmtData(s.date)}</td>
          <td>${esc(s.fornecedor)}</td>
          <td><span class="pa-dot" style="background:${GRUPO_POR_ID[s.grupo].cor}"></span>${esc(s.conta)}</td>
          <td>${esc(s.centro)}</td>
          <td class="pa-obs">${esc(s.obs)}</td>
          <td>${badge(s.tipo)}</td>
          <td class="num">${fmtBRL(s.valor)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="6"><b>Total filtrado (${filtradas.length.toLocaleString('pt-BR')} lançamentos)</b></td><td class="num"><b>${fmtBRL(total)}</b></td></tr></tfoot>
      </table></div>
      <div class="row-flex pa-pag no-print">
        <span class="hint">Linhas ${ini + 1}–${ini + pagina.length} de ${linhas.length.toLocaleString('pt-BR')}</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="btn secondary small" ${ui.pagina <= 1 ? 'disabled' : ''} onclick="PainelAnalitico.pagina(-1)">‹ Anterior</button>
          <span class="mono" style="font-size:12.5px;">${ui.pagina}/${paginas}</span>
          <button class="btn secondary small" ${ui.pagina >= paginas ? 'disabled' : ''} onclick="PainelAnalitico.pagina(1)">Próxima ›</button>
        </div>
      </div>`;
  }

  function renderResumoFiltro(filtradas, totalGeral) {
    const el = document.getElementById('paFiltroResumo');
    if (!el) return;
    const t = filtradas.reduce((a, s) => a + s.valor, 0);
    const ef = filtradas.filter(s => s.tipo !== 'previsto').reduce((a, s) => a + s.valor, 0);
    el.innerHTML = `<b>${fmtBRL(t)}</b> em ${filtradas.length.toLocaleString('pt-BR')} lançamentos · ${fmtPct(t / totalGeral)} do total · ${fmtPct(t ? ef / t : 0)} confirmado`;
  }

  /** Atualiza apenas as partes dependentes de filtro (sem re-render completo:
      preserva o foco dos inputs e evita recriar o gráfico 1). */
  function atualizarFiltrados() {
    const ds = getDataset();
    const filtradas = aplicarFiltros(ds.saidas);
    renderResumoFiltro(filtradas, ds.saidas.reduce((a, s) => a + s.valor, 0));
    drawCategorias(filtradas);
    drawFornecedores(filtradas);
    renderTabela(filtradas);
  }

  function afterRender() {
    const ds = getDataset();
    drawReceitaDespesa(ds);
    atualizarFiltrados();
  }

  /* ---------------------------------------------------------------------
     10. AÇÕES (chamadas pelo HTML)
     --------------------------------------------------------------------- */
  function filtrar(campo, valor, rerenderTela = false) {
    ui.filtros[campo] = valor;
    ui.pagina = 1;
    // Quando o filtro vem de um clique no gráfico, o <input> precisa refletir o valor.
    if (rerenderTela && typeof window.render === 'function') window.render(); else atualizarFiltrados();
  }
  let _deb;
  function filtrarDebounced(campo, valor) { clearTimeout(_deb); _deb = setTimeout(() => filtrar(campo, valor), 220); }

  function limpar() {
    Object.keys(ui.filtros).forEach(k => { ui.filtros[k] = ''; });
    ui.pagina = 1;
    window.render ? window.render() : afterRender();
  }

  function set(chave, valor) {
    ui[chave] = chave === 'crescimento' ? (+valor || 0) : valor;
    window.render ? window.render() : afterRender();
  }

  function ordenarPor(campo) {
    ui.ordem = { campo, dir: ui.ordem.campo === campo ? -ui.ordem.dir : (campo === 'valor' ? -1 : 1) };
    renderTabela(aplicarFiltros(getDataset().saidas));
  }

  function pagina(delta) { ui.pagina += delta; renderTabela(aplicarFiltros(getDataset().saidas)); }

  /** Exporta as saídas filtradas para .xlsx (usa SheetJS já carregado no arquivo). */
  function exportar() {
    if (typeof XLSX === 'undefined') { alert('Biblioteca XLSX não carregada.'); return; }
    const linhas = ordenar(aplicarFiltros(getDataset().saidas)).map(s => ({
      Data: fmtData(s.date), Fornecedor: s.fornecedor, Conta: s.conta, Categoria: GRUPO_POR_ID[s.grupo].label,
      'Centro de custo': s.centro, Descrição: s.obs, Status: s.tipo, Valor: s.valor,
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), 'Saídas filtradas');
    XLSX.writeFile(wb, `saidas_filtradas_${new Date().toISOString().slice(0, 10)}.xlsx`);
  }

  /* API pública */
  return {
    render, afterRender,
    filtrar, filtrarDebounced, limpar, set, ordenarPor, exportar,
    pagina,
    // expostos para reuso / testes no console
    fromSeed, fromState, consolidarReceitas, consolidarDespesas, alinharPorMesCalendario, calcularKPIs, aplicarFiltros, getDataset,
  };
})();
window.PainelAnalitico = PainelAnalitico;

</script>
</body>
</html>
