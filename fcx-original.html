<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo de Caixa — Esposende LTDA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg: #EEF0F7;
  --bg-2: #E7EAF5;
  --panel: #FFFFFF;
  --ink: #171A2B;
  --ink-soft: #62667C;
  --ink-faint: #9598AA;
  --line: #E4E6F0;
  --line-soft: #EDEEF6;
  --brand: #1B2262;
  --brand-2: #2A337F;
  --brand-light: #3D48A6;
  --brand-deep: #0F1338;
  --gold: #C9993A;
  --gold-2: #B7862A;
  --gold-soft: #FBF1DC;
  --green: #1F8354;
  --green-soft: #E2F4EA;
  --red: #C0463A;
  --red-soft: #FBEAE7;
  --blue-soft: #E7EBFC;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow-xs: 0 1px 2px rgba(15,19,56,0.05);
  --shadow-sm: 0 2px 6px -2px rgba(15,19,56,0.10), 0 1px 2px rgba(15,19,56,0.06);
  --shadow-md: 0 12px 28px -12px rgba(15,19,56,0.22), 0 2px 6px -1px rgba(15,19,56,0.08);
  --shadow-lg: 0 24px 48px -18px rgba(15,19,56,0.30), 0 4px 10px -2px rgba(15,19,56,0.10);
  --ease: cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 480px at 12% -10%, rgba(61,72,166,0.10), transparent 60%),
    radial-gradient(900px 420px at 100% 0%, rgba(201,153,58,0.08), transparent 55%),
    var(--bg);
  color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Fraunces',serif;letter-spacing:-0.01em;}
#app{max-width:1220px;margin:0 auto;padding:0 20px 90px;}
::selection{background:var(--brand-light);color:#fff;}

/* ---- top bar ---- */
.topbar{
  background:linear-gradient(135deg, var(--brand-deep) 0%, var(--brand) 62%, var(--brand-2) 100%);
  color:#F2F3F8;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 4px 18px -6px rgba(15,19,56,0.35);
  position:relative;
}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--gold),transparent 70%);opacity:.7;}
.topbar-inner{max-width:1220px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{height:32px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.25));}
.brand .sub{font-size:11.5px;color:#B9BEE0;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;border-left:1px solid rgba(255,255,255,0.18);padding-left:12px;}
.topbar-tag{font-size:11.5px;color:#B9BEE0;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.06);padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);}
.topbar-tag .dot{width:7px;height:7px;border-radius:50%;background:#4ADE94;display:inline-block;transition:background .2s;box-shadow:0 0 0 3px rgba(74,222,148,0.18);}
.topbar-tag.unsaved .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(201,153,58,0.22);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

/* ---- nav ---- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px;margin-bottom:24px;box-shadow:var(--shadow-sm);}
.tab-btn{border:none;background:transparent;color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:9px;cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease);white-space:nowrap;}
.tab-btn:hover{background:var(--bg-2);color:var(--ink);}
.tab-btn.active{background:var(--brand);color:#fff;box-shadow:var(--shadow-xs);}

/* ---- cards / panels ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm);transition:box-shadow .2s var(--ease);}
.panel h2{margin:0 0 4px;font-size:19px;font-weight:650;color:var(--brand-deep);letter-spacing:-0.01em;}
.panel .desc{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;line-height:1.55;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* ---- form controls ---- */
label{display:block;font-size:11px;font-weight:650;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.045em;margin-bottom:7px;}
input[type=text],input[type=number],input[type=date],input[type=month],select,input[type=file]{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  font-family:'Inter',sans-serif;font-size:14px;background:#FBFBFD;color:var(--ink);
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
}
input:hover,select:hover{border-color:#C7CBE2;}
input:focus,select:focus{outline:none;border-color:var(--brand-light);box-shadow:0 0 0 3.5px rgba(61,72,166,0.14);background:#fff;}
.field{margin-bottom:14px;}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10.5px 18px;font-family:'Inter';font-weight:650;font-size:13.5px;cursor:pointer;transition:background .18s var(--ease),box-shadow .18s var(--ease),transform .12s var(--ease);box-shadow:var(--shadow-xs);}
.btn:hover{background:var(--brand-2);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#2B2100;}
.btn.gold:hover{filter:brightness(1.05);}
.btn.secondary{background:#fff;color:var(--brand);border:1.5px solid var(--line);box-shadow:none;}
.btn.secondary:hover{background:var(--blue-soft);border-color:var(--brand-light);transform:translateY(-1px);}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red-soft);padding:6px 11px;font-size:12.5px;box-shadow:none;}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red);transform:none;}
.btn.small{padding:7px 12px;font-size:12.5px;}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);border-bottom:1.5px solid var(--line);padding:9px 10px;font-weight:700;}
td{padding:10px 10px;border-bottom:1px solid var(--line-soft);}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s var(--ease);}
tbody tr:hover{background:#FAFAFD;}
.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.pos{color:var(--green);}
.neg{color:var(--red);}
.scroll-table{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);}

/* ---- pills / segmented control ---- */
.segmented{display:inline-flex;background:var(--bg-2);border-radius:11px;padding:3px;gap:2px;border:1px solid var(--line-soft);}
.segmented button{border:none;background:transparent;padding:8px 15px;border-radius:8px;font-family:'Inter';font-size:13px;font-weight:650;color:var(--ink-soft);cursor:pointer;transition:all .16s var(--ease);}
.segmented button:hover{color:var(--ink);}
.segmented button.active{background:var(--panel);color:var(--brand);box-shadow:0 1px 4px rgba(15,19,56,0.14);}

.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:0.02em;}
.badge.green{background:var(--green-soft);color:var(--green);}
.badge.red{background:var(--red-soft);color:var(--red);}
.badge.gold{background:var(--gold-soft);color:#8A6417;}
.badge.grey{background:#EEEFF6;color:var(--ink-soft);}
.badge.blue{background:var(--blue-soft);color:var(--brand);}

/* ---- landing screen ---- */
.landing{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px;}
.landing.landing-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:960px){.landing.landing-3{grid-template-columns:1fr 1fr;}}
@media(max-width:720px){.landing{grid-template-columns:1fr;}}
.landing-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease);position:relative;overflow:hidden;}
.landing-card::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg, rgba(27,34,98,0.035), transparent 55%);opacity:0;transition:opacity .2s var(--ease);}
.landing-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:transparent;}
.landing-card:hover::before{opacity:1;}
.landing-card .eyebrow{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-2);margin-bottom:12px;font-weight:600;}
.landing-card h3{font-size:23px;margin:0 0 10px;color:var(--brand-deep);}
.landing-card p{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:0 0 20px;}
.landing-card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 4px 4px 0;}
.landing-card.view .stripe{background:linear-gradient(var(--green),#12603D);}
.landing-card.orcamento .stripe{background:linear-gradient(var(--brand),var(--brand-deep));}
.landing-card.manage .stripe{background:linear-gradient(var(--gold),var(--gold-2));}
.landing-card .btn.secondary{position:relative;z-index:1;}

/* stat boxes */
.stat{background:#FAFAFD;border:1px solid var(--line);border-radius:12px;padding:15px 17px;transition:box-shadow .18s var(--ease), transform .18s var(--ease);}
.stat:hover{box-shadow:var(--shadow-xs);}
.stat .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.045em;color:var(--ink-faint);font-weight:700;margin-bottom:7px;}
.stat .val{font-family:'IBM Plex Mono';font-size:21px;font-weight:650;letter-spacing:-0.01em;}

.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px;border:1.5px dashed var(--line);border-radius:var(--radius-sm);background:#FAFAFD;}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.55;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.row-flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.chart-wrap{position:relative;height:260px;margin-top:6px;}
.savebar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(238,240,247,0),var(--bg) 35%);padding:16px 0 0;text-align:right;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--brand-deep);color:#fff;padding:13px 20px;border-radius:11px;font-size:13.5px;font-weight:550;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(10px);transition:all .3s var(--ease);pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateY(0);}
.backlink{background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:650;cursor:pointer;padding:0;margin-bottom:16px;display:inline-flex;align-items:center;gap:5px;transition:color .15s var(--ease);}
.backlink:hover{color:var(--brand);}
.dropzone{border:2px dashed var(--line);border-radius:var(--radius-sm);padding:24px;text-align:center;background:#FAFAFD;transition:border-color .18s var(--ease), background .18s var(--ease);}
.dropzone:hover{border-color:var(--brand-light);background:var(--blue-soft);}
.dropzone.drag{border-color:var(--gold);background:var(--gold-soft);}
.small-select{max-width:220px;}
.subtle-btn{background:none;border:none;color:var(--brand);font-weight:650;font-size:12.5px;cursor:pointer;transition:opacity .15s var(--ease);}
.subtle-btn:hover{opacity:.7;}

/* ---- Painel analítico ---- */
.landing.landing-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1100px){.landing.landing-4{grid-template-columns:1fr 1fr;}}
@media(max-width:720px){.landing.landing-4{grid-template-columns:1fr;}}
.landing-card.analise .stripe{background:linear-gradient(var(--brand-light),var(--brand));}
.pa-kpi .val{font-size:19px;}
.pa-sub{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.4;}
.pa-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.pa-inline{display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;font-size:12.5px;}
.pa-inline input{width:72px;padding:7px 8px;}
.pa-resumo{font-size:13px;color:var(--ink-soft);margin-top:12px;}
.pa-filtros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;margin-bottom:12px;}
@media(max-width:900px){.pa-filtros{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.pa-filtros{grid-template-columns:1fr;}}
.pa-sort{cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1;}
.pa-sort:hover{color:var(--brand);}
.pa-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;}
.pa-obs{max-width:240px;color:var(--ink-soft);font-size:12.5px;}
.pa-pag{margin-top:12px;}
.btn[disabled]{opacity:.45;pointer-events:none;}
tfoot td{border-top:1.5px solid var(--line);background:#FAFAFD;position:sticky;bottom:0;}

@media print{
  .no-print, .topbar, .tabs, .toast{ display:none !important; }
  body{ background:#fff; }
  #app{ max-width:100%; padding:0; }
  .panel{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; margin-bottom:14px; }
  .chart-wrap{ height:220px; }
  table{ font-size:11px; }
  .scroll-table{ max-height:none; overflow:visible; border:none; }
  a[href]:after{ content:""; }
}
</style>
</head>

/* ---------- utilidades numéricas / formatação ---------- */
const BRL = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const PCT = n => ((n||0)*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';

/* ---------- datas ---------- */
function pad(n){return String(n).padStart(2,'0');}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtDate(iso){const d=fromISO(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function fmtDateShort(iso){const d=fromISO(iso);const dias=['dom','seg','ter','qua','qui','sex','sáb'];return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' ('+dias[d.getDay()]+')';}
function weekdayName(d){return ['domingo','segunda','terça','quarta','quinta','sexta','sábado'][d.getDay()];}
function isoWeekKey(d){const day=(d.getDay()+6)%7;const monday=addDays(d,-day);return toISO(monday);}
function monthKey(iso){return iso.slice(0,7);}
function monthLabel(mk){const [y,m]=mk.split('-');return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][m-1]+'/'+y;}
function prevMonthKey(mk){const [y,m]=mk.split('-').map(Number); const d=new Date(y,m-2,1); return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function shiftMonthKey(mk,delta){const [y,m]=mk.split('-').map(Number); const d=new Date(y,m-1+delta,1); return d.getFullYear()+'-'+pad(d.getMonth()+1);}

/* ---------- feriados nacionais (calendário bancário FEBRABAN) ---------- */
function easterDate(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}
const _holidayCache = {};
function nationalHolidays(year){
  if(_holidayCache[year]) return _holidayCache[year];
  const easter = easterDate(year);
  const list = [
    new Date(year,0,1), addDays(easter,-48), addDays(easter,-47), addDays(easter,-2),
    addDays(easter,60), new Date(year,3,21), new Date(year,4,1), new Date(year,8,7),
    new Date(year,9,12), new Date(year,10,2), new Date(year,10,15), new Date(year,10,20),
    new Date(year,11,25),
  ];
  const set = new Set(list.map(toISO));
  _holidayCache[year]=set;
  return set;
}
function isHoliday(d){return nationalHolidays(d.getFullYear()).has(toISO(d));}
function isBusinessDay(d){const wd=d.getDay();return wd!==0 && wd!==6 && !isHoliday(d);}
function addBusinessDays(d,n){
  let r=new Date(d),count=0; const step=n>=0?1:-1; n=Math.abs(n);
  while(count<n){ r=addDays(r,step); if(isBusinessDay(r)) count++; }
  return r;
}
// Realoca uma data para o próximo dia útil caso caia em fim de semana ou feriado.
function nextBusinessDay(d){
  let r = new Date(d);
  while(!isBusinessDay(r)) r = addDays(r,1);
  return r;
}
function weekOfMonth(d){ return Math.ceil(d.getDate()/7); }

// já passou — representa o saldo devedor em aberto.
function isVencido(s){
  if(s.tipo==='pago') return false;
  return fromISO(s.date) < fromISO(toISO(new Date()));
}

function seedIfEmpty(){
  // vendas históricas (referência)
  if(state.salesHistory.length===0){
    state.salesHistory = SEED.salesHistory.map(row=>{
      const values={};
      SEED.methodKeys.forEach((k,i)=>values[k]=row[i+1]);
      return {date:row[0], values};
    });
  }
  // plano de contas / centros de custo
  if(!state.config) state.config = {accounts:[], costCenters:[]};
  if(state.config.accounts.length===0) state.config.accounts = SEED.accounts.slice();
  if(state.config.costCenters.length===0) state.config.costCenters = SEED.costCenters.slice();
  if(!state.config.accounts.includes(CONTA_REPASSE)) state.config.accounts.push(CONTA_REPASSE);
  // catálogo oficial de plano de contas / centros de custo — mescla (nunca remove)
  CATALOGO_OFICIAL.contas.forEach(c=>{ if(!state.config.accounts.includes(c)) state.config.accounts.push(c); });
  CATALOGO_OFICIAL.centros.forEach(c=>{ if(!state.config.costCenters.includes(c)) state.config.costCenters.push(c); });
  // saídas
  if(state.saidas.length===0){
    state.saidas = SEED.saidas.map(r=>({
      id:uid(), date:r[0], conta:SEED.accounts[r[1]], centro:SEED.costCenters[r[2]],
      tipo:r[3]===1?'efetivo':'previsto', valor:r[4], fornecedor:SEED.fornecedores[r[5]], obs:r[6]
    }));
  }
}

async function loadAll(){
  // Para cada chave: 'found' (leu com sucesso), 'absent' (confirmado que não
  // existe ainda) ou 'error' (falha ao ler — estado desconhecido). Só
  // regravamos uma chave quando ela está confirmadamente 'absent'; em caso
  // de erro, NUNCA escrevemos por cima, para não arriscar apagar dados reais.
  const status = {};
  async function loadKey(key, applyDefault){
    try{
      const r = await window.storage.get(key,true);
      if(r){ status[key]='found'; return JSON.parse(r.value); }
      status[key]='absent'; return applyDefault();
    }catch(e){ status[key]='error'; return applyDefault(); }
  }
  state.config = await loadKey('esp2:config', ()=>null);
  state.salesHistory = await loadKey('esp2:salesHistory', ()=>[]);
  state.monthMeta = await loadKey('esp2:monthMeta', ()=>({}));
  state.weightsByMonth = await loadKey('esp2:weightsByMonth', ()=>({}));
  state.prestacaoModalidadePct = await loadKey('esp2:prestacaoModalidadePct', ()=>({}));
  state.monthParams = await loadKey('esp2:monthParams', ()=>({}));
  state.saidas = await loadKey('esp2:saidas', ()=>[]);
  state.orcamento = await loadKey('esp2:orcamento', ()=>({}));
  seedIfEmpty();
  state.loaded = true;
  try{
    if(status['esp2:config']==='absent') await window.storage.set('esp2:config', JSON.stringify(state.config), true);
    if(status['esp2:salesHistory']==='absent') await window.storage.set('esp2:salesHistory', JSON.stringify(state.salesHistory), true);
    if(status['esp2:monthMeta']==='absent') await window.storage.set('esp2:monthMeta', JSON.stringify(state.monthMeta), true);
    if(status['esp2:weightsByMonth']==='absent') await window.storage.set('esp2:weightsByMonth', JSON.stringify(state.weightsByMonth), true);
    if(status['esp2:prestacaoModalidadePct']==='absent') await window.storage.set('esp2:prestacaoModalidadePct', JSON.stringify(state.prestacaoModalidadePct), true);
    if(status['esp2:monthParams']==='absent') await window.storage.set('esp2:monthParams', JSON.stringify(state.monthParams), true);
    if(status['esp2:saidas']==='absent') await window.storage.set('esp2:saidas', JSON.stringify(state.saidas), true);
    if(status['esp2:orcamento']==='absent') await window.storage.set('esp2:orcamento', JSON.stringify(state.orcamento), true);
  }catch(e){ /* ok, a próxima edição do usuário aciona o autosave normalmente */ }
}

// ---- gravação automática (debounced) ----
// Garante que qualquer alteração feita na ferramenta seja persistida pouco
// depois de o usuário parar de digitar/editar, sem depender de clicar em
// "Salvar". Os botões de salvar continuam existindo para dar uma confirmação
// explícita, mas a gravação em si acontece sozinha em segundo plano.
let _autosaveTimer = null;
let _autosavePending = false;
async function persistAll(){
  try{
    await window.storage.set('esp2:config', JSON.stringify(state.config), true);
    await window.storage.set('esp2:salesHistory', JSON.stringify(state.salesHistory), true);
    await window.storage.set('esp2:monthMeta', JSON.stringify(state.monthMeta), true);
    await window.storage.set('esp2:weightsByMonth', JSON.stringify(state.weightsByMonth), true);
    await window.storage.set('esp2:prestacaoModalidadePct', JSON.stringify(state.prestacaoModalidadePct), true);
    await window.storage.set('esp2:monthParams', JSON.stringify(state.monthParams), true);
    await window.storage.set('esp2:saidas', JSON.stringify(state.saidas), true);
    await window.storage.set('esp2:orcamento', JSON.stringify(state.orcamento), true);
    setSaveDot(false);
  }catch(e){ setSaveDot(true, true); /* tenta novamente na próxima alteração */ }
}
function setSaveDot(unsaved, error){
  const dot = document.getElementById('saveDot');
  if(!dot) return;
  dot.classList.toggle('unsaved', !!unsaved);
  dot.innerHTML = '<span class="dot"></span> ' + (error? 'erro ao salvar — tentando de novo' : unsaved? 'salvando…' : 'tudo salvo');
}
function scheduleAutosave(){
  _autosavePending = true;
  setSaveDot(true);
  clearTimeout(_autosaveTimer);
  _autosaveTimer = setTimeout(async ()=>{
    await persistAll();
    _autosavePending = false;
    showToast('✓ Alterações salvas');
  }, 900);
}
window.addEventListener('beforeunload', function(){ if(_autosavePending) persistAll(); });

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* =========================================================
   MOTOR DE CÁLCULO
   ========================================================= */

// Estatísticas históricas — mantidas apenas como referência informativa
// (não alimentam mais a projeção, que agora usa Meta comercial + Pesos).
function computeHistMonthStats(mk){
  const rows = state.salesHistory.filter(r=>monthKey(r.date)===mk);
  const totalPorMetodo = {};
  let total = 0;
  rows.forEach(r=>{
    Object.keys(r.values).forEach(k=>{
      if(EXCLUDED_METHODS.has(k)) return;
      const v = Number(r.values[k])||0;
      totalPorMetodo[k] = (totalPorMetodo[k]||0)+v;
      total += v;
    });
  });
  const participacao = {};
  Object.keys(totalPorMetodo).forEach(k=>{ participacao[k] = total? totalPorMetodo[k]/total : 0; });
  return {total, participacao, dias: rows.length};
}

function allMethodIds(){
  const ids = new Set(Object.keys(METHOD_LABELS));
  state.salesHistory.forEach(r=>Object.keys(r.values).forEach(k=>{ if(!EXCLUDED_METHODS.has(k)) ids.add(k); }));
  EXCLUDED_METHODS.forEach(k=>ids.delete(k));
  return Array.from(ids);
}

// Cria (se não existir) os parâmetros de Meios de Pagamento do mês-alvo
// (participação / taxa / prazo / gera caixa), pré-preenchidos a partir do
// mesmo mês do ano anterior no histórico, apenas como ponto de partida.
function ensureMonthParams(mk){
  if(state.monthParams[mk]) return state.monthParams[mk];
  const [y,m] = mk.split('-').map(Number);
  const refMonth = (y-1)+'-'+pad(m);
  const stats = computeHistMonthStats(refMonth);
  const methods = {};
  allMethodIds().forEach(id=>{
    const defaults = DEFAULT_TAXA_PRAZO[id] || {taxa:0, prazo:1};
    methods[id] = {
      participacao: id==='esposende_card' ? 0 : (stats.participacao[id] || 0),
      taxa: defaults.taxa,
      prazo: defaults.prazo,
      geraCaixa: !NON_CASH_METHODS.has(id),
    };
  });
  state.monthParams[mk] = {methods};
  return state.monthParams[mk];
}

// Parâmetro 1 — meta comercial do mês e redutor de caixa
function ensureMonthMeta(mk){
  if(!state.monthMeta[mk]) state.monthMeta[mk] = {metaComercial:0, redutorPct:0};
  return state.monthMeta[mk];
}
function metaCaixaDoMes(mk){
  const mm = ensureMonthMeta(mk);
  return (Number(mm.metaComercial)||0) * (1-(Number(mm.redutorPct)||0));
}

// Parâmetro 2 — peso de cada dia do mês (soma dos pesos do mês)
function pesosDoMes(mk){ return state.weightsByMonth[mk] || {}; }
function somaPesosDoMes(mk){
  const pesos = pesosDoMes(mk);
  return Object.values(pesos).reduce((a,v)=>a+(Number(v)||0),0);
}

// Parâmetro 3 — % de impacto no caixa (total) + distribuição por modalidade
// Estrutura: {totalPct, dinheiro, pix, debito} — dinheiro+pix+debito devem
// somar 100% (é a distribuição DENTRO do totalPct, não um % direto do caixa).
function getPrestacaoModalidade(dateISO){
  return state.prestacaoModalidadePct[dateISO] || {totalPct:0, dinheiro:0, pix:0, debito:0};
}
function totalPrestacaoPctDia(dateISO){
  return Number(getPrestacaoModalidade(dateISO).totalPct)||0;
}
function somaDistribuicaoDia(dateISO){
  const p = getPrestacaoModalidade(dateISO);
  return MODALIDADES_PRESTACAO.reduce((a,k)=>a+(Number(p[k])||0),0);
}
// Retorna o valor em R$ que cada modalidade recebe naquele dia, dado o valor
// da Meta de Caixa do dia.
function prestacaoExtraPorModalidade(dateISO, metaCaixaDia){
  const p = getPrestacaoModalidade(dateISO);
  const totalExtra = metaCaixaDia*(Number(p.totalPct)||0);
  const out = {total: totalExtra};
  MODALIDADES_PRESTACAO.forEach(k=>{ out[k] = totalExtra*(Number(p[k])||0); });
  return out;
}

// Regra de pagamento do repasse de prestação (regra fixa, sempre a mesma):
// Crédito na conta = 1º dia útil após a venda. Pagamento do repasse = 2 dias
// úteis após o crédito na conta. (addBusinessDays já pula fins de semana e
// os feriados nacionais.)
function prestacaoEntradaDate(dataVenda){
  return addBusinessDays(dataVenda, 1);
}
function prestacaoPaymentDate(dataVenda){
  return addBusinessDays(prestacaoEntradaDate(dataVenda), 2);
}

// Constrói o livro de eventos de caixa para o intervalo [startISO,endISO]
// Calcula o Realizado (status Pago) por conta+centro para um mês, somando
// pelas datas reais dos lançamentos (não pela data ajustada de dia útil).
function realizadoPagoDoMes(mk){
  const out = {}; // key -> {conta,centro,valor}
  state.saidas.forEach(s=>{
    if(s.tipo!=='pago') return;
    if(monthKey(s.date)!==mk) return;
    const k = orcKey(s.conta, s.centro);
    if(!out[k]) out[k] = {conta:s.conta, centro:s.centro||'', valor:0};
    out[k].valor += Number(s.valor)||0;
  });
  return out;
}

// Monta as linhas de Orçado x Realizado para um mês (ou fatia de dias dele,
// no caso da visão semanal), agrupando por Conta Contábil ou por Centro de
// Custo. O orçado é fatiado proporcionalmente pelo número de dias do
// intervalo em relação ao mês inteiro.
function buildOrcamentoRows(mk, startDay, endDay, groupBy, centroFiltro){
  const orcMonth = state.orcamento[mk] || {};

  // O orçado é sempre o valor cheio do mês (nunca fatiado por semana) — só o
  // realizado é filtrado pelo intervalo de dias pedido (útil na visão semanal).
  const realizado = {};
  state.saidas.forEach(s=>{
    if(s.tipo!=='pago') return;
    if(monthKey(s.date)!==mk) return;
    const dia = fromISO(s.date).getDate();
    if(dia<startDay || dia>endDay) return;
    const k = orcKey(s.conta, s.centro);
    realizado[k] = (realizado[k]||0) + (Number(s.valor)||0);
  });

  const allKeys = new Set([...Object.keys(orcMonth), ...Object.keys(realizado)]);
  const linhas = [];
  allKeys.forEach(k=>{
    const idx = k.indexOf(ORC_SEP);
    const conta = k.slice(0,idx), centro = k.slice(idx+ORC_SEP.length);
    if(centroFiltro && centro!==centroFiltro) return;
    const orcadoMes = orcamentoEfetivo(orcMonth[k]);
    if(orcadoMes<=0 && !(realizado[k]>0)) return;
    linhas.push({conta, centro, orcado: orcadoMes, realizado: realizado[k]||0});
  });

  let agrupado;
  if(groupBy==='centro'){
    const g = {};
    linhas.forEach(r=>{
      const key = r.centro || '(sem centro de custo)';
      if(!g[key]) g[key]={label:key, orcado:0, realizado:0};
      g[key].orcado += r.orcado; g[key].realizado += r.realizado;
    });
    agrupado = Object.values(g);
  }else{
    agrupado = linhas.map(r=>({label:r.conta, orcado:r.orcado, realizado:r.realizado}));
  }
  agrupado.sort((a,b)=>b.orcado-a.orcado);
  const totalOrcado = agrupado.reduce((a,r)=>a+r.orcado,0);
  const totalRealizado = agrupado.reduce((a,r)=>a+r.realizado,0);
  return {rows:agrupado, totalOrcado, totalRealizado};
}

function buildCashBook(startISO, endISO, centroFiltro, tipoSaidaFiltro, saidaGroupBy, considerarVencidos){
  const start = fromISO(startISO), end = fromISO(endISO);
  const book = {};
  function ensure(iso){ if(!book[iso]) book[iso]={entradas:{},saidas:{},entradasTotal:0,saidasTotal:0,semCaixa:0}; return book[iso]; }
  function addEntrada(iso,chave,valor){ const b=ensure(iso); b.entradas[chave]=(b.entradas[chave]||0)+valor; b.entradasTotal+=valor; }
  function addSaida(iso,chave,valor){ const b=ensure(iso); b.saidas[chave]=(b.saidas[chave]||0)+valor; b.saidasTotal+=valor; }
  function addSemCaixa(iso,valor){ ensure(iso).semCaixa += valor; }

  // Datas que já têm lançamento (efetivo OU previsto) na conta de repasse da
  // Credsystem — nesses dias, a projeção automática do Parâmetro 3 não deve
  // ser somada por cima, para não duplicar. O que já está lançado manualmente
  // prevalece; a projeção só entra em dias sem nada lançado ainda.
  const datasComRepasseManual = new Set(
    state.saidas.filter(s=>s.conta===CONTA_REPASSE).map(s=>toISO(nextBusinessDay(fromISO(s.date))))
  );

  // --- 1) vendas projetadas (Parâmetro 1 + 2) + prestação por modalidade (Parâmetro 3) ---
  // percorre os meses cobertos pelo intervalo (com folga p/ prazos de recebimento)
  let cursor = new Date(start.getFullYear(), start.getMonth()-2, 1);
  const limite = new Date(end.getFullYear(), end.getMonth()+1, 1);
  while(cursor < limite){
    const mk = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
    const metaCaixa = metaCaixaDoMes(mk);
    const pesos = pesosDoMes(mk);
    if(metaCaixa>0 && Object.keys(pesos).length>0 && state.monthParams[mk]){
      const methodsEff = state.monthParams[mk].methods;
      const diasNoMes = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
      for(let dia=1; dia<=diasNoMes; dia++){
        const peso = Number(pesos[dia])||0;
        if(peso<=0) continue;
        const vendaBrutaDia = peso*metaCaixa;
        const dataVenda = new Date(cursor.getFullYear(), cursor.getMonth(), dia);
        const isoVenda = toISO(dataVenda);
        const prestExtra = prestacaoExtraPorModalidade(isoVenda, vendaBrutaDia);

        Object.keys(methodsEff).filter(id=>!EXCLUDED_METHODS.has(id)).forEach(id=>{
          const mp = methodsEff[id];
          const bruto = vendaBrutaDia*(Number(mp.participacao)||0);
          const prestBruto = MODALIDADES_PRESTACAO.includes(id) ? (prestExtra[id]||0) : 0;
          if(!mp.geraCaixa){
            if(dataVenda>=start && dataVenda<=end) addSemCaixa(isoVenda, bruto);
            return;
          }
          // sempre cai em dia útil, respeitando o prazo cadastrado em Meios
          // de Pagamento — vale tanto para venda quanto para prestação
          // (prazo 0 = 1º dia útil a partir da venda, nunca um fim de
          // semana/feriado).
          const dataReceb = nextBusinessDay(addBusinessDays(dataVenda, Number(mp.prazo)||0));
          const isoReceb = toISO(dataReceb);
          if(dataReceb>=start && dataReceb<=end){
            addEntrada(isoReceb, 'pgto:'+id, bruto*(1-(Number(mp.taxa)||0)));
            if(prestBruto>0) addEntrada(isoReceb, 'prestacao_entrada:'+id, prestBruto*(1-(Number(mp.taxa)||0)));
          }
        });

        // repasse da prestação (saída) — regra fixa, ancorada na data da venda
        // só entra se não houver nada já lançado manualmente naquele dia
        const totalPrest = prestExtra.total;
        if(totalPrest>0){
          const dSaida = prestacaoPaymentDate(dataVenda);
          const isoSaida = toISO(dSaida);
          if(!datasComRepasseManual.has(isoSaida) && dSaida>=start && dSaida<=end){
            addSaida(isoSaida, 'prestacao_repasse:'+CONTA_REPASSE, totalPrest);
          }
        }
      }
    }
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }

  // --- 2) saídas por conta contábil / centro de custo ---
  // vencimentos em fim de semana/feriado são realocados para o próximo dia útil
  state.saidas.forEach(s=>{
    let d = fromISO(s.date);
    d = nextBusinessDay(d);
    if(d<start || d>end) return;
    if(centroFiltro && s.centro!==centroFiltro) return;
    if(tipoSaidaFiltro==='vencido'){ if(!isVencido(s)) return; }
    else if(tipoSaidaFiltro && s.tipo!==tipoSaidaFiltro) return;
    if(considerarVencidos===false && isVencido(s)) return;
    const valor = Number(s.valor)||0;
    const rotulo = saidaGroupBy==='descricao' ? (s.obs || s.fornecedor || '(sem descrição)') : s.conta;
    addSaida(toISO(d), 'conta:'+rotulo+':'+s.tipo, valor);
  });

  return book;
}

function dateRangeISO(startISO,endISO){
  const out=[]; let d=fromISO(startISO); const end=fromISO(endISO);
  while(d<=end){ out.push(toISO(d)); d=addDays(d,1); }
  return out;
}

function buildAggregated(startISO,endISO,granularity,centroFiltro,tipoSaidaFiltro,saidaGroupBy,considerarVencidos){
  const book = buildCashBook(startISO,endISO,centroFiltro,tipoSaidaFiltro,saidaGroupBy,considerarVencidos);
  const dias = dateRangeISO(startISO,endISO);
  const buckets = {};
  dias.forEach(iso=>{
    let key,label,order; const d=fromISO(iso);
    if(granularity==='dia'){ key=iso; label=fmtDateShort(iso); order=iso; }
    else if(granularity==='semana'){ const wn=weekOfMonth(d); key=monthKey(iso)+'-S'+wn; label='Semana '+wn+' — '+monthLabel(monthKey(iso)); order=key; }
    else { key=monthKey(iso); label=monthLabel(key); order=key; }
    if(!buckets[key]) buckets[key]={key,label,order,monthK:monthKey(iso),entradas:0,saidas:0,semCaixa:0,detalheEntradas:{},detalheSaidas:{}};
    const b=book[iso];
    if(b){
      buckets[key].entradas+=b.entradasTotal;
      buckets[key].saidas+=b.saidasTotal;
      buckets[key].semCaixa+=(b.semCaixa||0);
      Object.keys(b.entradas).forEach(k=>{ buckets[key].detalheEntradas[k]=(buckets[key].detalheEntradas[k]||0)+b.entradas[k]; });
      Object.keys(b.saidas).forEach(k=>{ buckets[key].detalheSaidas[k]=(buckets[key].detalheSaidas[k]||0)+b.saidas[k]; });
    }
  });
  const arr = Object.values(buckets).sort((a,b)=>a.order<b.order?-1:1);
  let acc=0; arr.forEach(b=>{ b.saldo=b.entradas-b.saidas; acc+=b.saldo; b.acumulado=acc; });
  return arr;
}

function tipoLabel(tipo){ return tipo==='pago'?'Pago':tipo==='efetivo'?'Efetivo':'Previsto'; }
function labelForKey(k){
  if(k.startsWith('pgto:')) return (METHOD_LABELS[k.slice(5)]||k.slice(5))+' (líquido)';
  if(k.startsWith('prestacao_entrada:')) return 'Prestação recebida via '+(METHOD_LABELS[k.slice('prestacao_entrada:'.length)]||k);
  if(k.startsWith('prestacao_repasse:')) return k.slice('prestacao_repasse:'.length);
  if(k.startsWith('conta:')){
    const parts = k.split(':'); const tipo = parts.pop(); const conta = parts.slice(1).join(':');
    return conta+' — '+tipoLabel(tipo);
  }
  return k;
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML='<div style="padding:80px;text-align:center;color:#5B5F76;">Carregando dados…</div>'; return; }
  let html = topbarHTML();
  if(state.screen==='landing') html += renderLanding();
  else if(state.screen==='view') html += renderViewScreen();
  else if(state.screen==='orcamento') html += renderOrcamentoScreen();
  else if(state.screen==='manage') html += renderManageScreen();
  else if(state.screen==='analise') html += PainelAnalitico.render();   // ← Painel analítico
  app.innerHTML = html;
  afterRender();
}
function topbarHTML(){
  return `<div class="topbar"><div class="topbar-inner">
    <div class="brand"><img src="${LOGO_SRC}" alt="Esposende"><span class="sub">Fluxo de Caixa</span></div>
    <div class="topbar-tag" id="saveDot"><span class="dot"></span> tudo salvo</div>
  </div></div>`;
}
function goto(screen,tab){ state.screen=screen; if(tab) state.tab=tab; render(); window.scrollTo({top:0,behavior:'smooth'}); }
window.goto = goto;

function renderLanding(){
  return `<div class="landing landing-4">
    <div class="landing-card view" onclick="goto('view')">
      <div class="stripe"></div>
      <div class="eyebrow">Consulta</div>
      <h3>Ver fluxo de caixa</h3>
      <p>Visão do caixa projetado por dia, semana ou mês — resumida ou detalhada por meio de pagamento, conta contábil e centro de custo.</p>
      <span class="btn secondary">Abrir visão →</span>
    </div>
    <div class="landing-card orcamento" onclick="goto('orcamento')">
      <div class="stripe"></div>
      <div class="eyebrow">Consulta</div>
      <h3>Orçamento de Caixa</h3>
      <p>Orçado x Realizado (status Pago), por conta contábil e centro de custo, com visão mensal ou semanal.</p>
      <span class="btn secondary">Abrir orçamento →</span>
    </div>
    <div class="landing-card analise" onclick="goto('analise')">
      <div class="stripe"></div>
      <div class="eyebrow">Análise</div>
      <h3>Painel analítico</h3>
      <p>KPIs, Receitas × Despesas, distribuição por categoria e fornecedor, e consulta filtrável das saídas.</p>
      <span class="btn secondary">Abrir painel →</span>
    </div>
    <div class="landing-card manage" onclick="goto('manage')">
      <div class="stripe"></div>
      <div class="eyebrow">Manutenção</div>
      <h3>Gerenciar dados</h3>
      <p>Atualize o histórico de vendas, os parâmetros de cada mês, a prestação de clientes, as saídas e o orçamento por conta e centro de custo.</p>
      <span class="btn secondary">Abrir gestão →</span>
    </div>
  </div>
  <div style="text-align:center;margin-top:28px;">
    <button class="btn danger" style="border-color:var(--line);" onclick="abrirModalReset()">🗑️ Zerar todos os dados e começar do zero</button>
  </div>
  ${renderResetModal()}`;
}
function afterRender(){
  if(state.screen==='view') drawChart();
  if(state.screen==='analise') PainelAnalitico.afterRender();   // ← Painel analítico
}

   ========================================================= */
function shiftAnchor(delta){
  const g=state.dashView;
  if(g==='dia'){ state.dashAnchor = toISO(addDays(fromISO(state.dashAnchor), delta*7)); }
  else if(g==='semana'){ const mk=shiftMonthKey(monthKey(state.dashAnchor), delta); state.dashAnchor = mk+'-01'; }
  else { const mk=shiftMonthKey(monthKey(state.dashAnchor), delta*3); state.dashAnchor = mk+'-01'; }
  render();
}
window.shiftAnchor = shiftAnchor;
function setDashView(v){ state.dashView=v; render(); } window.setDashView=setDashView;
function setDashDetail(v){ state.dashDetail=v; render(); } window.setDashDetail=setDashDetail;

function setDashConsiderarVencidos(v){ state.dashConsiderarVencidos=v; render(); } window.setDashConsiderarVencidos=setDashConsiderarVencidos;

function computeRangeForView(){
  const anchor = fromISO(state.dashAnchor);
  if(state.dashView==='dia') return [toISO(addDays(anchor,-6)), toISO(addDays(anchor,7))];
  const y=anchor.getFullYear(), m=anchor.getMonth();
  if(state.dashView==='semana') return [toISO(new Date(y,m,1)), toISO(new Date(y,m+1,0))];
  return [toISO(new Date(y,m-2,1)), toISO(new Date(y,m+3,0))];
}

function shiftOrcAnchor(delta){
  const mk = shiftMonthKey(monthKey(state.orcAnchor), delta);
  state.orcAnchor = mk+'-01';
  render();
}
window.shiftOrcAnchor = shiftOrcAnchor;
function shiftOrcWeek(delta){
  const d = fromISO(state.orcAnchor);
  const diasNoMes = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const semanaAtual = weekOfMonth(d);
  const totalSemanas = Math.ceil(diasNoMes/7);
  let novaSemana = semanaAtual + delta;
  let novoMes = monthKey(state.orcAnchor);
  if(novaSemana<1){ novoMes = shiftMonthKey(novoMes,-1); novaSemana = Math.ceil(new Date(fromISO(novoMes+'-01').getFullYear(), fromISO(novoMes+'-01').getMonth()+1, 0).getDate()/7); }
  else if(novaSemana>totalSemanas){ novoMes = shiftMonthKey(novoMes,1); novaSemana = 1; }
  const novoDia = Math.min((novaSemana-1)*7+1, new Date(fromISO(novoMes+'-01').getFullYear(), fromISO(novoMes+'-01').getMonth()+1,0).getDate());
  state.orcAnchor = novoMes+'-'+pad(novoDia);
  render();
}
window.shiftOrcWeek = shiftOrcWeek;

function renderAggTable(agg){
  const isSemana = state.dashView==='semana';
  let rows = '';
  let monthEntradas=0, monthSaidas=0, currentMonth=null;

  function monthTotalRow(mk){
    return `<tr style="background:#F0F0F7;font-weight:700;">
      <td>Total do mês — ${monthLabel(mk)}</td>
      <td class="num pos">${BRL(monthEntradas)}</td>
      <td class="num neg">${BRL(monthSaidas)}</td>
      <td class="num">${BRL(monthEntradas-monthSaidas)}</td>
      <td></td>
    </tr>`;
  }

  agg.forEach((b,idx)=>{
    if(isSemana){
      if(currentMonth!==null && b.monthK!==currentMonth){
        rows += monthTotalRow(currentMonth);
        monthEntradas=0; monthSaidas=0;
      }
      currentMonth = b.monthK;
      monthEntradas += b.entradas; monthSaidas += b.saidas;
    }
    let detailRow='';
    if(state.dashDetail==='detalhado'){
      const ent = Object.entries(b.detalheEntradas).filter(([k,v])=>Math.abs(v)>0.005).sort((a,b)=>b[1]-a[1]);
      const sai = Object.entries(b.detalheSaidas).filter(([k,v])=>Math.abs(v)>0.005).sort((a,b)=>b[1]-a[1]);
      const totalVendas = ent.filter(([k])=>k.startsWith('pgto:')).reduce((a,[,v])=>a+v,0);
      const totalPrestacao = ent.filter(([k])=>k.startsWith('prestacao_entrada:')).reduce((a,[,v])=>a+v,0);
      const totalizadorEnt = ent.length? `<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line);">
          <div class="row-flex" style="padding:2px 0;"><span style="font-weight:700;font-size:12.5px;">Vendas</span><span class="num pos" style="font-weight:700;font-size:12.5px;">${BRL(totalVendas)}</span></div>
          <div class="row-flex" style="padding:2px 0;"><span style="font-weight:700;font-size:12.5px;">Prestação prevista</span><span class="num pos" style="font-weight:700;font-size:12.5px;">${BRL(totalPrestacao)}</span></div>
        </div>` : '';
      const entHtml = ent.length? totalizadorEnt + ent.map(([k,v])=>`<div class="row-flex" style="padding:3px 0;"><span style="color:var(--ink-soft);font-size:12.5px;">${labelForKey(k)}</span><span class="num pos" style="font-size:12.5px;">${BRL(v)}</span></div>`).join('') : '<div class="hint">Sem entradas detalhadas</div>';
      const saiHtml = sai.length? sai.map(([k,v])=>`<div class="row-flex" style="padding:3px 0;"><span style="color:var(--ink-soft);font-size:12.5px;">${labelForKey(k)}</span><span class="num neg" style="font-size:12.5px;">${BRL(v)}</span></div>`).join('') : '<div class="hint">Sem saídas detalhadas</div>';
      detailRow = `<tr><td colspan="5" style="background:#FAFAFC;padding:12px 16px;"><div class="grid-2">
        <div><div class="badge green" style="margin-bottom:8px;">Entradas</div>${entHtml}</div>
        <div><div class="badge red" style="margin-bottom:8px;">Saídas</div>${saiHtml}</div>
      </div></td></tr>`;
    }
    rows += `<tr>
      <td>${b.label}</td><td class="num pos">${BRL(b.entradas)}</td><td class="num neg">${BRL(b.saidas)}</td>
      <td class="num" style="font-weight:600;">${BRL(b.saldo)}</td>
      <td class="num" style="color:${b.acumulado>=0?'var(--green)':'var(--red)'}">${BRL(b.acumulado)}</td>
    </tr>${detailRow}`;
    if(isSemana && idx===agg.length-1){ rows += monthTotalRow(currentMonth); }
  });
  return `<table><thead><tr><th>Período</th><th style="text-align:right;">Entradas</th><th style="text-align:right;">Saídas</th><th style="text-align:right;">Saldo do dia</th><th style="text-align:right;">Acumulado</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- normalização de texto p/ leitura de planilhas ---------- */
function normKey(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
}
function excelDateToISO(v){
  if(v instanceof Date) return toISO(v);
  if(typeof v==='number'){ const d = new Date(Math.round((v-25569)*86400*1000)); return toISO(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  if(typeof v==='string'){
    const m1 = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m1) return m1[1]+'-'+m1[2]+'-'+m1[3];
    const m2 = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m2) return m2[3]+'-'+pad(+m2[2])+'-'+pad(+m2[1]);
  }
  return null;
}
function readWorkbookFile(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:null, raw:true});
    cb(rows);
  };
  reader.readAsArrayBuffer(file);
}

const SALES_COL_MAP = {
  'DATA VENDA':'date', 'DATA':'date',
  'DINHEIRO':'dinheiro','CREDIARIO':'crediario','VALE':'vale','CREDITO':'credito',
  'DEBITO':'debito','CREDITOCLIENTE':'creditocliente','BOLETO':'boleto',
  'DEPOSITO':'deposito','PIX':'pix',
};
function importSalesFile(input){
  const file = input.files[0]; if(!file) return;
  readWorkbookFile(file, rows=>{
    const parsed = [];
    rows.forEach(row=>{
      const norm = {};
      Object.keys(row).forEach(k=>{ const nk=normKey(k); if(SALES_COL_MAP[nk]) norm[SALES_COL_MAP[nk]]=row[k]; });
      if(!norm.date) return;
      const iso = excelDateToISO(norm.date); if(!iso) return;
      const values = {};
      Object.keys(SALES_COL_MAP).forEach(k=>{ const field=SALES_COL_MAP[k]; if(field!=='date') values[field]=Number(norm[field]||0); });
      parsed.push({date:iso, values});
    });
    if(parsed.length===0){ showToast('Nenhuma linha reconhecida no arquivo'); return; }
    const mode = state._salesImportMode || 'merge';
    if(mode==='replace') state.salesHistory = parsed;
    else{
      const byDate = {}; state.salesHistory.forEach(r=>byDate[r.date]=r);
      parsed.forEach(r=>byDate[r.date]=r);
      state.salesHistory = Object.values(byDate);
    }
    state.salesHistory.sort((a,b)=>a.date<b.date?-1:1);
    saveSalesHistory().then(render);
  });
}
window.importSalesFile = importSalesFile;
function setSalesImportMode(v){ state._salesImportMode=v; } window.setSalesImportMode=setSalesImportMode;
async function clearSalesHistory(){
  if(!confirm('Remover todo o histórico de vendas cadastrado?')) return;
  state.salesHistory=[]; await saveSalesHistory(); render();
}
window.clearSalesHistory = clearSalesHistory;

  const months = Object.keys(byMonth).sort();

          <option value="replace">Substituir tudo</option>

const WEIGHT_COL_MAP = {'MES':'mes','MÊS':'mes','DIA':'dia','DIA DO MES':'dia','DIA DO MÊS':'dia','PESO':'peso'};
function importWeightsFile(input){
  const file = input.files[0]; if(!file) return;
  readWorkbookFile(file, rows=>{
    const parsed = [];
    rows.forEach(row=>{
      const norm = {};
      Object.keys(row).forEach(k=>{ const nk=normKey(k); if(WEIGHT_COL_MAP[nk]) norm[WEIGHT_COL_MAP[nk]]=row[k]; });
      if(norm.dia==null || norm.peso==null || !norm.mes) return;
      let mk = null;
      if(norm.mes instanceof Date) mk = norm.mes.getFullYear()+'-'+pad(norm.mes.getMonth()+1);
      else{
        const s = String(norm.mes).trim();
        const m1 = s.match(/^(\d{4})-(\d{1,2})/); if(m1) mk = m1[1]+'-'+pad(+m1[2]);
        else{ const m2 = s.match(/^(\d{1,2})\/(\d{4})/); if(m2) mk = m2[2]+'-'+pad(+m2[1]); }
      }
      if(!mk) return;
      parsed.push({mk, dia:Number(norm.dia), peso:Number(norm.peso)});
    });
    if(parsed.length===0){ showToast('Nenhuma linha reconhecida no arquivo (colunas esperadas: Mês, Dia, Peso)'); return; }
    // detecta se os pesos vieram em pontos percentuais (ex: 3.2) em vez de fração (0.032)
    const porMes = {};
    parsed.forEach(p=>{ (porMes[p.mk]=porMes[p.mk]||[]).push(p); });
    Object.keys(porMes).forEach(mk=>{
      const soma = porMes[mk].reduce((a,p)=>a+p.peso,0);
      const div = soma>3 ? 100 : 1;
      if(!state.weightsByMonth[mk]) state.weightsByMonth[mk]={};
      porMes[mk].forEach(p=>{ state.weightsByMonth[mk][p.dia] = p.peso/div; });
    });
    saveWeights().then(render);
  });
}
window.importWeightsFile = importWeightsFile;

// Monta as linhas do "Resumo do mês" (usado tanto na renderização inicial
// quanto na atualização ao vivo, sem precisar re-renderizar a tela toda).
function buildResumoRowsHtml(mk){
  const metaCaixa = metaCaixaDoMes(mk);
  const [y,m] = mk.split('-').map(Number);
  const diasNoMes = new Date(y,m,0).getDate();
  const pesos = pesosDoMes(mk);
  const paramsMk = ensureMonthParams(mk);
  let html = '';
  for(let dia=1; dia<=diasNoMes; dia++){
    const iso = y+'-'+pad(m)+'-'+pad(dia);
    const peso = Number(pesos[dia])||0;
    const metaCaixaDia = peso*metaCaixa;
    const prestExtra = prestacaoExtraPorModalidade(iso, metaCaixaDia);

    let saldoLiquido = 0;
    Object.keys(paramsMk.methods).forEach(id=>{
      const mp = paramsMk.methods[id];
      if(!mp.geraCaixa) return;
      const brutoVenda = metaCaixaDia*(Number(mp.participacao)||0);
      const brutoPrest = MODALIDADES_PRESTACAO.includes(id) ? (prestExtra[id]||0) : 0;
      saldoLiquido += (brutoVenda+brutoPrest)*(1-(Number(mp.taxa)||0));
    });

    html += `<tr>
      <td>${pad(dia)} — ${weekdayName(new Date(y,m-1,dia))}</td>
      <td class="num">${BRL(metaCaixaDia)}</td>
      <td class="num pos">${BRL(prestExtra.total)}</td>
      <td class="num" style="font-weight:600;color:var(--brand)">${BRL(saldoLiquido)}</td>
    </tr>`;
  }
  return html;
}

const SAIDA_COL_MAP = {
  'STATUS':'status','FORNECEDOR':'fornecedor','DESCRICAO':'obs','VALOR':'valor',
  'VENCIMENTO':'date','CONTA CONTABIL':'conta','CENTRO DE CUSTO':'centro',
};
function statusToTipo(s){
  const v = normKey(s);
  if(v==='PAGO') return 'pago';
  if(v==='A VENCER' || v==='RENEGOCIADO') return 'efetivo';
  return 'previsto';
}
function importSaidasFile(input){
  const file = input.files[0]; if(!file) return;
  readWorkbookFile(file, rows=>{
    const parsed = [];
    rows.forEach(row=>{
      const norm = {};
      Object.keys(row).forEach(k=>{ const nk=normKey(k); if(SAIDA_COL_MAP[nk]) norm[SAIDA_COL_MAP[nk]]=row[k]; });
      if(norm.valor==null || !norm.date) return;
      const iso = excelDateToISO(norm.date); if(!iso) return;
      const conta = (norm.conta||'(sem conta)').toString().trim();
      const centro = (norm.centro||'(sem centro de custo)').toString().trim();
      if(!state.config.accounts.includes(conta)) state.config.accounts.push(conta);
      if(!state.config.costCenters.includes(centro)) state.config.costCenters.push(centro);
      parsed.push({id:uid(), date:iso, conta, centro, tipo:statusToTipo(norm.status), valor:Number(norm.valor)||0, fornecedor:(norm.fornecedor||'').toString().trim(), obs:(norm.obs||'').toString().trim()});
    });
    if(parsed.length===0){ showToast('Nenhuma linha reconhecida no arquivo'); return; }
    const mode = state._saidasImportMode || 'append';
    if(mode==='replace') state.saidas = parsed; else state.saidas = state.saidas.concat(parsed);
    Promise.all([saveSaidas(), saveConfig()]).then(render);
  });
}

const ORC_COL_MAP = {
  'MES':'mes','MÊS':'mes','CONTA CONTABIL':'conta','CENTRO DE CUSTO':'centro',
  'VALOR ORCADO':'valor','VALOR ORÇADO':'valor','VALOR':'valor',
};
function setOrcImportMode(v){ state._orcImportMode=v; } window.setOrcImportMode=setOrcImportMode;
function importOrcamentoFile(input){
  const file = input.files[0]; if(!file) return;
  readWorkbookFile(file, rows=>{
    let count=0;
    rows.forEach(row=>{
      const norm = {};
      Object.keys(row).forEach(k=>{ const nk=normKey(k); if(ORC_COL_MAP[nk]) norm[ORC_COL_MAP[nk]]=row[k]; });
      if(norm.valor==null || !norm.conta || !norm.mes) return;
      let mk = null;
      if(norm.mes instanceof Date) mk = norm.mes.getFullYear()+'-'+pad(norm.mes.getMonth()+1);
      else{
        const s = String(norm.mes).trim();
        const m1 = s.match(/^(\d{4})-(\d{1,2})/); if(m1) mk = m1[1]+'-'+pad(+m1[2]);
        else{ const m2 = s.match(/^(\d{1,2})\/(\d{4})/); if(m2) mk = m2[2]+'-'+pad(+m2[1]); }
      }
      if(!mk) return;
      const conta = String(norm.conta).trim();
      const centro = norm.centro? String(norm.centro).trim() : '';
      if(!state.config.accounts.includes(conta)) state.config.accounts.push(conta);
      if(centro && !state.config.costCenters.includes(centro)) state.config.costCenters.push(centro);
      const entry = ensureOrcEntry(mk, conta, centro);
      entry.importado = Number(norm.valor)||0;
      count++;
    });
    if(count===0){ showToast('Nenhuma linha reconhecida (colunas esperadas: Mês, Conta Contábil, Centro de Custo, Valor Orçado)'); return; }
    Promise.all([saveOrcamento(), saveConfig()]).then(()=>{ showToast(count+' linhas de orçamento importadas'); render(); });
  });
}

function exportarBackup(){
  const backup = {
    versao: 2,
    exportadoEm: new Date().toISOString(),
    config: state.config,
    salesHistory: state.salesHistory,
    monthMeta: state.monthMeta,
    weightsByMonth: state.weightsByMonth,
    prestacaoModalidadePct: state.prestacaoModalidadePct,
    monthParams: state.monthParams,
    saidas: state.saidas,
    orcamento: state.orcamento,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const agora = new Date();
  a.href = url;
  a.download = 'backup-fluxo-caixa-esposende-'+toISO(agora)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup baixado — guarde esse arquivo em local seguro');
}
window.exportarBackup = exportarBackup;

function importarBackupFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup || typeof backup!=='object'){ showToast('Arquivo de backup inválido'); return; }
      if(backup.config) state.config = backup.config;
      if(backup.salesHistory) state.salesHistory = backup.salesHistory;
      if(backup.monthMeta) state.monthMeta = backup.monthMeta;
      if(backup.weightsByMonth) state.weightsByMonth = backup.weightsByMonth;
      if(backup.prestacaoModalidadePct) state.prestacaoModalidadePct = backup.prestacaoModalidadePct;
      if(backup.monthParams) state.monthParams = backup.monthParams;
      if(backup.saidas) state.saidas = backup.saidas;
      if(backup.orcamento) state.orcamento = backup.orcamento;
      persistAll().then(()=>{ showToast('✓ Backup restaurado com sucesso'); render(); });
    }catch(err){ showToast('Não consegui ler esse arquivo — confirme que é um backup exportado por aqui'); }
  };
  reader.readAsText(file);
}
