/* ------------------------------------------------------------------ */
/*  IA: OpenAI / Anthropic (chamada direta do navegador)               */
/* ------------------------------------------------------------------ */
const IA_PROVEDORES = {
  openai: { rotulo: 'OpenAI', modelo: 'gpt-5.4-mini', dica: 'Chave começa com "sk-". Crie em platform.openai.com → API keys.' },
  anthropic: { rotulo: 'Anthropic (Claude)', modelo: 'claude-sonnet-5', dica: 'Chave começa com "sk-ant-". Crie em console.anthropic.com → API Keys.' },
};
const IAProvedor = {
  blobBase64(b) { return new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = err; r.readAsDataURL(b); }); },
  /** Extrai o primeiro objeto JSON do texto (aceita ```json … ``` e texto em volta). */
  extrairJSON(t) {
    const s = String(t || '').replace(/```(?:json)?/gi, '').trim();
    try { return JSON.parse(s); } catch { }
    const i = s.indexOf('{'), j = s.lastIndexOf('}');
    if (i >= 0 && j > i) { try { return JSON.parse(s.slice(i, j + 1)); } catch { } }
    throw new Error('A IA não devolveu um JSON válido. Tente de novo.');
  },
  erroHTTP(status, corpo, rotulo) {
    const msg = corpo?.error?.message || '';
    if (status === 401 || status === 403) return new Error(`Chave de API da ${rotulo} recusada. Confira em Configurações de Integração.`);
    if (status === 429) return new Error(`Limite ou crédito da ${rotulo} esgotado (${msg || 'erro 429'}).`);
    if (status === 404 || /model/i.test(msg)) return new Error(`Modelo não encontrado na ${rotulo}: confira o nome do modelo. ${msg}`);
    return new Error(`${rotulo}: ${msg || 'erro ' + status}`);
  },
  async postar(url, headers, body, rotulo) {
    let r; try { r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', ...headers }, body: JSON.stringify(body) }); }
    catch { throw new Error(`Não foi possível conectar à ${rotulo}. Verifique a internet ou se a rede da empresa bloqueia o endereço.`); }
    const j = await r.json().catch(() => null);
    if (!r.ok) throw this.erroHTTP(r.status, j, rotulo);
    return j;
  },
  /** Monta o provedor no formato usado pelo painel (Cloud.caps.sample): fn(texto) → {text}; .json(texto) → objeto; .limits(). */
  criar(cfg) {
    const prov = cfg.provedor === 'anthropic' ? 'anthropic' : 'openai', info = IA_PROVEDORES[prov], modelo = String(cfg.modelo || info.modelo).trim(), chave = String(cfg.chave || '').trim();
    const SISTEMA = 'Você é um assistente de análise de documentos da Esposende. Responda em português do Brasil.';
    const chamar = async (input, opts = {}) => {
      const imgs = await Promise.all((opts.images || []).map(async b => ({ tipo: b.type || 'image/jpeg', dados: await this.blobBase64(b) })));
      const sistema = SISTEMA + (opts.json ? ' Responda APENAS com um objeto JSON válido, sem texto antes ou depois.' : '');
      if (prov === 'openai') {
        const content = imgs.length ? [{ type: 'text', text: input }, ...imgs.map(i => ({ type: 'image_url', image_url: { url: `data:${i.tipo};base64,${i.dados}` } }))] : input;
        const body = { model: modelo, messages: [{ role: 'system', content: sistema }, { role: 'user', content }], max_completion_tokens: 16000 };
        if (opts.json) body.response_format = { type: 'json_object' };
        const j = await this.postar('https://api.openai.com/v1/chat/completions', { authorization: 'Bearer ' + chave }, body, info.rotulo);
        return j?.choices?.[0]?.message?.content || '';
      }
      const content = [...imgs.map(i => ({ type: 'image', source: { type: 'base64', media_type: i.tipo, data: i.dados } })), { type: 'text', text: input }];
      const j = await this.postar('https://api.anthropic.com/v1/messages', { 'x-api-key': chave, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        { model: modelo, max_tokens: 8000, system: sistema, messages: [{ role: 'user', content }] }, info.rotulo);
      return (j?.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    };
    const f = async (input, opts = {}) => ({ text: await chamar(input, opts) });
    f.json = async (input, opts = {}) => this.extrairJSON(await chamar(input, { ...opts, json: true }));
    f.limits = async () => ({ maxInputBytes: 300000, images: { maxCount: 8 } });
    f.provedor = prov; f.modelo = modelo;
    return f;
  },
};

/* ------------------------------------------------------------------ */
/*  CNPJ: BrasilAPI (padrão) / ReceitaWS                               */
/* ------------------------------------------------------------------ */
const CNPJ_PROVEDORES = { brasilapi: 'BrasilAPI (gratuita)', receitaws: 'ReceitaWS (gratuita, 3 consultas/min)' };
const CNPJProvedor = {
  async brasilapi(d) {
    let r; try { r = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + d); } catch { throw Object.assign(new Error('BrasilAPI indisponível.'), { tentarOutro: true }); }
    if (r.status === 404) throw new Error('CNPJ não encontrado na Receita Federal.');
    if (!r.ok) throw Object.assign(new Error('BrasilAPI respondeu com erro ' + r.status + '.'), { tentarOutro: true });
    return r.json();
  },
  /** ReceitaWS (API pública) não libera CORS: usa JSONP. Converte para o formato da BrasilAPI. */
  receitaws(d) {
    return new Promise((ok, err) => {
      const cb = 'rws_' + uid(), s = document.createElement('script'); let fim;
      const limpar = () => { clearTimeout(fim); delete window[cb]; s.remove(); };
      window[cb] = j => {
        limpar();
        if (!j || j.status === 'ERROR') return err(new Error(j?.message || 'CNPJ não encontrado na ReceitaWS.'));
        const ab = String(j.abertura || '').split('/');
        ok({ razao_social: j.nome, nome_fantasia: j.fantasia, descricao_situacao_cadastral: j.situacao, logradouro: j.logradouro, numero: j.numero, complemento: j.complemento, bairro: j.bairro,
          municipio: j.municipio, uf: j.uf, cep: String(j.cep || '').replace(/\D/g, ''), cnae_fiscal_descricao: j.atividade_principal?.[0]?.text, data_inicio_atividade: ab.length === 3 ? `${ab[2]}-${ab[1]}-${ab[0]}` : '' });
      };
      s.onerror = () => { limpar(); err(Object.assign(new Error('ReceitaWS indisponível.'), { tentarOutro: true })); };
      fim = setTimeout(() => { limpar(); err(Object.assign(new Error('ReceitaWS não respondeu (limite de 3 consultas por minuto).'), { tentarOutro: true })); }, 12000);
      s.src = `https://receitaws.com.br/v1/cnpj/${d}?callback=${cb}`; document.head.appendChild(s);
    });
  },
  /** Consulta no provedor escolhido; se ele estiver fora do ar, tenta o outro. */
  criar(cfg) {
    const prim = cfg.provedor === 'receitaws' ? 'receitaws' : 'brasilapi', sec = prim === 'brasilapi' ? 'receitaws' : 'brasilapi';
    return async d => { try { return await this[prim](d); } catch (e) { if (!e.tentarOutro) throw e; return this[sec](d); } };
  },
};

/* ------------------------------------------------------------------ */
/*  Arquivos: Supabase Storage                                         */
/* ------------------------------------------------------------------ */
const ArmazenamentoSupabase = {
  criar(bucket = 'anexos') {
    return {
      bucket,
      async upload(file, pasta = 'documentos') {
        const sb = Nuvem.client; if (!sb) throw new Error('Banco de dados não conectado.');
        const nome = String(file.name || 'arquivo.pdf').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '_').slice(-80);
        const id = (crypto.randomUUID ? crypto.randomUUID() : uid() + uid());
        const caminho = `${pasta}/${Datas.hojeISO().slice(0, 7)}/${id}-${nome}`;
        const { error } = await sb.storage.from(bucket).upload(caminho, file, { contentType: file.type || 'application/pdf', upsert: false });
        if (error) throw new Error(/row-level|policy|403|unauthorized/i.test(error.message) ? 'Seu perfil não tem permissão para enviar arquivos.' : /mime|type/i.test(error.message) ? 'Tipo de arquivo não aceito (envie PDF).' : /size|large/i.test(error.message) ? 'Arquivo grande demais (máx. 20 MB).' : 'Falha no envio do arquivo: ' + error.message);
        const { data } = sb.storage.from(bucket).getPublicUrl(caminho);
        return { id: null, url: data.publicUrl, contentType: file.type || 'application/pdf', caminho };
      },
    };
  },
};

        t.armazenamento = { ok: !!ok, msg: ok ? 'Envio e leitura do PDF de teste funcionaram (arquivo de teste já apagado).' : 'O envio funcionou, mas a URL pública não abriu: confira se o bucket está marcado como público.' };
      }
    } catch (e) { t[k] = { ok: false, msg: e.message || String(e) }; }
    App.render();
  },
  async acao(a, el) {
    if (a === 'int-salvar') return this.salvar(el.dataset.k);
    if (a === 'int-testar') return this.testar(el.dataset.k, el);
    if (a === 'int-remover-chave') {
      if (!(await UI.confirmar('Remover chave de API', 'A leitura por IA será desligada para todos até uma nova chave ser salva.', 'Remover', true))) return;
      const { id, chave, ...d } = Repo.get(this.COL, 'ia') || {};
      await Repo.salvar(this.COL, 'ia', { ...d, ativo: false }, { modulo: 'integracoes', rotulo: 'Integração · IA', detalhe: 'Chave removida', semAudit: true });
      await Audit.registrar({ modulo: 'integracoes', acao: 'alterou', entidade: this.COL, entidadeId: 'ia', rotulo: 'Integração · IA', mudancas: [], detalhe: 'Chave removida' });
      return App.render();
    }
  },
  mudanca(a, el) { },
};

/* =====================================================================
   v14/v15 — LOGIN (CPF + senha) e GESTÃO DE ACESSOS
   v15: com o banco compartilhado (Supabase) o login usa o Supabase Auth (IdSupabase, nuvem.js) e as
   regras do banco (RLS) fazem o corte de verdade no servidor; sem ele, vale o modelo local abaixo (IdLocal).
   Modelo: login independente, só no frontend (decisão do Renato, 01/10/2026). A proteção externa é a
   rede corporativa (intranet). As senhas são guardadas com sal + SHA-256 em várias rodadas (Senha, core.js):
   isso é controle organizacional, não segurança criptográfica de servidor.

   Camadas:
     5 Repositório → usuarios/<usr-…>  { perfil 'MASTER'|'OPERACIONAL', funcionarioId? (Módulo 1),
                                         nome?/cpf? (só no Master avulso da configuração inicial),
                                         permissoes{pdi,lojas,contratos,fcx,retaguarda}, ativo,
                                         senha{alg,sal,hash}, trocarSenha, ultimoAcesso }
                     Usuário = CPF do funcionário (só dígitos); senha inicial = o próprio CPF.
     6 Serviços    → Sessao (antes do login lê SÓ usuarios e funcionarios; nenhum menu, módulo ou outra
                              coleção é carregado; depois do login vigia o próprio usuário e o funcionário)
     7 UI          → Sessao.render (tela de entrada, troca obrigatória, configuração inicial)
                     Acessos (tela "Gestão de Acessos", só Master)
   Bloqueios: funcionário Desligado/Inativo no Módulo 1, usuário desativado ou removido → o CPF deixa de
   entrar e a sessão aberta é encerrada na hora.
   ===================================================================== */
const SESSAO_CHAVE = 'esp-painel:sessao', SESSAO_HORAS = 12, TENTATIVAS_MAX = 5, BLOQUEIO_SEG = 60;

const Sessao = {
  ativa: false, _unsubs: [], _ultimo: null, _falhas: 0, _bloqueadoAte: 0, _pendente: null,
  ler() { try { return JSON.parse(sessionStorage.getItem(SESSAO_CHAVE) || 'null'); } catch { return null; } },
  gravar(o) { try { sessionStorage.setItem(SESSAO_CHAVE, JSON.stringify(o)); } catch { /* sessão só em memória */ } },
  limpar() { try { sessionStorage.removeItem(SESSAO_CHAVE); } catch { } },
  desligado(f) { return !!f && ['DESLIGADO', 'INATIVO'].includes(String(f.status || 'Ativo').trim().toUpperCase()); },
  /** Provedor de identidade: Supabase Auth (banco compartilhado) ou local (usuarios com senha em hash). */
  get prov() { return Cloud.adapter?.identidade === 'supabase' ? IdSupabase : IdLocal; },
  /** CPF do usuário: o do funcionário vinculado (Módulo 1) ou o do Master avulso. */
  cpfDe(u, f) { return CPF.limpar(f?.cpf || u?.cpf || ''); },
  situacao(u, f) {
    if (!u) return 'revogado';
    if (u.ativo === false) return 'desativado';
    if (u.funcionarioId && !f) return 'sem_funcionario';
    if (this.desligado(f)) return 'desligado';
    return 'ok';
  },
  localizar(base, cpf) {
    const d = CPF.limpar(cpf);
    for (const u of base.usuarios) { const f = u.funcionarioId ? base.funcionarios.find(x => x.id === u.funcionarioId) : null; if (d && this.cpfDe(u, f) === d) return { u, f }; }
    return null;
  },

  /** Primeira tela: sessão válida desta aba entra direto (revalidando); senão, login ou configuração inicial. */
  async iniciar() {
    this.render({ carregando: true });
    try { if (!(await this.prov.temMaster())) return this.render({ setup: true }); }
    catch (e) { return this.render({ erro: 'Não foi possível conectar à base de usuários: ' + (e.message || e) }); }
    const r = await this.prov.restaurar().catch(() => null);
    if (r) return this.abrir(r.u, r.f, r.s);
    this.limpar(); this.render({});
  },
  async entrar(cpf, senha) {
    if (Date.now() < this._bloqueadoAte) return this.render({ erro: `Muitas tentativas. Aguarde ${Math.ceil((this._bloqueadoAte - Date.now()) / 1000)} s.`, cpf });
    this.render({ carregando: true, cpf });
    let achado; try { achado = await this.prov.autenticar(cpf, senha); } catch (e) { return this.render({ erro: e.message || String(e), cpf }); }
    // mensagem única para CPF inexistente ou senha errada (não revela quais CPFs têm acesso)
    if (!achado) {
      if (++this._falhas >= TENTATIVAS_MAX) { this._falhas = 0; this._bloqueadoAte = Date.now() + BLOQUEIO_SEG * 1000; }
      return this.render({ erro: 'CPF ou senha incorretos.', cpf });
    }
    this._falhas = 0;
    const { u, f, sit } = achado;
    if (sit !== 'ok') return this.render({ motivo: sit, cpf });
    // troca obrigatória: primeiro acesso, senha resetada ou senha ainda igual ao CPF
    if (u.trocarSenha || CPF.limpar(senha) === CPF.limpar(cpf)) { this._pendente = { u, f, cpf: CPF.limpar(cpf) }; return this.render({ troca: true }); }
    return this.abrir(u, f);
  },
  async trocarSenha(nova, conf) {
    const p = this._pendente; if (!p) return this.render({});
    const prob = Senha.problemas(nova, p.cpf);
    if (nova !== conf) return this.render({ troca: true, erro: 'A confirmação não confere com a nova senha.' });
    if (prob.length) return this.render({ troca: true, erro: 'A nova senha precisa ' + prob.join(', ') + '.' });
    this.render({ carregando: true });
    let u; try { u = await this.prov.salvarSenha(p, nova); } catch (e) { return this.render({ troca: true, erro: e.message || String(e) }); }
    this._pendente = null;
    const f = p.f || (u.funcionarioId ? await Cloud.adapter.get('funcionarios/' + u.funcionarioId).catch(() => null) : null);
    return this.abrir(u, f);
  },
  /** Primeira instalação: cria o Master (nome, CPF e senha forte). */
  async configurar(nome, cpf, senha, conf) {
    const d = CPF.limpar(cpf), prob = Senha.problemas(senha, d);
    const erro = !String(nome).trim() ? 'Informe o nome.' : !CPF.valido(d) ? 'CPF inválido.' : senha !== conf ? 'A confirmação não confere com a senha.' : prob.length ? 'A senha precisa ' + prob.join(', ') + '.' : '';
    if (erro) return this.render({ setup: true, erro, nome, cpf });
    this.render({ carregando: true });
    let r; try { r = await this.prov.criarMaster(String(nome).trim(), d, senha); } catch (e) { return this.render({ setup: true, erro: e.message || String(e), nome, cpf }); }
    return this.abrir(r.u, r.f || null);
  },
  async abrir(u, f, sessaoExistente = null) {
    const s = sessaoExistente || { uid: u.id, exp: Date.now() + SESSAO_HORAS * 3600e3 };
    if (!sessaoExistente) u = await this.prov.registrarAcesso(u);
    this.gravar(s);
    Auth.aplicarUsuario(u, f);
    await Auth.carregarConfig();
    if (u.perfil !== 'MASTER') Auth.aplicarUsuario(u, f); // a matriz do usuário prevalece sobre config/permissoes
    this.ativa = true; this.vigiar(u, f);
    App.iniciarPainel();
  },
  /** Desligamento automático e permissões ao vivo: o próprio usuário e o funcionário ficam sob observação. */
  vigiar(u0, f0) {
    this.pararVigia();
    let u = u0, f = f0;
    const reavaliar = () => {
      if (!this.ativa) return;
      const sit = this.situacao(u, f); if (sit !== 'ok') return this.encerrar(sit);
      if (u.trocarSenha) return this.encerrar('resetada'); // senha resetada pelo Master: precisa criar outra
      const mudou = JSON.stringify([u.perfil, u.permissoes]) !== JSON.stringify([Auth.usuario?.perfil, Auth.usuario?.permissoes]);
      Auth.usuario = u;
      if (mudou) { Auth.aplicarUsuario(u, f); UI.toast('Suas permissões foram atualizadas pelo Master.'); App.render(); }
    };
    const w = Cloud.adapter.watchDoc.bind(Cloud.adapter);
    this._unsubs.push(w('usuarios/' + u.id, d => { u = d; reavaliar(); }));
    if (u.funcionarioId) this._unsubs.push(w('funcionarios/' + u.funcionarioId, d => { if (d || !Cloud.nuvem) { f = d; reavaliar(); } }));
    // banco compartilhado: o servidor corta os dados na hora; a tela confere a situação a cada 30 s
    // (um desligamento tira do usuário a leitura do próprio funcionário, então o evento pode não chegar)
    if (Cloud.nuvem) {
      const t = setInterval(async () => {
        if (!this.ativa) return; const sit = await this.prov.situacao().catch(() => null);
        if (sit && sit !== 'ok') return this.encerrar(sit);
      }, 30000);
      this._unsubs.push(() => clearInterval(t));
    }
  },
  pararVigia() { this._unsubs.forEach(x => { try { x(); } catch { } }); this._unsubs = []; },
  /** Fecha o painel: solta assinaturas, caches e arquivos em memória e volta para a tela de entrada. */
  encerrar(motivo = 'saiu') {
    this.ativa = false; this.limpar(); this.pararVigia(); this._pendente = null;
    this.prov.sair(); try { Cloud.adapter.reset?.(); } catch { }
    try { Retaguarda.liberarAdq?.(); Contratos.pararVigia?.(); } catch { }
    Repo._unsubs.forEach(x => { try { x(); } catch { } }); Repo._unsubs = []; Repo.cols = {}; Repo.prontas.clear(); Repo.rev++;
    try { const h = $('#fcxHost'); if (h) { h.innerHTML = ''; h.hidden = true; } FCX._cache = null; FCX._cacheProm = null; } catch { }
    const mod = $('#modais'); if (mod) mod.innerHTML = ''; document.body.classList.remove('modal-aberto', 'nav-open', 'fcx-on');
    Auth.limpar(); App.rota = 'menu'; Cloud.caps.sample = null; Cloud.caps.assets = null;
    try { history.replaceState(null, '', location.pathname); } catch { }
    this.render({ motivo });
  },

  /* ---------------- telas ---------------- */
  MSG: {
    desativado: 'Seu acesso está desativado. Procure o seu gestor.',
    desligado: 'Acesso encerrado: o seu cadastro está como desligado no Módulo 1. Procure o seu gestor.',
    sem_funcionario: 'O funcionário vinculado a este acesso não foi encontrado. Procure o seu gestor.',
    revogado: 'O seu acesso foi removido. Procure o seu gestor.',
    resetada: 'Sua senha foi redefinida pelo gestor. Entre com o CPF para criar uma nova.',
    saiu: 'Você saiu do painel.',
  },
  /** Sem argumento (ex.: App.render chamado por um evento atrasado) repete a última tela mostrada. */
  render(r) {
    if (r === undefined) r = this._ultimo || {}; else this._ultimo = r;
    $('#topbar').innerHTML = '';
    const marca = `<div class="login-marca"><img src="${LOGO_NAVY}" alt="Esposende"><span>Painel de Gestão</span></div>`;
    const erro = r.erro ? `<div class="login-erro" role="alert">${esc(r.erro)}</div>` : r.motivo && this.MSG[r.motivo] ? `<div class="login-erro ${r.motivo === 'saiu' ? 'info' : ''}" role="alert">${esc(this.MSG[r.motivo])}</div>` : '';
    const senhaCampo = (nome, rot, auto) => `<div class="field"><label class="lbl" for="lg_${nome}">${rot}</label><div class="login-senha"><input id="lg_${nome}" name="${nome}" type="password" autocomplete="${auto}" required><button type="button" class="iconbtn" data-ver-senha aria-label="Mostrar senha">${ICON.olho}</button></div></div>`;
    const regra = '<p class="hint" style="margin:0">Mínimo de 8 caracteres, com letra maiúscula, minúscula e número, diferente do CPF.</p>';
    let corpo;
    if (r.carregando) corpo = `<h1>Entrar no painel</h1><div class="login-spin" role="status" aria-label="Carregando"></div>`;
    else if (r.setup) corpo = `<h1>Configuração inicial</h1><p class="login-sub">Nenhum usuário Master cadastrado. Crie o primeiro acesso Master: ele ativa os funcionários e define as permissões na Gestão de Acessos.</p>${erro}
      <form class="login-form" data-form="setup" novalidate>
        <div class="field"><label class="lbl" for="lg_nome">Nome</label><input id="lg_nome" name="nome" value="${esc(r.nome || '')}" autocomplete="name" required></div>
        <div class="field"><label class="lbl" for="lg_cpf">CPF</label><input id="lg_cpf" name="cpf" value="${esc(r.cpf || '')}" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" data-cpf required></div>
        ${senhaCampo('senha', 'Senha', 'new-password')}${senhaCampo('conf', 'Confirmar senha', 'new-password')}${regra}
        <button class="btn" type="submit">Criar acesso Master e entrar</button></form>`;
    else if (r.troca) corpo = `<h1>Crie a sua senha</h1><p class="login-sub">Primeiro acesso (ou senha redefinida pelo gestor): defina uma senha pessoal para continuar.</p>${erro}
      <form class="login-form" data-form="troca" novalidate>${senhaCampo('nova', 'Nova senha', 'new-password')}${senhaCampo('conf', 'Confirmar nova senha', 'new-password')}${regra}
        <button class="btn" type="submit">Salvar senha e entrar</button><button class="btn ghost" type="button" data-a="sess-cancelar">Cancelar</button></form>`;
    else corpo = `<h1>Entrar no painel</h1><p class="login-sub">Use o seu CPF. No primeiro acesso, a senha também é o CPF.</p>${erro}
      <form class="login-form" data-form="login" novalidate>
        <div class="field"><label class="lbl" for="lg_cpf">CPF</label><input id="lg_cpf" name="cpf" value="${esc(r.cpf || '')}" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" data-cpf required></div>
        ${senhaCampo('senha', 'Senha', 'current-password')}
        <button class="btn" type="submit">Entrar</button></form>
      <p class="login-rodape">Esqueceu a senha? Procure o seu gestor.</p>`;
    $('#main').innerHTML = `<section class="login" aria-label="Acesso ao Painel de Gestão"><div class="login-card">${marca}${corpo}</div></section>`;
    ((r.cpf && $('#lg_senha')) || $('#main .login-form input'))?.focus();
  },
  acao(a) { if (a === 'sess-sair') return this.encerrar('saiu'); if (a === 'sess-cancelar') { this._pendente = null; this.prov.sair(); return this.render({}); } },
};
// formulários da tela de entrada (submit com Enter ou botão)
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const v = n => f.querySelector(`[name="${n}"]`)?.value || '';
  const falha = (r) => err => Sessao.render({ ...r, erro: err.message || String(err) });
  if (f.dataset.form === 'login') Sessao.entrar(v('cpf'), v('senha')).catch(falha({ cpf: v('cpf') }));
  if (f.dataset.form === 'troca') Sessao.trocarSenha(v('nova'), v('conf')).catch(falha({ troca: true }));
  if (f.dataset.form === 'setup') Sessao.configurar(v('nome'), v('cpf'), v('senha'), v('conf')).catch(falha({ setup: true }));
});
document.addEventListener('input', e => { if (e.target.matches?.('input[data-cpf]')) { const d = CPF.limpar(e.target.value).slice(0, 11); const fmt = d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2'); if (fmt !== e.target.value) e.target.value = fmt; } });
document.addEventListener('click', e => { const b = e.target.closest('[data-ver-senha]'); if (!b) return; const i = b.parentElement.querySelector('input'); const ver = i.type === 'password'; i.type = ver ? 'text' : 'password'; b.setAttribute('aria-label', ver ? 'Ocultar senha' : 'Mostrar senha'); b.innerHTML = ver ? ICON.olhoFechado : ICON.olho; });

/* ============================ Gestão de Acessos (só Master) ============================ */
const Acessos = {
  COL: 'usuarios',
  ui: { busca: '', situacao: '' },
  pronto() { return [this.COL, 'funcionarios'].every(c => Repo.prontas.has(c)); },
  todos() { return Repo.todos(this.COL); },
  funcionario(id) { return id ? Repo.get('funcionarios', id) : null; },
  nomeDe(u) { const f = this.funcionario(u.funcionarioId); return f?.nome || u.nome || '—'; },
  masters() { return this.todos().filter(u => u.perfil === 'MASTER' && u.ativo !== false); },
  situacao(u) {
    const f = this.funcionario(u.funcionarioId), s = Sessao.situacao(u, f);
    if (s === 'desativado') return { k: s, cls: 'neutral', txt: 'Desativado' };
    if (s === 'desligado') return { k: s, cls: 'bad', txt: 'Bloqueado: desligado no RH' };
    if (s === 'sem_funcionario') return { k: 'desligado', cls: 'bad', txt: 'Funcionário excluído' };
    if (u.trocarSenha) return { k: 'pendente', cls: 'warn', txt: 'Aguardando 1º acesso' };
    return { k: 'ativo', cls: 'ok', txt: 'Ativo' };
  },
  nivelTxt: { '': '—', ler: 'Ler', modificar: 'Modificar', excluir: 'Excluir' },
  resumoMatriz(u) {
    if (u.perfil === 'MASTER') return '<span class="pill navy">Acesso total</span>';

  },
  /** Funcionários ativos (não desligados) que ainda não têm usuário. */

  },

    if (!this.pronto()) return head + '<div class="panel"><p class="muted" style="margin:0">Carregando…</p></div>';
    const lista = this.todos(), sit = lista.map(u => this.situacao(u).k), sem = this.semAcesso();

      <div class="kpi zona-kpi ${sit.includes('desligado') ? 'bad' : 'ok'}"><div class="k">Bloqueados pelo RH</div><div class="v">${sit.filter(s => s === 'desligado').length}</div><div class="d">desligado no Módulo 1</div></div>
      <div class="kpi"><div class="k">Desativados</div><div class="v">${sit.filter(s => s === 'desativado').length}</div><div class="d">pelo Master</div></div></div>`;
    const semCpf = sem.filter(f => !CPF.valido(f.cpf)), comCpf = sem.filter(f => CPF.valido(f.cpf));
    const ativar = `<div class="panel" style="margin-bottom:16px"><h2>Funcionários sem acesso</h2><p class="sub">Funcionários ativos do Módulo 1. Ao ativar, o usuário nasce como Operacional com a matriz padrão; ajuste em “Permissões”.</p>
      ${comCpf.length ? `<div class="tbl-wrap"><table><thead><tr><th>Funcionário</th><th>CPF</th><th>Situação no RH</th><th></th></tr></thead><tbody>${comCpf.map(f => `<tr><td><div class="cell-main">${esc(f.nome)}</div><div class="cell-sub">${esc(Pessoal.cargoNome?.(f) || '')}</div></td><td class="mono">${CPF.mascarar(f.cpf)}</td><td>${esc(f.status || 'Ativo')}</td>
        <td class="acts"><button class="btn sm" data-a="acc-ativar" data-f="${f.id}">Ativar acesso</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty" style="padding:16px">Todos os funcionários ativos com CPF já têm acesso.</div>'}
      ${semCpf.length ? `<p class="hint" style="margin:10px 0 0">${semCpf.length} funcionário(s) sem CPF válido no Módulo 1 (${semCpf.slice(0, 4).map(f => esc(f.nome)).join(', ')}${semCpf.length > 4 ? '…' : ''}): cadastre o CPF para poder ativar.</p>` : ''}</div>`;
    const q = RH.chave(this.ui.busca), filtrados = lista.filter(u => (!this.ui.situacao || this.situacao(u).k === this.ui.situacao) && (!q || RH.chave(this.nomeDe(u)).includes(q))).sort((a, b) => this.nomeDe(a).localeCompare(this.nomeDe(b)));
    const tabela = `<div class="panel"><h2>Usuários</h2><div class="toolbar"><div class="field grow"><label class="lbl" for="accBusca">Buscar</label><input id="accBusca" type="search" value="${esc(this.ui.busca)}" data-a="acc-busca" placeholder="Nome"></div>
        <div class="field"><label class="lbl" for="accSit">Situação</label><select id="accSit" data-a="acc-filtro"><option value="">Todas</option>${[['ativo', 'Ativos'], ['pendente', 'Aguardando 1º acesso'], ['desligado', 'Bloqueados pelo RH'], ['desativado', 'Desativados']].map(([v, l]) => `<option value="${v}" ${this.ui.situacao === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
      <div class="tbl-wrap"><table id="accTab"><thead><tr><th>Usuário</th><th>Login (CPF)</th><th>Perfil</th><th>Permissões</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>${filtrados.map(u => {
        const f = this.funcionario(u.funcionarioId), s = this.situacao(u), eu = u.id === Auth.id;
        return `<tr class="${['desligado', 'desativado'].includes(s.k) ? 'muted' : ''}"><td><div class="cell-main">${esc(this.nomeDe(u))}${eu ? ' <span class="hint">(você)</span>' : ''}</div><div class="cell-sub">${f ? esc([Pessoal.cargoNome?.(f), f.status || 'Ativo'].filter(Boolean).join(' · ')) : 'Master da configuração inicial'}</div></td>
          <td class="mono">${CPF.mascarar(Sessao.cpfDe(u, f))}</td>
          <td><span class="pill ${u.perfil === 'MASTER' ? 'navy' : 'neutral'}">${u.perfil === 'MASTER' ? 'Master' : 'Operacional'}</span></td><td>${this.resumoMatriz(u)}</td>
          <td><span class="pill ${s.cls}">${esc(s.txt)}</span></td><td class="mono">${u.ultimoAcesso ? Fmt.dataHora(u.ultimoAcesso) : '<span class="hint">nunca</span>'}</td>
          <td class="acts"><button class="btn sec sm" data-a="acc-editar" data-id="${u.id}">Permissões</button><button class="btn ghost sm" data-a="acc-reset" data-id="${u.id}">Resetar senha</button>
            ${eu ? '' : `<button class="btn ${u.ativo === false ? 'sec' : 'ghost'} sm" data-a="acc-ativo" data-id="${u.id}">${u.ativo === false ? 'Reativar' : 'Desativar'}</button><button class="iconbtn" data-a="acc-remover" data-id="${u.id}" aria-label="Remover usuário">${ICON.lixo}</button>`}</td></tr>`;
      }).join('') || '<tr><td colspan="7"><div class="empty">Nenhum usuário com esse filtro.</div></td></tr>'}</tbody></table></div></div>`;
    return head + kpis + ativar + tabela;
  },
  afterRender() { },

  /* ---------------- matriz Ler / Modificar / Excluir ---------------- */
  matrizHTML(perm = {}, master = false) {
    const cel = (m, n) => { const nv = NIVEIS_ACESSO.indexOf(perm[m.id] || ''), i = NIVEIS_ACESSO.indexOf(n);
      return `<td class="acc-cel"><input type="checkbox" data-mod="${m.id}" data-niv="${n}" aria-label="${esc(m.rotulo)}: ${this.nivelTxt[n]}" ${master || nv >= i ? 'checked' : ''} ${master || nv > i ? 'disabled' : ''}></td>`; };
    return `<div class="tbl-wrap"><table class="nolabel acc-matriz"><thead><tr><th>Módulo</th><th>Ler</th><th>Modificar</th><th>Excluir</th></tr></thead><tbody>
      ${MATRIZ_MODULOS.map(m => `<tr><td><b>${esc(m.rotulo)}</b><div class="cell-sub">${esc(m.num)}</div></td>${['ler', 'modificar', 'excluir'].map(n => cel(m, n)).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="hint" style="margin-top:6px">Modificar inclui Ler; Excluir inclui Modificar e Ler. ${master ? 'Master tem acesso total, inclusive à Gestão de Acessos, Auditoria e Backup.' : 'Salários, parâmetros de RH, Auditoria, Backup e Gestão de Acessos ficam só com o Master.'}</p>`;
  },
  lerMatriz(m) { const out = {}; MATRIZ_MODULOS.forEach(mod => { out[mod.id] = ['excluir', 'modificar', 'ler'].find(v => $(`[data-mod="${mod.id}"][data-niv="${v}"]`, m)?.checked) || ''; }); return out; },
  /** Cascata: marcar um nível marca e trava os de baixo; desmarcar deixa o nível logo abaixo. */
  sincronizarMatriz(m, alvo) {
    const master = $('[name="perfil"]', m)?.value === 'MASTER', perm = master ? {} : this.lerMatriz(m);
    if (alvo && !alvo.checked && !master) perm[alvo.dataset.mod] = NIVEIS_ACESSO[NIVEIS_ACESSO.indexOf(alvo.dataset.niv) - 1];
    $('#accMatriz', m).innerHTML = this.matrizHTML(perm, master);
  },
  abrirPermissoes(id) {
    const u = Repo.get(this.COL, id), eu = id === Auth.id;
    UI.modal({
      titulo: 'Permissões · ' + this.nomeDe(u), largo: true,
      corpo: `<div class="form-grid">${campo('Perfil', 'perfil', u.perfil, { opcoes: [['OPERACIONAL', 'Operacional (matriz por módulo)'], ['MASTER', 'Master (acesso total)']], attrs: eu ? 'disabled' : '' })}
        <div class="field full"><span class="lbl">Permissões por módulo</span><div id="accMatriz">${this.matrizHTML(u.permissoes || {}, u.perfil === 'MASTER')}</div></div></div>${eu ? '<p class="hint">Você não pode mudar o seu próprio perfil.</p>' : ''}`,
      aoAbrir: m => m.addEventListener('change', e => { if (e.target.matches('[data-mod]')) this.sincronizarMatriz(m, e.target); if (e.target.name === 'perfil') this.sincronizarMatriz(m); }),
      acoes: [{ rotulo: 'Cancelar', classe: 'sec' }, { rotulo: 'Salvar permissões', acao: async m => {
        const perfil = eu ? u.perfil : $('[name="perfil"]', m).value;
        if (u.perfil === 'MASTER' && perfil !== 'MASTER' && this.masters().length <= 1) { UI.toast('Este é o único Master ativo: defina outro Master antes.'); return false; }
        const { id: _, ...d } = u;
        await Repo.salvar(this.COL, id, { ...d, perfil, permissoes: perfil === 'MASTER' ? {} : this.lerMatriz(m) }, { modulo: 'acessos', rotulo: `Acesso · ${this.nomeDe(u)}`, detalhe: 'Permissões alteradas' });
        UI.toast('Permissões salvas: valem na hora para a pessoa.');
      } }],
    });
  },
  async ativar(fid) {
    const f = this.funcionario(fid); if (!f) return;
    if (!CPF.valido(f.cpf)) return UI.toast('Cadastre um CPF válido para este funcionário no Módulo 1.');
    if (Sessao.desligado(f)) return UI.toast('Funcionário desligado no Módulo 1.');
    if (this.todos().some(u => u.funcionarioId === fid)) return UI.toast('Este funcionário já tem acesso.');
    if (this.todos().some(u => Sessao.cpfDe(u, this.funcionario(u.funcionarioId)) === CPF.limpar(f.cpf))) return UI.toast('Já existe um usuário com este CPF.');
    UI.toast('Ativando acesso…');
    const id = await Sessao.prov.criarAcesso(f, { perfil: 'OPERACIONAL', funcionarioId: fid, permissoes: { ...MATRIZ_PADRAO }, ativo: true, trocarSenha: true });
    UI.toast(`Acesso de ${f.nome} ativado. Login e senha inicial: o CPF.`);
    this.abrirPermissoes(id);
  },

  /* ---------------- eventos (prefixo acc-) ---------------- */
  async acao(a, el) {
    const id = el.dataset.id, u = id ? Repo.get(this.COL, id) : null;
    switch (a) {
      case 'acc-ativar': return this.ativar(el.dataset.f);
      case 'acc-editar': return this.abrirPermissoes(id);
      case 'acc-reset': {
        const cpf = Sessao.cpfDe(u, this.funcionario(u.funcionarioId)); if (!CPF.valido(cpf)) return UI.toast('O funcionário não tem CPF válido no Módulo 1.');
        if (!(await UI.confirmar('Resetar senha', `A senha de <b>${esc(this.nomeDe(u))}</b> volta a ser o CPF e a troca será obrigatória no próximo login. Uma sessão aberta dessa pessoa é encerrada.`, 'Resetar senha', true))) return;
        await Sessao.prov.resetarSenha(u, cpf, `Acesso · ${this.nomeDe(u)}`);
        return UI.toast('Senha resetada para o CPF.');
      }
      case 'acc-ativo': {
        const novo = u.ativo === false;
        if (!novo && u.perfil === 'MASTER' && this.masters().length <= 1) return UI.toast('Este é o único Master ativo.');
        if (!novo && !(await UI.confirmar('Desativar acesso', `Desativar o acesso de <b>${esc(this.nomeDe(u))}</b>? A pessoa sai do painel na hora.`, 'Desativar', true))) return;
        const { id: _, ...d } = u; return Repo.salvar(this.COL, id, { ...d, ativo: novo }, { modulo: 'acessos', rotulo: `Acesso · ${this.nomeDe(u)}`, detalhe: novo ? 'Reativado' : 'Desativado' });
      }
      case 'acc-remover': {
        if (u.perfil === 'MASTER' && this.masters().length <= 1) return UI.toast('Este é o único Master ativo.');
        if (!(await UI.confirmar('Remover usuário', `Remover o acesso de <b>${esc(this.nomeDe(u))}</b>? O funcionário continua no Módulo 1 e pode ser ativado de novo.`, 'Remover', true))) return;
        return Sessao.prov.removerAcesso(u, `Acesso · ${this.nomeDe(u)}`);
      }
    }
  },
  mudanca(a, el) { if (a === 'acc-filtro') { this.ui.situacao = el.value; App.render(); } },
  entrada(a, el) { if (a === 'acc-busca') { this.ui.busca = el.value; App.render(); } },
};

const App = {
  rota: 'menu', _raf: null, navAberto: false,
  agendarRender() { if (this._raf) return; this._raf = requestAnimationFrame(() => { this._raf = null; this.render(); }); },
  ir(rota) {
    if (!Sessao.ativa) return Sessao.render(); // sem acesso validado: só a tela de entrada
    const todos = [...MODULOS, ...ADMIN];
    const m = todos.find(x => x.id === rota);
    if (m && (!Auth.can(m.perm) || m.emBreve)) rota = 'menu';
    if (this.rota === 'retaguarda' && rota !== 'retaguarda') Retaguarda.liberarAdq?.(); // saiu da Retaguarda (Módulo 5): libera a memória
    if (this.rota === 'contratos' && rota !== 'contratos') Contratos.pararVigia();
    this.rota = rota; this.navAberto = false; document.body.classList.remove('nav-open');
    try { history.replaceState(null, '', rota === 'menu' ? location.pathname : '#' + rota); } catch { }
    this.render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    if (rota === 'auditoria') Aud.carregar();
  },
  render() {
    if (!Sessao.ativa) return Sessao.render();
    $('#topbar').innerHTML = this.topbar();
    const main = $('#main');
    const ativo = document.activeElement, idAtivo = ativo && ativo.id, sel = ativo && 'selectionStart' in ativo ? [ativo.selectionStart, ativo.selectionEnd] : null;
    const crumbs = this.rota === 'menu' ? '' : `<div class="crumbs"><button data-a="nav" data-r="menu">Painel de Gestão</button><span>/</span><span>${esc(([...MODULOS, ...ADMIN].find(m => m.id === this.rota) || {}).titulo || '')}</span></div>`;
    const tela = { menu: () => this.menu(), pessoal: () => Pessoal.render(), lojas: () => Lojas.render(), contratos: () => Contratos.render(), acessos: () => Acessos.render(), integracoes: () => Integracoes.render(), fcx: () => FCX.render(), retaguarda: () => Retaguarda.render(), auditoria: () => Aud.render(), backup: () => Bkp.render() }[this.rota];
    main.innerHTML = crumbs + (tela ? tela() : this.menu());
    UI.rotularTabelas(main);
    if (this.rota === 'retaguarda') Retaguarda.afterRender();
    if (this.rota === 'fcx') FCX.afterRender();
    if (this.rota === 'lojas') Lojas.afterRender();
    if (this.rota === 'contratos') Contratos.afterRender();
    if (this.rota === 'acessos') Acessos.afterRender();
    if (idAtivo) { const el = document.getElementById(idAtivo); if (el && el !== document.activeElement) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch { } } }
    FCX.sincronizar(); // o iframe do FCX vive fora de #main e não é recriado
  },
  /** Barra superior + navegação global. No celular/tablet (≤ 900px) a navegação vira gaveta (hambúrguer). */
  topbar() {
    const podeSimular = Auth.perfilReal === 'GESTOR';
    const itens = [{ id: 'menu', titulo: 'Início', icon: 'inicio' }, ...MODULOS, ...ADMIN].filter(m => m.id === 'menu' || Auth.can(m.perm));
    const seletor = podeSimular ? `<select data-a="perfil-sim" class="perfil-sel" aria-label="Visualizar como perfil">
          <option value="GESTOR" ${Auth.perfil === 'GESTOR' ? 'selected' : ''}>MASTER</option><option value="OPERACIONAL" ${Auth.perfil === 'OPERACIONAL' ? 'selected' : ''}>OPERACIONAL</option></select>`
        : `<span class="perfil-tag ${Auth.perfil}">${Auth.perfil === 'GESTOR' ? 'MASTER' : 'OPERACIONAL'}</span>`;
    return `<div class="topbar-inner">
      <button class="burger" data-a="nav-toggle" aria-label="${this.navAberto ? 'Fechar menu' : 'Abrir menu'}" aria-expanded="${this.navAberto}" aria-controls="mainnav">${this.navAberto ? ICON.fechar : ICON.menu}</button>
      <button class="brand" data-a="nav" data-r="menu" aria-label="Painel de Gestão — início"><img src="${LOGO_BRANCO}" alt="Esposende"><span class="sep"></span><span class="app">Painel de Gestão</span></button>
      <span class="spacer"></span>
      <span class="sync ${Cloud.nuvem ? '' : 'local'}" id="sync"><i></i><span id="syncTxt">${Cloud.nuvem ? 'salvo na nuvem' : 'salvo neste navegador'}</span></span>
      <div class="userchip">
        <div class="who"><b>${esc(Auth.nome)}</b><span>${Auth.simulado ? 'visualizando como' : 'perfil'}</span></div>
        ${seletor}
        ${Auth.avatar ? `<img src="${esc(Auth.avatar)}" alt="">` : ''}
        <button class="iconbtn sair" data-a="sess-sair" aria-label="Sair do painel" title="Sair do painel">${ICON.sair}</button>
      </div></div>
      <nav id="mainnav" class="mainnav ${this.navAberto ? 'open' : ''}" aria-label="Módulos">
        <div class="nav-inner">
          <div class="nav-user"><b>${esc(Auth.nome)}</b>${seletor}</div>
          ${itens.map(m => `<button class="${this.rota === m.id ? 'on' : ''}" data-a="nav" data-r="${m.id}" ${this.rota === m.id ? 'aria-current="page"' : ''} title="${esc(m.titulo)}" aria-label="${esc(m.titulo)}">${ICON[m.icon] || ''}<span class="nav-longo">${esc(m.titulo)}</span><span class="nav-curto" aria-hidden="true">${esc(m.curto || m.titulo)}</span></button>`).join('')}
        </div></nav>
      <div class="nav-scrim" data-a="nav-toggle" aria-hidden="true"></div>`;
  },
  menu() {
    const h = new Date().getHours(), saud = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    const hoje = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    const card = (m, extra = '') => {
      const ok = Auth.can(m.perm);
      if (!ok) return '';
      return `<button class="mod ${m.emBreve ? 'soon' : ''} ${extra}" ${m.emBreve ? 'aria-disabled="true"' : `data-a="nav" data-r="${m.id}"`}>
        <div class="head"><div class="ico">${ICON[m.icon]}</div>${m.emBreve ? '<span class="pill neutral">Em construção</span>' : ''}</div>
        <div><div class="eyebrow">${m.num || 'Administração'}</div><h3>${esc(m.titulo)}</h3></div>
        <p>${esc(m.desc)}</p>
        <div class="foot"><span class="stat">${m.stat ? m.stat() : ''}</span>${m.emBreve ? '' : '<span class="go">Abrir →</span>'}</div></button>`;
    };
    const admin = ADMIN.map(m => card(m, 'restrito')).join('');
    return `<div class="hello"><div><h1>${saud}, ${esc(Auth.nome.split(' ')[0])}.</h1><p>Escolha um módulo para começar.</p></div><span class="today">${hoje}</span></div>
      <div class="modules">${MODULOS.map(m => card(m)).join('')}</div>
      ${Auth.can('retaguarda.ieo.ver') && Repo.prontas.has('alertas') && Retaguarda.alertasAbertos().length ? `<div class="alerta-critico" role="alert" style="margin:18px 0 0"><div class="ic">${ICON.alerta}</div><div style="flex:1"><b>${Retaguarda.alertasAbertos().length} loja(s) em Zona Vermelha no IEO</b><div>A supervisão precisa tomar ciência.</div></div><button class="btn sm" data-a="nav-ieo">Ver IEO</button></div>` : ''}
      ${admin ? `<div class="section-label">Administração · somente GESTOR</div><div class="modules">${admin}</div>` : ''}
      ${!Cloud.nuvem && Auth.can('acessos.gerir') ? `<div class="note warn" style="margin-top:24px">Os dados estão sendo salvos neste navegador. Para várias pessoas usarem os mesmos dados (inclusive usuários e senhas), conecte o banco de dados compartilhado (Supabase): veja Configurações de Integração e o LEIA-ME.</div>` : ''}`;
  },
};

/* ---------------------------- Auditoria ---------------------------- */
const Aud = {
  ui: { aba: 'log', usuario: '', modulo: '', acao: '', busca: '', dias: 31 }, eventos: null, nomes: {}, erro: '', usuarios: [],
  async carregar() {
    this.eventos = null; this.erro = ''; App.render();
    try {
      this.eventos = await Audit.carregar({ dias: this.ui.dias });
      this.usuarios = await Cloud.adapter.list('presenca').catch(() => []);
      const ids = [...new Set([...this.eventos.map(e => e.uid), ...this.usuarios.map(u => u.id)])];
      this.nomes = await Auth.nomes(ids);
    } catch (e) { this.erro = e.message || String(e); this.eventos = []; }
    App.render();
  },
  filtrados() {
    const u = this.ui, q = u.busca.toLowerCase();
    return (this.eventos || []).filter(e => (!u.usuario || e.uid === u.usuario) && (!u.modulo || e.modulo === u.modulo) && (!u.acao || e.acao === u.acao)
      && (!q || [e.rotulo, e.entidadeId, e.detalhe, ...(e.mudancas || []).map(m => m.campo + m.de + m.para)].join(' ').toLowerCase().includes(q)));
  },
  render() {
    const u = this.ui;
    const tabs = `<div class="tabs"><button class="${u.aba === 'log' ? 'on' : ''}" data-a="aud-aba" data-v="log">Log de alterações</button><button class="${u.aba === 'usuarios' ? 'on' : ''}" data-a="aud-aba" data-v="usuarios">Usuários e permissões</button></div>`;
    const head = `<div class="page-head"><div><h1>Auditoria</h1><p>Registro oculto e permanente de cada gravação feita no painel. Visível apenas para o perfil GESTOR.</p></div>
      <div class="row"><button class="btn sec" data-a="aud-recarregar">Atualizar</button>${this.eventos?.length ? '<button class="btn" data-a="aud-exportar">Exportar (.xlsx)</button>' : ''}</div></div>`;
    if (u.aba === 'usuarios') return head + tabs + this.renderUsuarios();
    if (this.eventos == null) return head + tabs + '<div class="panel"><p class="muted">Carregando registros…</p></div>';
    const lista = this.filtrados(), mods = [...new Set(this.eventos.map(e => e.modulo))].sort(), acs = [...new Set(this.eventos.map(e => e.acao))].sort();
    const opt = (k, arr, rot) => `<div class="field"><label class="lbl" for="aud_${k}">${rot}</label><select id="aud_${k}" data-a="aud-filtro" data-k="${k}"><option value="">Todos</option>${arr.map(([v, l]) => `<option value="${esc(v)}" ${v === u[k] ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    const cor = { criou: 'ok', alterou: 'info', excluiu: 'bad', emitiu: 'neutral' };
    return head + tabs + `<div class="panel">
      <div class="toolbar">
        <div class="field grow"><label class="lbl" for="audBusca">Buscar</label><input id="audBusca" type="search" value="${esc(u.busca)}" placeholder="Registro, campo, valor…" data-a="aud-busca"></div>
        ${opt('usuario', Object.entries(this.nomes), 'Usuário')}${opt('modulo', mods.map(m => [m, m]), 'Módulo')}${opt('acao', acs.map(a => [a, a]), 'Ação')}
        <div class="field"><label class="lbl" for="audDias">Período</label><select id="audDias" data-a="aud-dias">${[[7, '7 dias'], [31, '31 dias'], [90, '90 dias'], [365, '12 meses']].map(([v, l]) => `<option value="${v}" ${v === u.dias ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      </div>
      ${this.erro ? `<div class="note warn">${esc(this.erro)}</div>` : ''}
      ${lista.length ? `<div class="tbl-wrap"><table><thead><tr><th>Data e hora</th><th>Quem fez</th><th>O que fez</th><th>Registro</th><th>Alterações</th></tr></thead><tbody>
        ${lista.slice(0, 500).map(e => `<tr><td class="mono" style="white-space:nowrap">${Fmt.dataHora(e.ts)}</td>
          <td><div class="cell-main">${esc(this.nomes[e.uid] || e.uid)}</div><span class="perfil-tag ${e.perfil}" style="font-size:9.5px">${esc(e.perfil)}</span></td>
          <td><span class="pill ${cor[e.acao] || 'neutral'}">${esc(e.acao)}</span><div class="cell-sub">${esc(e.modulo)}</div></td>
          <td>${esc(e.rotulo)}${e.detalhe ? `<div class="cell-sub">${esc(e.detalhe)}</div>` : ''}</td>
          <td>${(e.mudancas || []).length ? `<details class="log"><summary>${e.mudancas.length} campo(s)</summary>${e.mudancas.map(m => `<div class="chg"><b>${esc(m.campo)}</b>: ${esc(m.de)} → ${esc(m.para)}</div>`).join('')}</details>` : '<span class="hint">—</span>'}</td></tr>`).join('')}
      </tbody></table></div><p class="hint" style="margin-top:8px">${lista.length} evento(s)${lista.length > 500 ? ' · exibindo os 500 mais recentes (exporte para ver todos)' : ''}</p>`
        : '<div class="empty">Nenhum evento no período.</div>'}</div>`;
  },
  renderUsuarios() {
    const perfis = ['GESTOR', 'OPERACIONAL'];
    return `<div class="grid g2">
      <div class="panel"><h2>Quem acessa o painel</h2><p class="sub">Perfis e permissões de cada pessoa são definidos na <b>Gestão de Acessos</b> (Master e Operacional com matriz por módulo).</p>
        ${this.usuarios.length ? `<table><thead><tr><th>Usuário</th><th>Perfil</th><th>Último acesso</th></tr></thead><tbody>${this.usuarios.map(p => `<tr><td>${esc(this.nomes[p.id] || p.id)}</td><td><span class="perfil-tag ${p.perfil}" style="border:1px solid var(--line)">${esc(p.perfil)}</span></td><td class="mono">${Fmt.data(p.ultimoDia)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Ninguém registrado ainda.</div>'}</div>
      <div class="panel"><h2>Matriz de permissões</h2><p class="sub">Estrutura pronta para o detalhamento. Edite <span class="mono">PERMISSOES</span> no código ou grave <span class="mono">config/permissoes</span>.</p>
        <div class="tbl-wrap"><table><thead><tr><th>Permissão</th>${perfis.map(p => `<th style="text-align:center">${p}</th>`).join('')}</tr></thead><tbody>
        ${PERMISSOES._catalogo.map(perm => `<tr><td class="mono" style="font-size:12px">${perm}</td>${perfis.map(p => { const l = Auth.matriz[p] || []; const ok = l.some(x => x === '*' || x === perm || (x.endsWith('.*') && perm.startsWith(x.slice(0, -1)))); return `<td style="text-align:center">${ok ? `<span class="pill ok">${ICON.ok}</span>` : '<span class="hint">—</span>'}</td>`; }).join('')}</tr>`).join('')}
        </tbody></table></div></div></div>`;
  },
  async exportar() {
    const XLSX = await Libs.xlsx();
    const linhas = this.filtrados().flatMap(e => (e.mudancas?.length ? e.mudancas : [{}]).map(m => ({ 'Data/hora': Fmt.dataHora(e.ts), Usuário: this.nomes[e.uid] || e.uid, Perfil: e.perfil, Módulo: e.modulo, Ação: e.acao, Registro: e.rotulo, Campo: m.campo || '', De: m.de || '', Para: m.para || '' })));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), 'Auditoria');
    const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    await Documento.baixarArquivo(`auditoria_${Datas.hojeISO()}.xlsx`, new Blob([buf]));
  },
  acao(a, el) {
    if (a === 'aud-aba') { this.ui.aba = el.dataset.v; return App.render(); }
    if (a === 'aud-recarregar') return this.carregar();
    if (a === 'aud-exportar') return this.exportar();
  },
  mudanca(a, el) {
    if (a === 'aud-filtro') { this.ui[el.dataset.k] = el.value; App.render(); }
    if (a === 'aud-dias') { this.ui.dias = +el.value; this.carregar(); }
  },
  entrada(a, el) { if (a === 'aud-busca') { this.ui.busca = el.value; App.render(); } },
};

/* ------------------------------ Backup ------------------------------ */
const Bkp = {
  // v15: todas as coleções de negócio (usuários, chaves de integração e auditoria ficam fora)
  COLECOES: ['lojas', 'funcionarios', 'pdi', 'salarios', 'config', 'fcx', 'rh_cargos', 'rh_centros', 'contratos_locacao', 'seguros_vigencia', 'aluguel_projecoes',
    'credsystem', 'faltas', 'caixas', 'ieo_ocorrencias', 'ieo_fechamentos', 'ieo_laudos', 'alertas', 'adq_taxas', 'adq_auditorias', 'adq_excecoes', 'contasBancarias', 'extratos', 'dfc'],
  render() {
    const cont = c => Repo.cols[c] ? Repo.todos(c).length : '—';
    return `<div class="page-head"><div><h1>Backup e dados</h1><p>Guarde uma cópia completa dos dados em arquivo e restaure quando precisar.</p></div></div>
      <div class="grid g3" style="margin-bottom:16px">
        <div class="kpi"><div class="k">Armazenamento</div><div class="v" style="font-size:18px">${esc(Cloud.adapter.rotulo)}</div><div class="d">${Cloud.nuvem ? 'sincronizado em tempo real' : 'apenas neste navegador'}</div></div>
        <div class="kpi"><div class="k">Lojas · colaboradores</div><div class="v">${cont('lojas')} · ${cont('funcionarios')}</div><div class="d">registros no cadastro</div></div>
        <div class="kpi"><div class="k">Avaliações PDI</div><div class="v">${Repo.todos('pdi').reduce((a, p) => a + (p.avaliacoes || []).length, 0)}</div><div class="d">em ${cont('pdi')} colaboradores</div></div>
      </div>
      <div class="grid g2">
        <div class="panel"><h2>Backup completo (.json)</h2><p class="sub">Todas as coleções: lojas, equipe, PDI${Auth.can('pessoal.salario.ver') ? ', salários' : ''}, contratos e apólices, FCX e DFC, Retaguarda e configurações (usuários e chaves de API ficam fora). Guarde em local seguro (contém dados pessoais).</p>
          <label class="check"><input type="checkbox" id="bkpLog"> Incluir log de auditoria</label>
          <div class="row" style="margin-top:14px"><button class="btn" data-a="bkp-json">Baixar backup completo</button></div></div>
        <div class="panel"><h2>Planilhas (.xlsx)</h2><p class="sub">Lojas, adquirentes e equipe em abas separadas, para conferência no Excel.${Auth.can('pessoal.salario.ver') ? ' Salários só entram se você marcar.' : ''}</p>
          ${Auth.can('pessoal.salario.ver') ? '<label class="check"><input type="checkbox" id="bkpSal"> Incluir salários</label>' : ''}
          <div class="row" style="margin-top:14px"><button class="btn sec" data-a="bkp-xlsx">Baixar planilhas</button></div></div>
      </div>
      ${Auth.can('backup.restaurar') ? `<div class="panel"><h2>Restaurar backup</h2><p class="sub">Grava de volta os registros de um arquivo .json gerado aqui. Registros com o mesmo código são substituídos; o log de auditoria nunca é sobrescrito. A restauração fica registrada no log.</p>
        <label class="btn danger" style="cursor:pointer">Escolher arquivo de backup<input type="file" accept=".json,application/json" hidden data-a="bkp-restaurar"></label></div>` : ''}
      <div class="panel"><h2>Rotina recomendada</h2><p class="sub" style="margin-bottom:0">Backup completo toda sexta-feira e antes de importações grandes; mantenha as 8 últimas cópias numa pasta com acesso restrito (ex.: OneDrive/SharePoint da diretoria).</p></div>`;
  },
  async json() {
    const out = { app: 'painel-gestao-esposende', versao: 1, geradoEm: new Date().toISOString(), geradoPor: Auth.id, colecoes: {} };
    for (const c of this.COLECOES) { if (c === 'salarios' && !Auth.can('pessoal.salario.ver')) continue; out.colecoes[c] = await Cloud.adapter.list(c).catch(() => []); }
    if ($('#bkpLog')?.checked) out.auditoria = await Audit.carregar({ dias: 400 });
    const ok = await Documento.baixarArquivo(`backup_painel_esposende_${Datas.hojeISO()}.json`, JSON.stringify(out));
    if (ok) Audit.registrar({ modulo: 'backup', acao: 'exportou', entidade: 'backup', entidadeId: Datas.hojeISO(), rotulo: 'Backup completo', mudancas: Object.entries(out.colecoes).map(([k, v]) => ({ campo: k, de: '', para: v.length + ' registros' })) });
  },
  async xlsx() {
    const XLSX = await Libs.xlsx(), sal = $('#bkpSal')?.checked;
    const lojas = Repo.todos('lojas').sort((a, b) => a.codigo.localeCompare(b.codigo));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lojas.map(l => ({ Código: l.codigo, Loja: l.nome, Ativa: l.ativa ? 'SIM' : 'NÃO', Bandeira: l.bandeira, Tipo: l.tipo, CNPJ: l.cnpj, Endereço: l.endereco, Cidade: l.cidade, UF: l.uf, CEP: l.cep, Supervisor: l.supervisor, 'Faturamento médio': l.faturamentoMedio, Aluguel: l.contrato?.valorAluguel, Índice: l.contrato?.indice, 'Início contrato': l.contrato?.inicio, 'Fim contrato': l.contrato?.fim, 'Doc. contrato': l.contrato?.statusDocumento }))), 'Lojas');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lojas.flatMap(l => (l.adquirentes || []).map(a => ({ Código: l.codigo, Loja: l.nome, Adquirente: a.adquirente, Tipo: a.tipo, Posição: a.posicao, EC: a.ec, 'Nº lógico': a.codigoLogico, 'CNPJ TEF': a.cnpjTef, Concentradora: a.concentradora, Integradora: a.integradora })))), 'Adquirentes');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Repo.todos('funcionarios').map(f => ({ Nome: f.nome, Matrícula: f.matricula, Cargo: f.cargo, Lotação: Pessoal.lotacaoNome(f), Admissão: f.admissao, Situação: f.status, Escala: f.escala, Folgas: (f.folgas || []).join(', '), 'Banco de horas': f.bancoHoras, ...(sal ? { Salário: Repo.get('salarios', f.id)?.valor } : {}) }))), 'Equipe');
    const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    if (await Documento.baixarArquivo(`painel_esposende_${Datas.hojeISO()}.xlsx`, new Blob([buf]))) Audit.registrar({ modulo: 'backup', acao: 'exportou', entidade: 'planilhas', entidadeId: Datas.hojeISO(), rotulo: 'Planilhas' + (sal ? ' (com salários)' : ''), mudancas: [] });
  },
  async restaurar(file) {
    let dados; try { dados = JSON.parse(await file.text()); } catch { return UI.toast('Arquivo inválido.'); }
    if (dados.app !== 'painel-gestao-esposende') return UI.toast('Este arquivo não é um backup do Painel de Gestão.');
    const resumo = Object.entries(dados.colecoes || {}).map(([k, v]) => `${k}: ${v.length}`).join(' · ');
    if (!(await UI.confirmar('Restaurar backup', `Backup de ${Fmt.dataHora(dados.geradoEm)}.<br>${esc(resumo)}<br><br>Os registros atuais com o mesmo código serão substituídos.`, 'Restaurar', true))) return;
    UI.toast('Restaurando…'); let n = 0;
    for (const [col, docs] of Object.entries(dados.colecoes || {})) {
      if (!this.COLECOES.includes(col)) continue;
      if (Cloud.adapter.setLote) { await Cloud.adapter.setLote(col, docs); n += docs.length; UI.toast(`Restaurando… ${n} registros`); continue; }
      for (const d of docs) { const { id, ...resto } = d; await Cloud.adapter.set(col + '/' + id, resto); n++; if (n % 20 === 0) await sleep(200); }
    }
    await Audit.registrar({ modulo: 'backup', acao: 'restaurou', entidade: 'backup', entidadeId: dados.geradoEm, rotulo: 'Restauração de backup', mudancas: [{ campo: 'registros', de: '', para: String(n) }] });
    UI.toast(`Backup restaurado: ${n} registros.`);
  },
  acao(a) { if (a === 'bkp-json') return this.json(); if (a === 'bkp-xlsx') return this.xlsx(); },
  mudanca(a, el) { if (a === 'bkp-restaurar' && el.files[0]) return this.restaurar(el.files[0]); },
};

/* --------------------------- Eventos globais --------------------------- */
const ROTEADOR = [
  [/^(pes|func|sal|pdi|plano|folha)-/, () => Pessoal], [/^rt-/, () => Retaguarda], [/^(fcx|fd)-/, () => FCX], [/^(lj|adq|ti|desp|seg|doc)-/, () => Lojas], [/^ct-/, () => Contratos], [/^alg-/, () => ProjecaoOcupacao],
  [/^aud-/, () => Aud], [/^bkp-/, () => Bkp], [/^sess-/, () => Sessao], [/^acc-/, () => Acessos], [/^int-/, () => Integracoes],
];
const alvo = a => (ROTEADOR.find(([re]) => re.test(a)) || [])[1]?.();
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) return;
  const a = el.dataset.a;
  if (a === 'nav') return App.ir(el.dataset.r);
  if (a === 'nav-ieo') { Retaguarda.ui.aba = 'ieo'; return App.ir('retaguarda'); }
  if (a === 'nav-toggle') { App.navAberto = !App.navAberto; document.body.classList.toggle('nav-open', App.navAberto); $('#topbar').innerHTML = App.topbar(); return; }
  const m = alvo(a); if (m && m.acao) Promise.resolve(m.acao(a, el, e)).catch(err => UI.toast(err.message || String(err)));
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a;
  if (a === 'perfil-sim') { Auth.simular(el.value); UI.toast('Visualizando como ' + el.value); return App.ir(App.rota); }
  const m = alvo(a); if (m && m.mudanca) Promise.resolve(m.mudanca(a, el)).catch(err => UI.toast(err.message || String(err)));
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-a]'); if (!el) return; const m = alvo(el.dataset.a);
  if (m && m.entrada) { clearTimeout(App._deb); App._deb = setTimeout(() => m.entrada(el.dataset.a, el), 180); }
});

/* ------------------------------ Inicialização ------------------------------ */
/**
 * Inicialização em duas fases (v14):
 *   1) conecta ao armazenamento e mostra a TELA DE ENTRADA (login por CPF) — só usuarios e funcionarios são
 *      lidos para conferir o login; nenhum módulo, menu ou outro dado é carregado;
 *   2) com o login validado (Sessao.abrir) assina as coleções e desenha o painel (App.iniciarPainel).
 */
App.iniciarPainel = function () {
  ['lojas', 'funcionarios', 'pdi', 'config', 'rh_cargos', 'rh_centros', 'credsystem', 'faltas', 'caixas', 'ieo_ocorrencias', 'ieo_fechamentos', 'ieo_laudos', 'alertas'].forEach(c => Repo.assinar(c));
  if (Auth.can('lojas.ver')) Repo.assinar('seguros_vigencia'); // espelho sem valores (validade das apólices)
  if (Auth.can('lojas.contratos.ver')) ['contratos_locacao', 'aluguel_projecoes'].forEach(c => Repo.assinar(c));
  if (Auth.can('retaguarda.adq.ver')) ['adq_taxas', 'adq_auditorias', 'adq_excecoes'].forEach(c => Repo.assinar(c));
  if (Auth.can('fcx.dfc.ver')) ['contasBancarias', 'extratos', 'dfc'].forEach(c => Repo.assinar(c));
  if (Auth.can('pessoal.salario.ver')) Repo.assinar('salarios');
  if (Auth.can('acessos.gerir') || Auth.can('auditoria.ver')) Repo.assinar('usuarios');
  if (Auth.can('integracoes.gerir')) Repo.assinar('integracoes');
  Integracoes.iniciar(); // liga IA, CNPJ e armazenamento conforme Configurações de Integração
  Presenca.tocar();
  const h = (location.hash || '').slice(1);
  App.ir([...MODULOS, ...ADMIN].some(m => m.id === h) ? h : 'menu');
  if (Auth.can('fcx.ver')) setTimeout(() => { if (Sessao.ativa) FCX.preparar(); }, 1200); // cache + iframe do FCX em segundo plano
  ContratosManutencao._feito = false; ContratosManutencao.iniciar(); // GESTOR: migra apólices antigas das lojas e confere o espelho de vigência
};
(async function iniciar() {
  $('#main').innerHTML = '<div class="panel" style="margin-top:30px"><p class="muted" style="margin:0">Conectando ao Painel de Gestão…</p></div>';
  try { await Cloud.init(); }
  catch (e) { $('#main').innerHTML = `<div class="panel" style="margin-top:30px"><h2>Não foi possível conectar ao banco de dados</h2><p class="muted" style="margin:0">${esc(e.message || String(e))}. Verifique a conexão e o arquivo config.js da instalação.</p></div>`; return; }
  await Auth.init();
  Sessao.iniciar();
})();

</script>
