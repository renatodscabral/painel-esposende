    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal ${largo ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <header><h3>${esc(titulo)}</h3><button class="iconbtn" data-x aria-label="Fechar">✕</button></header>
      <div class="body">${corpo}</div>
      <footer>${acoes.map((a, i) => `<button class="btn ${a.classe || ''}" data-i="${i}">${esc(a.rotulo)}</button>`).join('')}</footer></div>`;
    const fechar = () => { ov.remove(); document.removeEventListener('keydown', onKey); if (!$('#modais').children.length) document.body.classList.remove('modal-aberto'); };
    const onKey = e => { if (e.key === 'Escape') fechar(); };
    document.addEventListener('keydown', onKey);
    ov.addEventListener('click', async e => {
      if (e.target === ov || e.target.closest('[data-x]')) return fechar();
      const b = e.target.closest('footer [data-i]'); if (!b) return;
      const a = acoes[+b.dataset.i];
      if (a.acao) { b.disabled = true; try { const r = await a.acao(ov.querySelector('.modal')); if (r === false || a.fechar === false) { b.disabled = false; return; } } catch (err) { b.disabled = false; UI.toast(err.message || String(err)); return; } }
      fechar();
    });
    $('#modais').appendChild(ov);
    document.body.classList.add('modal-aberto');
    if (aoAbrir) aoAbrir(ov.querySelector('.modal'));
    UI.rotularTabelas(ov);
    const f = ov.querySelector('.body input, .body select, .body textarea'); if (f) f.focus();
    return { el: ov.querySelector('.modal'), fechar };
  },
  /**
   * Responsividade de tabelas: copia o título de cada coluna para o atributo
   * data-label das células. No celular (CSS @media ≤ 720px) cada linha vira um
   * cartão com "rótulo: valor", sem rolagem lateral. Tabelas .heat e .nolabel ficam de fora.
   */
  rotularTabelas(raiz = document) {
    $$('table:not(.heat):not(.nolabel)', raiz).forEach(t => {
      const ths = $$('thead th', t); if (!ths.length) return;
      const rot = ths.map(th => (th.dataset.label ?? th.textContent).replace(/\s+/g, ' ').trim());
      t.classList.add('resp');
      $$('tbody tr, tfoot tr', t).forEach(tr => [...tr.children].forEach((td, i) => { if (td.colSpan > 1) { td.classList.add('span-all'); return; } td.dataset.label = rot[i] || ''; }));
    });
  },
  confirmar(titulo, texto, rotuloOk = 'Confirmar', perigo = false) {
    return new Promise(ok => {
      let r = false;
      const m = UI.modal({ titulo, corpo: `<p style="margin:0">${texto}</p>`, acoes: [{ rotulo: 'Cancelar', classe: 'sec' }, { rotulo: rotuloOk, classe: perigo ? 'danger' : '', acao: () => { r = true; } }] });
      const obs = new MutationObserver(() => { if (!document.body.contains(m.el)) { obs.disconnect(); ok(r); } });
      obs.observe($('#modais'), { childList: true });
    });
  },
  /** Lê os campos [name] de um formulário para um objeto (suporta "a.b.c", checkbox, number). */
  lerForm(el) {
    const o = {};
    $$('[name]', el).forEach(i => {
      let v;
      if (i.type === 'radio') { if (!i.checked) return; setPath(o, i.name, i.value); return; }
      if (i.type === 'checkbox') { if (i.dataset.lista) { if (!i.checked) return; const k = i.name; const cur = getPath(o, k) || []; cur.push(i.value); setPath(o, k, cur); return; } v = i.checked; }
      else if (i.type === 'number' || i.dataset.num) v = i.value === '' ? null : Number(String(i.value).replace(',', '.'));
      else v = i.value.trim();
      setPath(o, i.name, v);
    });
    return o;
  },
};
function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) { const ks = p.split('.'); let c = o; ks.slice(0, -1).forEach(k => { c = c[k] ??= {}; }); c[ks.at(-1)] = v; return o; }
function mergeProfundo(base, extra) {
  const r = clone(base) || {};
  for (const [k, v] of Object.entries(extra || {})) r[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? mergeProfundo(r[k] || {}, v) : v;
  return r;
}
/** Campo de formulário padrão. */
function campo(rotulo, nome, valor, { tipo = 'text', opcoes, full, dica, attrs = '' } = {}) {
  const id = 'f_' + nome.replace(/\W/g, '_');
  let input;
  if (opcoes) input = `<select id="${id}" name="${nome}" ${attrs}>${opcoes.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(valor ?? '') ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (tipo === 'textarea') input = `<textarea id="${id}" name="${nome}" ${attrs}>${esc(valor ?? '')}</textarea>`;
  else input = `<input id="${id}" type="${tipo}" name="${nome}" value="${esc(valor ?? '')}" ${tipo === 'number' ? 'step="any"' : ''} ${attrs}>`;
  return `<div class="field ${full ? 'full' : ''}"><label class="lbl" for="${id}">${esc(rotulo)}</label>${input}${dica ? `<span class="hint" style="margin-top:4px">${dica}</span>` : ''}</div>`;
}

/* =====================================================================
   FOLHA — cálculo de encargos, folha líquida estimada e custo real
   ---------------------------------------------------------------------
   AJUSTE AQUI conforme o regime tributário da Esposende.
   • Tabelas do empregado (INSS e IRRF) mudam todo ano: atualize a
     vigência e os valores em janeiro.
   • Encargos patronais e provisões também podem ser alterados pela
     tela (Gestão de Pessoal → Parâmetros da folha), que grava em
     config/folha e sobrescreve os valores abaixo sem mexer no código.
   Todos os percentuais estão em fração (0.08 = 8%).
   ===================================================================== */
const FOLHA_PADRAO = {
  vigencia: '2026',
  regime: 'LUCRO_REAL', // 'LUCRO_REAL' (também vale p/ Presumido) | 'SIMPLES'

  /* ---- Descontos do empregado ---- */
  // INSS 2026 — tabela progressiva (salário mínimo R$ 1.621,00; teto R$ 8.475,55)
  inssEmpregado: {
    faixas: [
      { ate: 1621.00, aliquota: 0.075 },
      { ate: 2902.84, aliquota: 0.09 },
      { ate: 4354.27, aliquota: 0.12 },
      { ate: 8475.55, aliquota: 0.14 },
    ],
  },
  // IRRF mensal 2026 — tabela progressiva + redutor da Lei 15.270/2025
  irrf: {
    faixas: [
      { ate: 2428.80, aliquota: 0, deduzir: 0 },
      { ate: 2826.65, aliquota: 0.075, deduzir: 182.16 },
      { ate: 3751.05, aliquota: 0.15, deduzir: 394.16 },
      { ate: 4664.68, aliquota: 0.225, deduzir: 675.49 },
      { ate: Infinity, aliquota: 0.275, deduzir: 908.73 },
    ],
    deducaoDependente: 189.59,
    descontoSimplificado: 607.20,        // usado quando for maior que INSS + dependentes
    redutor: { limiteIsencao: 5000.00, valorAteLimite: 312.89, limiteFinal: 7350.00, constante: 978.62, fator: 0.133145 },
  },
  valeTransporte: { descontar: false, percentual: 0.06 }, // desconto de até 6% do salário

  /* ---- Encargos patronais (sobre o salário) ---- */
  patronal: {
    inss: 0.20,          // cota patronal (0 no Simples Nacional, Anexos I a III)
    rat: 0.02,           // RAT/SAT conforme CNAE — confirme no eSocial
    fap: 1.00,           // Fator Acidentário de Prevenção (0,5 a 2,0)
    terceiros: 0.058,    // FPAS 515 (comércio): Sal.-educação 2,5 + INCRA 0,2 + SESC 1,5 + SENAC 1,0 + SEBRAE 0,6
    fgts: 0.08,
  },

  /* ---- Provisões mensais ---- */
  provisoes: {
    ferias: (1 / 12) * (4 / 3),  // 1/12 de férias + 1/3 constitucional = 11,11%
    decimoTerceiro: 1 / 12,      // 8,33%
    encargosSobreProvisoes: true, // INSS patronal, RAT, terceiros e FGTS incidem sobre férias e 13º
    multaFgtsRescisoria: false,   // provisão de 40% do FGTS (opcional)
  },

  beneficiosPorColaborador: 0, // R$/mês (VR, VA, plano de saúde…) somado ao custo real
};

/** Predefinições de regime: aplicadas pela tela de parâmetros. */
const FOLHA_REGIMES = {
  LUCRO_REAL: { rotulo: 'Lucro Real / Presumido', patronal: { inss: 0.20, rat: 0.02, fap: 1, terceiros: 0.058, fgts: 0.08 } },
  SIMPLES: { rotulo: 'Simples Nacional (Anexo I — comércio)', patronal: { inss: 0, rat: 0, fap: 1, terceiros: 0, fgts: 0.08 } },
};

const Folha = {
  /** Parâmetros vigentes = padrão do código + ajustes salvos pelo GESTOR (config/folha). */
  params() {
    const salvo = Repo.get('config', 'folha');
    return salvo && salvo.params ? mergeProfundo(FOLHA_PADRAO, salvo.params) : FOLHA_PADRAO;
  },
  r2: n => Math.round((n + Number.EPSILON) * 100) / 100,

  /** INSS do empregado pela tabela progressiva (cada faixa tributa só a sua parte). */
  inssEmpregado(sal, p = this.params()) {
    let ant = 0, total = 0;
    for (const f of p.inssEmpregado.faixas) {
      if (sal <= ant) break;
      total += (Math.min(sal, f.ate) - ant) * f.aliquota; ant = f.ate;
    }
    return this.r2(total);
  },

  /** IRRF mensal com dedução legal ou desconto simplificado (o que for melhor) e redutor 2026. */
  irrf(sal, inss, dependentes = 0, p = this.params()) {
    const t = p.irrf, legais = inss + dependentes * t.deducaoDependente;
    const deducao = Math.max(legais, t.descontoSimplificado);
    const base = Math.max(0, sal - deducao);
    const faixa = t.faixas.find(f => base <= f.ate);
    const imposto = Math.max(0, base * faixa.aliquota - faixa.deduzir);
    let redutor = 0; const r = t.redutor;
    if (r) {
      if (sal <= r.limiteIsencao) redutor = r.valorAteLimite;
      else if (sal <= r.limiteFinal) redutor = Math.max(0, r.constante - r.fator * sal);
    }
    return { base: this.r2(base), deducao: this.r2(deducao), usouSimplificado: t.descontoSimplificado > legais, imposto: this.r2(imposto), redutor: this.r2(Math.min(redutor, imposto)), valor: this.r2(Math.max(0, imposto - redutor)) };
  },

  /**
   * Cálculo completo de um salário.
   * @returns {{base, inss, irrf, vt, liquido, encargos:[{rotulo,valor}], totalEncargos, custoTotal, fator}}
   */
  calcular(salario, { dependentes = 0 } = {}) {
    const p = this.params(), s = Number(salario) || 0;
    if (!s) return null;
    const inss = this.inssEmpregado(s, p);
    const ir = this.irrf(s, inss, Number(dependentes) || 0, p);
    const vt = p.valeTransporte.descontar ? this.r2(s * p.valeTransporte.percentual) : 0;
    const liquido = this.r2(s - inss - ir.valor - vt);

    const pt = p.patronal, pv = p.provisoes;
    const ratAjustado = pt.rat * pt.fap;
    const aliqSobreFolha = pt.inss + ratAjustado + pt.terceiros + pt.fgts;
    const provFerias = s * pv.ferias, prov13 = s * pv.decimoTerceiro;
    const encargos = [
      { rotulo: 'INSS patronal', valor: s * pt.inss, pct: pt.inss },
      { rotulo: 'RAT × FAP', valor: s * ratAjustado, pct: ratAjustado },
      { rotulo: 'Terceiros (Sistema S)', valor: s * pt.terceiros, pct: pt.terceiros },
      { rotulo: 'FGTS', valor: s * pt.fgts, pct: pt.fgts },
      { rotulo: 'Provisão de férias + 1/3', valor: provFerias, pct: pv.ferias },
      { rotulo: 'Provisão de 13º salário', valor: prov13, pct: pv.decimoTerceiro },
    ];
    if (pv.encargosSobreProvisoes) encargos.push({ rotulo: 'Encargos sobre provisões', valor: (provFerias + prov13) * aliqSobreFolha, pct: (pv.ferias + pv.decimoTerceiro) * aliqSobreFolha });
    if (pv.multaFgtsRescisoria) encargos.push({ rotulo: 'Provisão multa FGTS (40%)', valor: s * pt.fgts * 0.4, pct: pt.fgts * 0.4 });
    if (p.beneficiosPorColaborador) encargos.push({ rotulo: 'Benefícios', valor: Number(p.beneficiosPorColaborador), pct: Number(p.beneficiosPorColaborador) / s });
    encargos.forEach(e => { e.valor = this.r2(e.valor); });
    const totalEncargos = this.r2(encargos.reduce((a, e) => a + e.valor, 0));
    const custoTotal = this.r2(s + totalEncargos);
    return { base: s, inss, irrf: ir, vt, liquido, encargos, totalEncargos, custoTotal, fator: custoTotal / s, params: p };
  },

  /** Bloco HTML com a composição (usado no formulário do colaborador). */
  composicaoHTML(c) {
    if (!c) return '<p class="hint">Informe o salário para ver a folha líquida e o custo real.</p>';
    const pct = v => Fmt.pct(v * 100, 2);
    return `<div class="grid g3 folha-kpis">
        <div class="kpi"><div class="k">Salário base</div><div class="v mono">${Fmt.brl(c.base)}</div></div>
        <div class="kpi"><div class="k">Líquido estimado</div><div class="v mono" style="color:var(--ok)">${Fmt.brl(c.liquido)}</div><div class="d">${Fmt.pct((c.liquido / c.base) * 100, 1)} do salário</div></div>
        <div class="kpi"><div class="k">Custo real para a empresa</div><div class="v mono" style="color:var(--accent)">${Fmt.brl(c.custoTotal)}</div><div class="d">${Fmt.num(c.fator, 2)}× o salário</div></div>
      </div>
      <div class="grid g2" style="margin-top:12px">
        <div class="tbl-wrap"><table class="nolabel"><thead><tr><th>Descontos do colaborador</th><th class="num">Valor</th></tr></thead><tbody>
          <tr><td>INSS (tabela progressiva ${esc(c.params.vigencia)})</td><td class="num">− ${Fmt.brl(c.inss)}</td></tr>
          <tr><td>IRRF ${c.irrf.redutor ? `<span class="hint">(imposto ${Fmt.brl(c.irrf.imposto)} − redutor ${Fmt.brl(c.irrf.redutor)})</span>` : ''}${c.irrf.usouSimplificado ? ' <span class="hint">· desconto simplificado</span>' : ''}</td><td class="num">− ${Fmt.brl(c.irrf.valor)}</td></tr>
          ${c.vt ? `<tr><td>Vale-transporte</td><td class="num">− ${Fmt.brl(c.vt)}</td></tr>` : ''}
          <tr><td><b>Folha líquida estimada</b></td><td class="num"><b>${Fmt.brl(c.liquido)}</b></td></tr></tbody></table></div>
        <div class="tbl-wrap"><table class="nolabel"><thead><tr><th>Encargos e provisões da empresa</th><th class="num">%</th><th class="num">Valor</th></tr></thead><tbody>
          ${c.encargos.map(e => `<tr><td>${esc(e.rotulo)}</td><td class="num">${pct(e.pct)}</td><td class="num">${Fmt.brl(e.valor)}</td></tr>`).join('')}
          <tr><td><b>Total de encargos</b></td><td class="num">${pct(c.totalEncargos / c.base)}</td><td class="num"><b>${Fmt.brl(c.totalEncargos)}</b></td></tr></tbody></table></div>
      </div>
      <p class="hint" style="margin-top:8px">Estimativa mensal sem horas extras, comissões, faltas ou pensão. Parâmetros: ${esc(FOLHA_REGIMES[c.params.regime]?.rotulo || c.params.regime)}.</p>`;
  },

  /** Tela de parâmetros (GESTOR). Grava config/folha — o log registra quem alterou. */
  abrirParametros() {
    const p = this.params(), pt = p.patronal, pv = p.provisoes;
    const pc = v => Fmt.num(v * 100, 2).replace('.', '');
    const campoPct = (rot, nome, v, dica) => campo(rot + ' (%)', nome, pc(v), { attrs: 'inputmode="decimal" data-pct="1"', dica });
    UI.modal({
      titulo: 'Parâmetros da folha', largo: true,
      corpo: `<div class="note" style="margin-bottom:14px">Valores usados no cálculo de folha líquida e custo real de todos os colaboradores. As tabelas de INSS e IRRF ${esc(p.vigencia)} ficam no código (<span class="mono">FOLHA_PADRAO</span>) e devem ser atualizadas a cada ano.</div>
        <div class="form-grid">
          ${campo('Regime tributário', 'regime', p.regime, { opcoes: Object.entries(FOLHA_REGIMES).map(([k, r]) => [k, r.rotulo]), dica: 'Ao trocar, os encargos patronais abaixo recebem os valores padrão do regime.' })}
          ${campo('Benefícios por colaborador (R$/mês)', 'beneficiosPorColaborador', p.beneficiosPorColaborador, { tipo: 'number', dica: 'VR, VA, plano de saúde. Entra no custo real.' })}
          ${campoPct('INSS patronal', 'patronal.inss', pt.inss)}${campoPct('RAT/SAT', 'patronal.rat', pt.rat, 'Conforme CNAE.')}
          ${campo('FAP', 'patronal.fap', Fmt.num(pt.fap, 4), { attrs: 'inputmode="decimal" data-num="1"', dica: 'Entre 0,5000 e 2,0000.' })}${campoPct('Terceiros (Sistema S)', 'patronal.terceiros', pt.terceiros)}
          ${campoPct('FGTS', 'patronal.fgts', pt.fgts)}
          <div class="field"><span class="lbl">Provisões</span>
            <label class="check" style="padding-top:6px"><input type="checkbox" name="provisoes.encargosSobreProvisoes" ${pv.encargosSobreProvisoes ? 'checked' : ''}> Encargos sobre férias e 13º</label>
            <label class="check" style="padding-top:6px"><input type="checkbox" name="provisoes.multaFgtsRescisoria" ${pv.multaFgtsRescisoria ? 'checked' : ''}> Provisionar multa de 40% do FGTS</label>
            <label class="check" style="padding-top:6px"><input type="checkbox" name="valeTransporte.descontar" ${p.valeTransporte.descontar ? 'checked' : ''}> Descontar vale-transporte (6%) no líquido</label></div>
        </div>`,
      aoAbrir: m => $('[name="regime"]', m).addEventListener('change', e => {
        const r = FOLHA_REGIMES[e.target.value]; if (!r) return;
        Object.entries(r.patronal).forEach(([k, v]) => { const i = $(`[name="patronal.${k}"]`, m); if (i) i.value = k === 'fap' ? Fmt.num(v, 4) : pc(v); });
      }),
      acoes: [{ rotulo: 'Cancelar', classe: 'sec' }, {
        rotulo: 'Salvar parâmetros', acao: async m => {
          const d = {};
          $$('[name]', m).forEach(i => {
            let v;
            if (i.type === 'checkbox') v = i.checked;
            else if (i.dataset.pct) v = Number(String(i.value).replace(/\./g, '').replace(',', '.')) / 100;
            else if (i.dataset.num || i.type === 'number') v = Number(String(i.value).replace(',', '.')) || 0;
            else v = i.value;
            setPath(d, i.name, v);
          });
          if (Object.values(d.patronal).some(v => isNaN(v) || v < 0)) { UI.toast('Confira os percentuais.'); return false; }
          await Repo.salvar('config', 'folha', { params: d }, { modulo: 'pessoal', rotulo: 'Parâmetros da folha' });
          UI.toast('Parâmetros salvos — custos recalculados.');
        }
      }],
    });
  },
};

/* =====================================================================
   RH — TABELAS DE DOMÍNIO (Cargos e Centros de Custo)
   Camada 6 (Serviços). A tela de Parametrizações fica em pessoal.js.
   Modelos:
     rh_cargos/<id>   { codigo, nome, status:'ativo'|'inativo', criadoEm, atualizadoEm, ... }
     rh_centros/<id>  { codigo, nome, status:'ativo'|'inativo', ... }
   Regras:
     • Exclusão é lógica (status 'inativo'): o histórico dos colaboradores continua apontando para o id.
     • Não há duplicidade: o código é único na tabela; a descrição é única em Cargos e, em Centros
       de Custo, única entre itens sem código (o plano repete nomes como "GESTÃO" sob códigos diferentes).
       Comparação sem acento e sem diferenciar maiúsculas.
     • Escrita somente pelo GESTOR (regra do banco: leitura "interact", escrita "admin").
   CSV de importação (cabeçalho exato): Categoria,Codigo,Descricao
     Categoria = "Cargo" ou "Centro de Custo"
   ===================================================================== */
const RH_TABELAS = {
  // nomeUnico: cargos nunca repetem a descrição; centros podem repetir (ex.: "GESTÃO") desde que o código seja outro
  cargos: { col: 'rh_cargos', rotulo: 'Cargos', singular: 'cargo', categoriaCSV: 'Cargo', prefixo: 'cg', nomeUnico: true },
  centros: { col: 'rh_centros', rotulo: 'Centros de Custo', singular: 'centro de custo', categoriaCSV: 'Centro de Custo', prefixo: 'cc', nomeUnico: false },
};
const RH_CSV_CABECALHO = ['Categoria', 'Codigo', 'Descricao'];

const RH = {
  chave: s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim(),
  /** Texto do CSV → tabela ('cargos' | 'centros') ou null. */
  tabelaDaCategoria(txt) {
    const k = this.chave(txt).replace(/S$/, '');
    if (['CARGO', 'FUNCAO', 'CARGO/FUNCAO'].includes(k)) return 'cargos';
    if (['CENTRO DE CUSTO', 'CENTRO DE CUSTOS', 'CENTRO', 'CC', 'CENTRO CUSTO'].includes(k) || k.startsWith('CENTRO DE CUST')) return 'centros';
    return null;
  },
  lista(tipo, { inativos = false } = {}) {
    return Repo.todos(RH_TABELAS[tipo].col).filter(x => inativos || x.status !== 'inativo')
      .sort((a, b) => (a.codigo || '').localeCompare(b.codigo || '', 'pt-BR', { numeric: true }) || a.nome.localeCompare(b.nome, 'pt-BR'));
  },
  ativos(tipo) { return this.lista(tipo); },
  get(tipo, id) { return id ? Repo.get(RH_TABELAS[tipo].col, id) : null; },
  rotulo(x) { return x ? (x.codigo ? `${x.codigo} – ${x.nome}` : x.nome) : ''; },
  /** Registro equivalente: mesmo código; ou mesma descrição (Cargos: sempre; Centros: só entre itens sem código). */
  encontrar(tipo, { codigo, nome }, ignorarId = null) {
    const t = RH_TABELAS[tipo], todos = Repo.todos(t.col).filter(x => x.id !== ignorarId);
    const kc = this.chave(codigo), kn = this.chave(nome);
    const porCodigo = kc && todos.find(x => this.chave(x.codigo) === kc);
    if (porCodigo) return porCodigo;
    if (!kn || (kc && !t.nomeUnico)) return null;
    return todos.find(x => this.chave(x.nome) === kn && (t.nomeUnico || !this.chave(x.codigo))) || null;
  },
  /** Quantos colaboradores (e metas de promoção do PDI) usam o item. */
  emUso(tipo, id) {
    const campo = tipo === 'cargos' ? 'cargoId' : 'centroCustoId';
    let n = Repo.todos('funcionarios').filter(f => f[campo] === id && (f.status || 'Ativo') !== 'Desligado').length;
    if (tipo === 'cargos') n += Repo.todos('pdi').reduce((a, p) => a + (p.avaliacoes || []).filter(av => av.cargoAlvoId === id).length, 0);
    return n;
  },

  /** Cria ou edita um item, validando duplicidade. Retorna o registro salvo. */
  async salvar(tipo, id, { codigo = '', nome, status = 'ativo' }) {
    const t = RH_TABELAS[tipo]; nome = String(nome || '').trim(); codigo = String(codigo || '').trim();
    if (!nome) throw new Error('Informe a descrição.');
    const dup = this.encontrar(tipo, { codigo, nome }, id);
    if (dup) throw new Error(`Já existe ${t.singular} com ${codigo && this.chave(dup.codigo) === this.chave(codigo) ? 'o código ' + codigo : 'essa descrição'}: ${this.rotulo(dup)}${dup.status === 'inativo' ? ' (inativo — reative-o em vez de criar outro)' : ''}.`);
    const rid = id || `${t.prefixo}-${uid()}`, antes = id ? this.get(tipo, id) : {};
    await Repo.salvar(t.col, rid, { ...antes, codigo, nome, status }, { modulo: 'pessoal', rotulo: `${t.rotulo}: ${this.rotulo({ codigo, nome })}` });
    return { id: rid, codigo, nome, status };
  },
  /** Soft delete / reativação. */
  async alterarStatus(tipo, id, status) {
    const t = RH_TABELAS[tipo], x = this.get(tipo, id);
    await Repo.salvar(t.col, id, { ...x, status }, { modulo: 'pessoal', rotulo: `${t.rotulo}: ${this.rotulo(x)}`, detalhe: status === 'inativo' ? 'Inativado' : 'Reativado' });
  },

  /** CSV modelo com o cabeçalho exato e duas linhas de exemplo. */
  modeloCSV() {
    return CSV.gerar([RH_CSV_CABECALHO, ['Cargo', 'VEN01', 'Vendedor(a)'], ['Centro de Custo', '2.05.014', '014 - SHOPPING TACARUNA I']]);
  },
  /**
   * Valida e prepara as linhas lidas do CSV (sem gravar). Regras:
   *  - categoria desconhecida ou descrição vazia → erro da linha;
   *  - repetida dentro do próprio arquivo → ignorada;
   *  - já existe (mesmo código; sem código, mesma descrição) → ignorada; se estiver inativa, é reativada;
   *  - mesmo código com descrição diferente → descrição atualizada.
   */
  analisarImportacao(linhas) {
    const plano = [], erros = [], vistos = new Set();
    linhas.forEach((l, i) => {
      const n = i + 2, tipo = this.tabelaDaCategoria(l.Categoria), codigo = String(l.Codigo ?? '').trim(), nome = String(l.Descricao ?? '').trim();
      if (!tipo) return erros.push(`Linha ${n}: categoria “${l.Categoria ?? ''}” inválida (use Cargo ou Centro de Custo).`);
      if (!nome) return erros.push(`Linha ${n}: descrição vazia.`);
      const chaves = [codigo && tipo + '|c:' + this.chave(codigo), (!codigo || RH_TABELAS[tipo].nomeUnico) && tipo + '|n:' + this.chave(nome)].filter(Boolean);
      if (chaves.some(k => vistos.has(k))) return plano.push({ n, tipo, codigo, nome, acao: 'repetida' });
      chaves.forEach(k => vistos.add(k));
      const ex = this.encontrar(tipo, { codigo, nome });
      if (!ex) return plano.push({ n, tipo, codigo, nome, acao: 'criar' });
      if (codigo && this.chave(ex.codigo) === this.chave(codigo) && this.chave(ex.nome) !== this.chave(nome)) {
        const outro = RH_TABELAS[tipo].nomeUnico && this.encontrar(tipo, { nome }, ex.id);
        if (outro) return erros.push(`Linha ${n}: a descrição “${nome}” já pertence a ${this.rotulo(outro)}.`);
        return plano.push({ n, tipo, codigo, nome, acao: 'atualizar', id: ex.id });
      }
      plano.push({ n, tipo, codigo, nome, acao: ex.status === 'inativo' ? 'reativar' : 'existente', id: ex.id });
    });
    return { plano, erros };
  },
  /** Grava o plano: um log de auditoria resumido para a importação inteira. */
  async importar(plano, nomeArquivo) {
    const r = { criar: 0, atualizar: 0, reativar: 0 }, mudancas = [];
    Sync.ocupado(true);
    try {
      for (const p of plano.filter(x => ['criar', 'atualizar', 'reativar'].includes(x.acao))) {
        const t = RH_TABELAS[p.tipo], id = p.id || `${t.prefixo}-${uid()}`, antes = p.id ? this.get(p.tipo, p.id) : {};
        const doc = p.acao === 'reativar' ? { ...antes, status: 'ativo' } : { ...antes, codigo: p.codigo || antes.codigo || '', nome: p.nome, status: 'ativo' };
        await Repo.salvar(t.col, id, doc, { modulo: 'pessoal', semAudit: true });
        r[p.acao]++; mudancas.push({ campo: `${t.categoriaCSV} ${p.acao === 'criar' ? 'criado' : p.acao === 'atualizar' ? 'atualizado' : 'reativado'}`, de: antes.nome || '', para: this.rotulo(doc) });
        await sleep(40);
      }
    } finally { Sync.ocupado(false); }
    await Audit.registrar({ modulo: 'pessoal', acao: 'importou', entidade: 'rh', entidadeId: nomeArquivo, rotulo: 'Parametrizações de RH · ' + nomeArquivo, detalhe: `${r.criar} criados, ${r.atualizar} atualizados, ${r.reativar} reativados`, mudancas: mudancas.slice(0, 60) });
    return r;
  },
};

const Pessoal = {

  colecoes() { const c = ['funcionarios', 'pdi', 'lojas', 'config', 'rh_cargos', 'rh_centros']; if (Auth.can('pessoal.salario.ver')) c.push('salarios'); return c; },

  /* ---------------- helpers de dados ---------------- */
  /** Loja de lotação e/ou centro de custo (setor = campo legado, anterior às tabelas de domínio). */
  lotacaoNome(f) {
    const partes = [];
    if (f.lotacao && f.lotacao.startsWith('loja-')) { const l = Repo.get('lojas', f.lotacao); partes.push(l ? `${l.codigo} · ${l.nome}` : f.lotacao); }

    if (cc) partes.push('CC ' + (cc.codigo || cc.nome)); else if (f.centroCusto) partes.push(f.centroCusto); else if (f.setor) partes.push(f.setor);

  cargoNome(f) { const c = RH.get('cargos', f.cargoId); return c ? c.nome : (f.cargo || ''); },
  /** Opções do filtro de lotação: lojas + centros de custo ativos. */
  opcoesLotacao() {
    const lojas = Repo.todos('lojas').sort((a, b) => a.codigo.localeCompare(b.codigo)).map(l => ['loja-' + l.codigo, `Loja ${l.codigo} · ${l.nome}`]);
    return [['', 'Selecione…'], ...lojas, ...RH.ativos('centros').map(c => ['cc:' + c.id, 'CC ' + RH.rotulo(c)])];
  },
  /** <option>s de uma tabela de domínio: só ativos + o valor atual (mesmo inativo, para não perdê-lo). */
  opcoesDominio(tipo, atualId, textoLegado) {
    const ativos = RH.ativos(tipo), atual = RH.get(tipo, atualId);
    const lista = atual && atual.status === 'inativo' ? [...ativos, atual] : ativos;
    const vazio = ativos.length ? 'Selecione…' : `Nenhum ${RH_TABELAS[tipo].singular} ativo cadastrado`;
    return `<option value="">${vazio}</option>` + lista.map(x => `<option value="${x.id}" ${x.id === atualId ? 'selected' : ''}>${esc(RH.rotulo(x))}${x.status === 'inativo' ? ' (inativo)' : ''}</option>`).join('')
      + (!atual && textoLegado ? `<option value="txt:${esc(textoLegado)}" selected>${esc(textoLegado)} (não cadastrado)</option>` : '');
  },
  /** Situação de férias pela CLT (período aquisitivo de 12 meses + concessivo de 12 meses). */
  ferias(f) {
    const a = Datas.de(f.admissao); if (!a) return { txt: 'Sem admissão', cls: 'neutral' };
    const hoje = Datas.hoje(); const completos = Math.floor(Datas.mesesEntre(a, hoje) / 12);
    const gozados = Number(f.ferias?.periodosGozados || 0); const pend = Math.max(0, completos - gozados);
    const prog = f.ferias?.programadaInicio && Datas.de(f.ferias.programadaInicio) >= hoje ? ` · programadas ${Fmt.data(f.ferias.programadaInicio)}` : '';
    if (pend === 0) { const prox = Datas.addAnos(a, completos + 1); return { txt: `Adquire em ${Fmt.data(Datas.iso(prox))}`, cls: 'neutral', prog }; }
    const limite = new Date(Datas.addAnos(a, gozados + 2).getTime() - 864e5); const d = Datas.dias(hoje, limite);
    if (d < 0) return { txt: `Vencidas há ${-d} dias`, cls: 'bad', det: 'Pagamento em dobro (CLT art. 137)', prog, limite };
    if (d <= 60) return { txt: `Vencem em ${d} dias`, cls: 'warn', det: 'Limite ' + Fmt.data(Datas.iso(limite)), prog, limite };
    return { txt: `${pend} período${pend > 1 ? 's' : ''} a gozar`, cls: 'ok', det: 'Limite ' + Fmt.data(Datas.iso(limite)), prog, limite };

        <td><span class="pill ${fe.cls}">${esc(fe.txt)}</span>${fe.prog ? `<div class="cell-sub">${esc(fe.prog.slice(3))}</div>` : ''}</td>
        ${salCell}
        <td><span class="pill ${({ Ativo: 'ok', Férias: 'info', Afastado: 'warn', Desligado: 'neutral' })[f.status || 'Ativo']}">${esc(f.status || 'Ativo')}</span></td>

    return `

          <thead><tr><th>Colaborador</th><th>Cargo · lotação</th><th>Admissão</th><th>Escala · folgas</th><th class="num">Banco de horas</th><th>Férias</th>
          ${podeSal ? `<th class="num"><span class="row" style="justify-content:flex-end;gap:4px">Salário · líquido · custo <button class="iconbtn" data-a="sal-todos" aria-label="${this.ui.verSalarios ? 'Ocultar' : 'Exibir'} todos os salários">${this.ui.verSalarios ? ICON.olhoFechado : ICON.olho}</button></span></th>` : ''}

  /* ---------------- formulário de colaborador ---------------- */
  abrirForm(id) {
    const f = id ? Repo.get('funcionarios', id) : { status: 'Ativo', escala: '6x1', folgas: [], ferias: { periodosGozados: 0 }, bancoHoras: 0 };
    const sal = id ? Repo.get('salarios', id) : null;
    const podeEd = Auth.can('pessoal.editar'), podeSalEd = Auth.can('pessoal.salario.editar');
    const lotVal = f.lotacao || (f.setor ? 'setor:' + f.setor : '');
    const dis = podeEd ? '' : 'disabled';
    const corpo = `<form class="form-grid" onsubmit="return false">
      ${campo('Nome completo', 'nome', f.nome, { attrs: dis + ' required' })}
      ${campo('Matrícula', 'matricula', f.matricula, { attrs: dis })}
      ${campo('CPF', 'cpf', CPF.formatar(f.cpf), { attrs: dis + ' inputmode="numeric" placeholder="000.000.000-00" data-cpf', dica: 'É o login do painel (e a senha inicial) quando o Master ativa o acesso.' })}
      <div class="field"><label class="lbl" for="f_cargoId">Cargo</label><select id="f_cargoId" name="cargoId" ${dis}>${this.opcoesDominio('cargos', f.cargoId, f.cargo)}</select></div>
      <div class="field"><label class="lbl" for="f_centro">Centro de custo</label><select id="f_centro" name="centroCustoId" ${dis}>${this.opcoesDominio('centros', f.centroCustoId, f.centroCusto || f.setor)}</select></div>
      ${campo('Loja de lotação (opcional)', 'lotacaoSel', lotVal.startsWith('loja-') ? lotVal : '', { opcoes: [['', 'Sem loja (escritório / CD)'], ...Repo.todos('lojas').filter(l => l.ativa || 'loja-' + l.codigo === lotVal).sort((a, b) => a.codigo.localeCompare(b.codigo)).map(l => ['loja-' + l.codigo, `Loja ${l.codigo} · ${l.nome}`])], attrs: dis })}
      ${!RH.ativos('cargos').length || !RH.ativos('centros').length ? `<p class="hint full" style="margin:-4px 0 0">${Auth.can('pessoal.parametros') ? 'Cadastre cargos e centros de custo em <b>Parametrizações de RH</b>.' : 'Peça ao GESTOR para cadastrar cargos e centros de custo.'}</p>` : ''}
      ${campo('Data de admissão', 'admissao', f.admissao, { tipo: 'date', attrs: dis })}
      ${campo('Situação', 'status', f.status, { opcoes: STATUS_FUNC, attrs: dis })}
      ${campo('Escala', 'escala', f.escala, { opcoes: ESCALAS, attrs: dis })}
      <div class="field"><span class="lbl">Folgas fixas</span><div class="row" style="gap:10px;padding-top:6px">${DIAS_SEMANA.map(d => `<label class="check"><input type="checkbox" name="folgas" data-lista="1" value="${d}" ${(f.folgas || []).includes(d) ? 'checked' : ''} ${dis}>${d}</label>`).join('')}</div></div>
      ${campo('Observação de folgas', 'folgaObs', f.folgaObs, { attrs: dis, dica: 'Ex.: folga rotativa no domingo, 1 domingo por mês.' })}
      ${campo('Banco de horas (saldo em horas)', 'bancoHoras', f.bancoHoras, { tipo: 'number', attrs: dis, dica: 'Use negativo para débito. Ex.: 12.5 = 12h30; −3 = 3h devidas.' })}
      ${campo('Períodos de férias já gozados', 'ferias.periodosGozados', f.ferias?.periodosGozados ?? 0, { tipo: 'number', attrs: dis + ' min="0"', dica: 'Quantos períodos aquisitivos já foram gozados desde a admissão.' })}
      <div class="field"><span class="lbl">Férias programadas</span><div class="row" style="flex-wrap:nowrap"><input type="date" name="ferias.programadaInicio" value="${esc(f.ferias?.programadaInicio || '')}" aria-label="Início das férias" ${dis}><input type="date" name="ferias.programadaFim" value="${esc(f.ferias?.programadaFim || '')}" aria-label="Fim das férias" ${dis}></div></div>
      ${podeSalEd ? campo('Salário atual (R$)', '_salario', sal?.valor, { tipo: 'number', dica: 'Visível apenas para GESTOR. Alterações ficam no histórico e no log.' }) : ''}
      ${campo('Dependentes para IRRF', 'dependentesIR', f.dependentesIR ?? 0, { tipo: 'number', attrs: dis + ' min="0"' })}
      ${Auth.can('pessoal.salario.ver') ? `<div class="field full"><span class="lbl">Folha líquida e custo real</span><div id="folhaComp">${Folha.composicaoHTML(sal?.valor ? Folha.calcular(sal.valor, { dependentes: f.dependentesIR }) : null)}</div></div>` : ''}
      ${campo('E-mail', 'email', f.email, { tipo: 'email', attrs: dis })}
      ${campo('Telefone', 'telefone', f.telefone, { attrs: dis })}
    </form>
    ${sal?.historico?.length && Auth.can('pessoal.salario.ver') ? `<details class="log" style="margin-top:14px"><summary>Histórico salarial (${sal.historico.length})</summary><table style="margin-top:8px"><tbody>${sal.historico.slice().reverse().map(h => `<tr><td class="mono">${Fmt.data(h.desde)}</td><td class="num">${Fmt.brl(h.valor)}</td></tr>`).join('')}</tbody></table></details>` : ''}`;
    const acoes = [{ rotulo: 'Cancelar', classe: 'sec' }];
    if (id && Auth.can('pessoal.excluir')) acoes.unshift({ rotulo: 'Excluir', classe: 'danger', acao: async () => { if (!(await UI.confirmar('Excluir colaborador', `Excluir <b>${esc(f.nome)}</b>? O registro sai do painel, mas fica no log de auditoria.`, 'Excluir', true))) return false; await Repo.excluir('funcionarios', id, { modulo: 'pessoal', rotulo: f.nome }); if (Repo.get('salarios', id)) await Repo.excluir('salarios', id, { modulo: 'pessoal', rotulo: f.nome + ' (salário)' }); UI.toast('Colaborador excluído'); } });
    if (podeEd || podeSalEd) acoes.push({ rotulo: 'Salvar', acao: async m => this.salvarForm(m, id, f, sal) });
    if (id) acoes.splice(acoes.length - 1, 0, { rotulo: 'Ver PDI', classe: 'sec', acao: () => { this.ui.aba = 'pdi'; this.ui.pdiSel = id; App.render(); } });

      aoAbrir: m => {
        // ao escolher a loja, sugere o centro de custo da loja (ex.: "2.05.014 – 014 - SHOPPING TACARUNA I")
        $('[name="lotacaoSel"]', m)?.addEventListener('change', e => {
          const cc = $('[name="centroCustoId"]', m); if (!cc || cc.value) return;
          const l = Repo.get('lojas', e.target.value); if (!l) return;
          const alvo = RH.ativos('centros').find(c => new RegExp('^0*' + Number(l.codigo) + '\\s*-').test(c.nome.trim()) || c.nome.startsWith(l.codigo + ' -'));
          if (alvo) { cc.value = alvo.id; UI.toast('Centro de custo sugerido: ' + RH.rotulo(alvo)); }
        });
        m.addEventListener('input', e => {
        if (!['_salario', 'dependentesIR'].includes(e.target.name)) return;
        const alvo = $('#folhaComp', m); if (!alvo) return;
        const v = Number($('[name="_salario"]', m)?.value || sal?.valor || 0);
        alvo.innerHTML = Folha.composicaoHTML(v ? Folha.calcular(v, { dependentes: Number($('[name="dependentesIR"]', m).value) || 0 }) : null);
        });
      },
    });
  },
  async salvarForm(m, id, antes, salAntes) {
    const d = UI.lerForm(m);
    if (!d.nome) { UI.toast('Informe o nome.'); return false; }
    d.cpf = CPF.limpar(d.cpf);
    if (d.cpf && !CPF.valido(d.cpf)) { UI.toast('CPF inválido: confira os dígitos.'); return false; }
    if (d.cpf && Repo.todos('funcionarios').some(x => x.id !== id && CPF.limpar(x.cpf) === d.cpf)) { UI.toast('Já existe outro colaborador com este CPF.'); return false; }
    const sel = d.lotacaoSel || ''; delete d.lotacaoSel;
    d.lotacao = sel.startsWith('loja-') ? sel : '';
    // cargo e centro de custo: id da tabela de domínio + nome copiado (compatibilidade com telas/relatórios antigos)
    if (!d.cargoId) { UI.toast('Selecione o cargo.'); return false; }
    if (d.cargoId.startsWith('txt:')) { d.cargo = d.cargoId.slice(4); d.cargoId = ''; } else d.cargo = RH.get('cargos', d.cargoId)?.nome || '';
    if (d.centroCustoId?.startsWith('txt:')) { d.centroCusto = d.centroCustoId.slice(4); d.centroCustoId = ''; } else d.centroCusto = RH.rotulo(RH.get('centros', d.centroCustoId));
    if (d.centroCustoId || d.centroCusto) d.setor = '';
    const salario = d._salario; delete d._salario;
    const novoId = id || 'func-' + uid();
    if (Auth.can('pessoal.editar')) {
      const dados = mergeProfundo(id ? antes : {}, d); dados.folgas = d.folgas || []; delete dados.exemplo; if (antes?.exemplo) dados.exemplo = true;
      await Repo.salvar('funcionarios', novoId, dados, { modulo: 'pessoal', rotulo: d.nome });
    }
    if (Auth.can('pessoal.salario.editar') && salario != null && salario !== salAntes?.valor) {
      const hist = [...(salAntes?.historico || []), { valor: salario, desde: Datas.hojeISO(), registradoPor: Auth.id }];
      await Repo.salvar('salarios', novoId, { valor: salario, desde: Datas.hojeISO(), historico: hist }, { modulo: 'pessoal', rotulo: d.nome + ' (salário)' });
    }
    UI.toast('Colaborador salvo');
  },

  async baixarModeloRH() {
    // BOM UTF-8 para o Excel abrir os acentos corretamente; o cabeçalho continua exatamente Categoria,Codigo,Descricao
    await Documento.baixarArquivo('modelo_parametrizacoes_rh.csv', new Blob(['\uFEFF' + RH.modeloCSV()], { type: 'text/csv' }));
  },
  async importarCSVRH(file) {
    const { cabecalho, linhas } = CSV.ler(CSV.decodificar(await file.arrayBuffer()));
    // aceita "Código"/"Descrição" com acento, mas exige as três colunas
    const mapa = {}; cabecalho.forEach(h => { const k = RH.chave(h); if (k === 'CATEGORIA') mapa[h] = 'Categoria'; if (k === 'CODIGO') mapa[h] = 'Codigo'; if (k === 'DESCRICAO') mapa[h] = 'Descricao'; });
    if (Object.values(mapa).length < 3) throw new Error('Cabeçalho inválido. Use exatamente: ' + RH_CSV_CABECALHO.join(','));
    const norm = linhas.map(l => Object.fromEntries(Object.entries(l).filter(([k]) => mapa[k]).map(([k, v]) => [mapa[k], v])));
    const { plano, erros } = RH.analisarImportacao(norm);
    const cont = a => plano.filter(p => p.acao === a).length, gravar = cont('criar') + cont('atualizar') + cont('reativar');
    const resumo = `<b>${norm.length}</b> linha(s) lidas de ${esc(file.name)}.<br>
      Novos: <b>${cont('criar')}</b> · descrição atualizada: <b>${cont('atualizar')}</b> · reativados: <b>${cont('reativar')}</b><br>
      Ignorados por já existirem: ${cont('existente')} · repetidos no arquivo: ${cont('repetida')}
      ${erros.length ? `<div class="note warn" style="margin-top:10px"><b>${erros.length} linha(s) com erro (não serão importadas):</b><br>${erros.slice(0, 8).map(esc).join('<br>')}${erros.length > 8 ? '<br>…' : ''}</div>` : ''}`;
    if (!gravar) return UI.modal({ titulo: 'Importar CSV', corpo: resumo + '<p>Nada novo para gravar.</p>' });
    if (!(await UI.confirmar('Importar parametrizações de RH', resumo, `Importar ${gravar}`))) return;
    const r = await RH.importar(plano, file.name);
    UI.toast(`Importação concluída: ${r.criar} novo(s), ${r.atualizar} atualizado(s), ${r.reativar} reativado(s).`);
  },

  /* ---------------- PDI: lista (somente pontuação atual) ---------------- */

    const lista = this.filtrados();
    const linhas = lista.map(f => {
      const { atual, anterior } = this.ultimas(this.pdiDe(f.id));
      const m = this.media(atual?.notas), mAnt = this.media(anterior?.notas);

    }).join('');
