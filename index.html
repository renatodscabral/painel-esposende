        $('#ftCx', m).addEventListener('change', e => { $('#ftCxTxtBox', m).hidden = e.target.value !== 'txt'; });
      },
      acoes: [{ rotulo: 'Cancelar', classe: 'sec' }, { rotulo: it ? 'Salvar' : 'Lançar', acao: async m => {
        const d = UI.lerForm(m);
        if (!d.data || !d.lojaId || !(d.valor > 0)) { UI.toast('Informe data, loja e valor.'); return false; }
        let caixa = null;
        if (d._cx === 'txt') { if (!d._cxNome) { UI.toast('Digite o nome do caixa.'); return false; } caixa = { tipo: 'txt', id: '', nome: d._cxNome, matricula: '' }; }
        else if (d._cx) { const c = this.caixasDaLoja(d.lojaId).find(x => x.tipo + ':' + x.id === d._cx); caixa = { tipo: c.tipo, id: c.id, nome: c.nome, matricula: c.matricula }; }
        else { UI.toast('Selecione o caixa responsável.'); return false; }
        const item = { id: it?.id || 'f-' + uid(), data: d.data, tipo: d.tipo, valor: this.r2(d.valor), caixa, justificativa: d.justificativa, status: d.status || it?.status || 'Em análise', origem: it?.origem || pre.origem || 'manual', lancadoPor: it?.lancadoPor || Auth.id, lancadoEm: it?.lancadoEm || new Date().toISOString() };
        if (it && (docId !== d.data.slice(0, 7) + '_' + d.lojaId)) await this.removerItem(docId, it.id, true); // mudou de mês/loja
        await this.gravarItens(d.lojaId, [item]);
        UI.toast(it ? 'Lançamento atualizado' : `${d.tipo} de ${Fmt.brl(d.valor)} lançada`);
      } }],
    });
  },
  /** Grava itens agrupando por documento mês_loja (substitui itens com o mesmo id). */
  async gravarItens(lojaId, itens, detalhe = '') {
    const grupos = {}; itens.forEach(i => (grupos[i.data.slice(0, 7) + '_' + lojaId] ||= []).push(i));
    for (const [docId, novos] of Object.entries(grupos)) {
      const atual = Repo.get('faltas', docId), mapa = new Map((atual?.itens || []).map(i => [i.id, i]));
      novos.forEach(i => mapa.set(i.id, i));
      await Repo.salvar('faltas', docId, { mes: docId.slice(0, 7), lojaId, itens: [...mapa.values()] }, { modulo: 'retaguarda', rotulo: `Faltas ${this.mesLabel(docId.slice(0, 7))} · ${this.nomeLoja(lojaId)}`, detalhe });
    }
  },
  async removerItem(docId, id, silencioso = false) {
    const doc = Repo.get('faltas', docId), it = doc.itens.find(i => i.id === id);
    if (!silencioso && !(await UI.confirmar('Excluir lançamento', `Excluir ${esc(it.tipo || 'falta')} de <b>${Fmt.brl(it.valor)}</b> (${esc(it.caixa?.nome || '')}, ${Fmt.data(it.data)})? A exclusão fica no log.`, 'Excluir', true))) return;
    await Repo.salvar('faltas', docId, { ...doc, itens: doc.itens.filter(i => i.id !== id) }, { modulo: 'retaguarda', rotulo: `Faltas · ${this.nomeLoja(doc.lojaId)}`, detalhe: 'Lançamento excluído' });
  },

  /** Upload em lote: DATA, LOJA, CAIXA, MATRICULA (opcional), VALOR, JUSTIFICATIVA, TIPO (opcional). */
  async importarFaltas(file) {
    const r = await this.lerPlanilha(file, {
      data: ['DATA'], loja: ['LOJA', 'FILIAL'], caixa: ['CAIXA', 'OPERADOR', 'FUNCIONARIO', 'COLABORADOR', 'NOME'],
      matricula: ['MATRICULA', 'MAT'], valor: ['VALOR'], justificativa: ['JUSTIFICATIVA', 'MOTIVO', 'OBS'], tipo: ['TIPO'], status: ['SITUACAO', 'STATUS'],
    });
    const ok = [], erros = []; let vinculados = 0;
    r.linhas.forEach((x, n) => {
      const data = this.dataISO(x.data), valor = this.num(x.valor), lj = this.loja(x.loja);
      if (!data || !(valor > 0) || !lj.lojaId) { erros.push(`Linha ${n + 2}: ${!lj.lojaId ? 'loja não encontrada (' + (x.loja ?? '') + ')' : !data ? 'data inválida' : 'valor inválido'}`); return; }
      const nome = String(x.caixa ?? '').trim(), mat = String(x.matricula ?? '').trim();
      const cx = this.caixasDaLoja(lj.lojaId).concat(Repo.todos('funcionarios').map(f => ({ tipo: 'func', id: f.id, nome: f.nome, matricula: f.matricula || '' })))
        .find(c => (mat && c.matricula && String(c.matricula) === mat) || (nome && this.norm(c.nome) === this.norm(nome)));
      if (cx) vinculados++;
      const tipo = this.norm(x.tipo) === 'SOBRA' ? 'Sobra' : 'Falta';
      const st = RETAGUARDA_CFG.statusFalta.find(s => this.norm(s) === this.norm(x.status)) || 'Em análise';
      ok.push({ lojaId: lj.lojaId, item: { id: 'f-' + uid(), data, tipo, valor: this.r2(valor), caixa: cx ? { tipo: cx.tipo, id: cx.id, nome: cx.nome, matricula: cx.matricula } : { tipo: 'txt', id: '', nome: nome || '(sem nome)', matricula: mat }, justificativa: String(x.justificativa ?? '').trim(), status: st, origem: 'lote: ' + file.name, lancadoPor: Auth.id, lancadoEm: new Date().toISOString() } });
    });
    return { ok, erros, vinculados, nome: file.name };
  },
  async baixarModeloFaltas() {
    const XLSX = await Libs.xlsx();
    const ws = XLSX.utils.aoa_to_sheet([['DATA', 'LOJA', 'CAIXA', 'MATRICULA', 'VALOR', 'JUSTIFICATIVA', 'TIPO'], ['01/09/2026', '14 - SHOP TACARUNA I', 'NOME DO CAIXA', '1234', 25.5, 'Troco errado no fechamento', 'Falta']]);
    ws['!cols'] = [{ wch: 12 }, { wch: 26 }, { wch: 28 }, { wch: 12 }, { wch: 10 }, { wch: 40 }, { wch: 8 }];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Faltas');
    await Documento.baixarArquivo('modelo_faltas_de_caixa.xlsx', new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })]));
  },
  abrirLote() {
    UI.modal({
      titulo: 'Upload em lote de faltas',
      corpo: `<p style="margin-top:0">Envie uma planilha com as colunas <b>DATA, LOJA, CAIXA, VALOR, JUSTIFICATIVA</b> (opcionais: MATRICULA, TIPO = Falta/Sobra, SITUACAO). A loja é reconhecida pelo número (ex.: “14 - TACARUNA”); o caixa é vinculado pela matrícula ou pelo nome.</p>
        <div class="row"><label class="btn" style="cursor:pointer">Escolher planilha<input type="file" accept=".xlsx,.xls,.csv" hidden id="ftLoteFile"></label><button class="btn ghost" type="button" id="ftModelo">Baixar modelo</button></div>
        <div id="ftLotePrev" style="margin-top:14px"></div>`,
      aoAbrir: m => {
        $('#ftModelo', m).addEventListener('click', () => this.baixarModeloFaltas());
        $('#ftLoteFile', m).addEventListener('change', async e => {
          const box = $('#ftLotePrev', m); box.innerHTML = '<p class="hint">Lendo…</p>';
          try {
            const imp = await this.importarFaltas(e.target.files[0]); this._lote = imp;
            const tot = imp.ok.reduce((a, x) => a + x.item.valor, 0);
            box.innerHTML = `<div class="note">${imp.ok.length} lançamento(s) prontos · ${Fmt.brl(tot)} · ${imp.vinculados} caixa(s) vinculados ao cadastro${imp.ok.length - imp.vinculados ? `, ${imp.ok.length - imp.vinculados} ficarão como “não vinculado”` : ''}.</div>
              ${imp.erros.length ? `<div class="note warn" style="margin-top:8px"><b>${imp.erros.length} linha(s) ignoradas:</b><br>${imp.erros.slice(0, 8).map(esc).join('<br>')}${imp.erros.length > 8 ? '<br>…' : ''}</div>` : ''}`;
          } catch (err) { box.innerHTML = `<div class="note warn">${esc(err.message)}</div>`; }
        });
      },
      acoes: [{ rotulo: 'Cancelar', classe: 'sec' }, { rotulo: 'Importar lançamentos', acao: async () => {
        const imp = this._lote; if (!imp?.ok.length) { UI.toast('Escolha uma planilha válida.'); return false; }
        const porLoja = {}; imp.ok.forEach(x => (porLoja[x.lojaId] ||= []).push(x.item));
        for (const [lj, itens] of Object.entries(porLoja)) { await this.gravarItens(lj, itens, `Lote ${imp.nome}`); await sleep(60); }
        this._lote = null; UI.toast(`${imp.ok.length} lançamento(s) importados`);
      } }],
    });
  },

  /** Base rápida de caixas (operadores que não estão no Módulo 1). */
  abrirCaixas() {
    const lojas = Repo.todos('lojas').filter(l => l.ativa).sort((a, b) => a.codigo.localeCompare(b.codigo));
    const lista = () => {
      const docs = Repo.todos('caixas').filter(d => d.operadores?.length);
      const total = docs.reduce((a, d) => a + d.operadores.length, 0);
      return total ? `<div class="tbl-wrap" style="max-height:320px;overflow:auto"><table><thead><tr><th>Loja</th><th>Operador</th><th>Matrícula</th><th></th></tr></thead><tbody>
        ${docs.flatMap(d => d.operadores.map(o => `<tr><td>${esc(this.nomeLoja(d.id))}</td><td>${esc(o.nome)}</td><td class="mono">${esc(o.matricula || '—')}</td><td><button class="iconbtn" data-cx-del="${d.id}|${o.id}" aria-label="Remover">${ICON.lixo}</button></td></tr>`)).join('')}</tbody></table></div><p class="hint">${total} operador(es) na base rápida.</p>`
        : '<div class="empty" style="padding:18px">Nenhum operador na base rápida. Colaboradores do Módulo 1 lotados na loja já aparecem automaticamente.</div>';
    };
    UI.modal({
      titulo: 'Base de caixas', largo: true,
      corpo: `<p style="margin-top:0">A falta pode ser vinculada a <b>colaboradores do Módulo 1</b> (lotados na loja) ou a operadores desta base rápida.</p>
        <div class="form-grid">${campo('Loja', 'lojaId', '', { opcoes: [['', 'Selecione…'], ...lojas.map(l => [l.id, `${l.codigo} · ${l.nome}`])] })}${campo('Nome do operador', 'nome', '')}${campo('Matrícula', 'matricula', '')}
          <div class="field"><span class="lbl">&nbsp;</span><button type="button" class="btn sec" id="cxAdd">Adicionar</button></div></div>
        <div class="row" style="margin:12px 0"><label class="btn ghost" style="cursor:pointer">Upload rápido (.xlsx: LOJA, NOME, MATRICULA)<input type="file" hidden accept=".xlsx,.xls,.csv" id="cxFile"></label></div>
        <div id="cxLista">${lista()}</div>`,
      aoAbrir: m => {
        const refresh = () => { $('#cxLista', m).innerHTML = lista(); };
        const add = async (lojaId, ops) => {
          const doc = Repo.get('caixas', lojaId) || { lojaId, operadores: [] };
          const atuais = doc.operadores.slice();
          ops.forEach(o => { if (!atuais.some(a => this.norm(a.nome) === this.norm(o.nome))) atuais.push({ id: 'op-' + uid(), ativo: true, ...o }); });
          await Repo.salvar('caixas', lojaId, { lojaId, operadores: atuais }, { modulo: 'retaguarda', rotulo: 'Base de caixas · ' + this.nomeLoja(lojaId) });
        };
        $('#cxAdd', m).addEventListener('click', async () => { const d = UI.lerForm(m); if (!d.lojaId || !d.nome) return UI.toast('Informe loja e nome.'); await add(d.lojaId, [{ nome: d.nome.toUpperCase(), matricula: d.matricula }]); $('[name="nome"]', m).value = ''; $('[name="matricula"]', m).value = ''; refresh(); });
        $('#cxFile', m).addEventListener('change', async e => {
          try {
            const r = await this.lerPlanilha(e.target.files[0], { loja: ['LOJA', 'FILIAL'], nome: ['NOME', 'CAIXA', 'OPERADOR'], matricula: ['MATRICULA', 'MAT'] });
            const porLoja = {}; let ign = 0;
            r.linhas.forEach(x => { const lj = this.loja(x.loja); if (!lj.lojaId || !x.nome) { ign++; return; } (porLoja[lj.lojaId] ||= []).push({ nome: String(x.nome).trim().toUpperCase(), matricula: String(x.matricula ?? '').trim() }); });
            for (const [lj, ops] of Object.entries(porLoja)) { await add(lj, ops); await sleep(60); }
            refresh(); UI.toast(`Base atualizada: ${Object.values(porLoja).flat().length} operador(es)${ign ? `, ${ign} linha(s) ignoradas` : ''}.`);
          } catch (err) { UI.toast(err.message); }
        });
        m.addEventListener('click', async e => {
          const b = e.target.closest('[data-cx-del]'); if (!b) return;
          const [lj, id] = b.dataset.cxDel.split('|'), doc = Repo.get('caixas', lj);
          await Repo.salvar('caixas', lj, { ...doc, operadores: doc.operadores.filter(o => o.id !== id) }, { modulo: 'retaguarda', rotulo: 'Base de caixas · ' + this.nomeLoja(lj) }); refresh();
        });
      },
      acoes: [{ rotulo: 'Fechar', classe: 'sec' }],
    });
  },

  /* 3. IEO: ver retaguarda-fin.js */

  /* ======================= eventos ======================= */
  async acao(a, el) {
    if (/^rt-adq/.test(a)) return this.acaoAdq(a, el);
    const cs = this.ui.cs, ft = this.ui.ft;
    switch (a) {
      case 'rt-aba': if (el.dataset.v) { this.ui.aba = el.dataset.v; App.render(); } return;
      case 'rt-cs-filtro': cs.filtro = el.dataset.v; cs.limite = 150; return App.render();
      case 'rt-cs-mais': cs.limite += 300; return App.render();
      case 'rt-cs-todas': cs.verTodasLojas = !cs.verTodasLojas; return App.render();
      case 'rt-cs-editar': return this.editarLinhaCS(el.dataset.doc, el.dataset.k);
      case 'rt-cs-falta': {
        const doc = Repo.get('credsystem', el.dataset.doc), l = doc.linhas.find(x => x.chave === el.dataset.k), s = this.statusLinha(l);
        return this.abrirFalta(null, null, { data: doc.id, lojaId: l.lojaId, tipo: s.dif > 0 ? 'Falta' : 'Sobra', valor: Math.abs(s.dif), justificativa: `Divergência na conciliação Credsystem de ${Fmt.data(doc.id)} (Websystem ${Fmt.brl(l.web)} × sistema ${Fmt.brl(s.interno)})`, origem: 'conciliação Credsystem' });
      }
      case 'rt-ft-nova': return this.abrirFalta(null, null, { lojaId: ft.loja || '' });
      case 'rt-ft-editar': return this.abrirFalta(el.dataset.doc, el.dataset.id);
      case 'rt-ft-del': return this.removerItem(el.dataset.doc, el.dataset.id);
      case 'rt-ft-lote': return this.abrirLote();
      case 'rt-ft-todos': ft.verTodos = !ft.verTodos; return App.render();
      case 'rt-caixas': return this.abrirCaixas();
      default: return this.acaoFin(a, el);
    }
  },
  async mudanca(a, el) {
    if (/^rt-adq/.test(a)) return this.mudancaAdq(a, el);
    if (/^rt-ieo/.test(a)) return this.mudancaFin(a, el);
    if (a === 'rt-cs') { this.ui.cs[el.dataset.k] = el.value; this.ui.cs.limite = 150; return App.render(); }
    if (a === 'rt-ft') { this.ui.ft[el.dataset.k] = el.value; return App.render(); }
    if (a === 'rt-ft-status') {
      const doc = Repo.get('faltas', el.dataset.doc);
      return Repo.salvar('faltas', doc.id, { ...doc, itens: doc.itens.map(i => i.id === el.dataset.id ? { ...i, status: el.value, statusPor: Auth.id, statusEm: new Date().toISOString() } : i) }, { modulo: 'retaguarda', rotulo: `Faltas · ${this.nomeLoja(doc.lojaId)}`, detalhe: 'Situação: ' + el.value });
    }
    if (a === 'rt-cs-upload') {
      const f = el.files[0]; el.value = ''; if (!f) return;
      try {
        UI.toast('Lendo ' + f.name + '…');
        const imp = await this.importarCS(f);
        const periodo = `${Fmt.data(imp.datas[0])} a ${Fmt.data(imp.datas.at(-1))}`;
        const existentes = imp.datas.filter(d => Repo.get('credsystem', d)).length;
        if (!(await UI.confirmar('Importar conciliação Credsystem', `<b>${imp.n}</b> linha(s) de ${esc(imp.nomeArquivo)} (aba ${esc(imp.aba)}), período ${periodo}, ${imp.datas.length} dia(s).${existentes ? `<br>${existentes} dia(s) já existem: valores do arquivo substituem os anteriores; lançamentos digitados no painel são mantidos quando o arquivo vier sem eles.` : ''}${imp.naoCad.length ? `<br><br><b>Lojas não encontradas no cadastro:</b> ${imp.naoCad.map(esc).join(', ')}` : ''}${imp.invalidas ? `<br>${imp.invalidas} linha(s) sem data/valor ignoradas.` : ''}`, 'Importar'))) return;
        const n = await this.aplicarCS(imp);
        this.ui.cs.mes = imp.datas.at(-1).slice(0, 7); UI.toast(`Conciliação importada: ${n} dia(s).`); App.render();
      } catch (e) { UI.toast('Falha na importação: ' + e.message); }
    }
  },
  entrada(a, el) {
    if (a === 'rt-adq-busca') { this.ui.adq.busca = el.value; this.ui.adq.pagina = 1; return this.montarAdq(); }
    if (a === 'rt-cs-busca') { this.ui.cs.busca = el.value; App.render(); }
    if (a === 'rt-ft-busca') { this.ui.ft.busca = el.value; App.render(); }
    return this.entradaFin(a, el);
  },
};

/* =====================================================================
   MÓDULO 4 — RETAGUARDA FINANCEIRA · telas novas (camada 7, UI)
   Estende o objeto Retaguarda (retaguarda.js) com a aba
     • IEO · Ranking — Índice de Eficiência Operacional, pódio, alertas, laudos e WhatsApp
   A lógica de negócio está em financeiro.js (IEO, Laudo). Conciliação bancária (OFX) e DFC
   foram para o Módulo 3 (fcx-dfc.js).
   ===================================================================== */
Object.assign(Retaguarda.ui, {
  ieo: { mes: '', zona: '', verTodas: false },
});

/* Rótulos curtos (singular/plural) para o "fator crítico" da mensagem de WhatsApp */
const IEO_ROTULO_CURTO = {
  falta_isolada: ['Falta de caixa', 'Faltas de caixa'],
  quebra_reincidente: ['Quebra de caixa reincidente', 'Quebras de caixa reincidentes'],
  div_recebimentos: ['Divergência de recebimento', 'Divergências de recebimento'],
  erro_pix: ['Erro de lançamento/baixa de PIX', 'Erros de lançamento/baixa de PIX'],
  atraso_justificativa: ['Atraso de justificativa', 'Atrasos de justificativa'],
};

Object.assign(Retaguarda, {
  colecoesFin() { return ['ieo_ocorrencias', 'ieo_fechamentos', 'ieo_laudos', 'alertas']; },

  /* =====================================================================
     IEO — Índice de Eficiência Operacional e Ranking
     ===================================================================== */
  mesAtual: () => Datas.hojeISO().slice(0, 7),
  mesAnterior(mes) { const [y, m] = mes.split('-').map(Number); const d = new Date(y, m - 2, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); },
  /** Ranking do mês: usa o fechamento congelado, se existir; senão calcula ao vivo. */
  rankingIEO(mes) {
    const fech = Repo.get('ieo_fechamentos', mes);
    if (fech?.ranking) return { ranking: fech.ranking, fechado: fech };
    const lojas = Repo.todos('lojas').filter(l => l.ativa);
    const ocorrencias = Repo.todos('ieo_ocorrencias').filter(d => d.mes === mes).flatMap(d => (d.itens || []).map(i => ({ ...i, lojaId: d.lojaId })));
    return { ranking: IEO.calcular({ mes, lojas, faltas: this.itensFaltas(), credsystem: this.linhasCS(), ocorrencias, matriz: IEO.matriz(), hoje: Datas.hojeISO() }), fechado: null };
  },
  mesesIEO() { return [...new Set([this.mesAtual(), ...this.mesesCS(), ...this.itensFaltas().map(i => i.data.slice(0, 7)), ...Repo.todos('ieo_fechamentos').map(d => d.id)])].sort().reverse(); },
  alertasAbertos() { return Repo.todos('alertas').filter(a => !a.cienteEm); },
  /** Cria o alerta da loja que entrou na Zona Vermelha no mês corrente (uma vez por loja/mês). */
  async sincronizarAlertas(ranking, mes) {
    if (!Auth.can('retaguarda.ieo.lancar') || mes !== this.mesAtual() || !Repo.prontas.has('alertas')) return;
    this._alertaTentado ||= new Set();
    for (const r of ranking.filter(x => x.zona === 'vermelha')) {
      const id = mes + '_' + r.lojaId; if (Repo.get('alertas', id) || this._alertaTentado.has(id)) continue;
      this._alertaTentado.add(id);
      const l = Repo.get('lojas', r.lojaId);
      await Repo.salvar('alertas', id, { tipo: 'ieo_vermelha', lojaId: r.lojaId, mes, pontos: r.pontos, supervisor: l?.supervisor || '', criadoEm: new Date().toISOString() }, { modulo: 'retaguarda', rotulo: `Alerta IEO · ${this.nomeLoja(r.lojaId)}`, detalhe: `Zona Vermelha com ${r.pontos} pontos` });
    }
  },
  textoAviso(a) {
    const l = Repo.get('lojas', a.lojaId);
    return `Alerta IEO — Zona Vermelha\nLoja ${l ? l.codigo + ' · ' + l.nome : a.lojaId}\nPontuação: ${String(a.pontos).replace('.', ',')} pontos em ${this.mesLabel(a.mes)} (limite crítico: ${IEO.matriz().faixas.vermelha}).\nSupervisor: ${a.supervisor || '—'}\nAção: revisar as ocorrências no Painel de Gestão (Retaguarda Financeira → IEO · Ranking) e agendar visita à loja.`;
  },

  renderIEO() {
    if (!Auth.can('retaguarda.ieo.ver')) return this.bloqueado('IEO', 'Sem permissão para o Índice de Eficiência Operacional.');
    if (!['credsystem', 'faltas', 'lojas'].every(c => Repo.prontas.has(c))) return '<div class="panel"><p class="muted">Calculando pontuação…</p></div>';
    const u = this.ui.ieo, meses = this.mesesIEO(); if (!u.mes) u.mes = this.mesAtual();
    const m = IEO.matriz(), { ranking, fechado } = this.rankingIEO(u.mes), anterior = this.rankingIEO(this.mesAnterior(u.mes)).ranking;
    // só compara com o mês anterior se ele teve movimento (senão todas as lojas empatam em 100)
    const antPos = anterior.some(x => x.deducoes?.length) ? Object.fromEntries(anterior.map(a => [a.lojaId, a.posicao])) : {};
    this._ieoDados = { ranking, mes: u.mes };
    const cont = { verde: 0, amarela: 0, vermelha: 0 }; ranking.forEach(r => cont[r.zona]++);
    const media = ranking.reduce((a, r) => a + r.pontos, 0) / (ranking.length || 1);
    const vermelhas = ranking.filter(r => r.zona === 'vermelha');
    const g = Auth.can.bind(Auth);
    const topo = `<div class="row between" style="margin-bottom:14px">
        <div class="toolbar" style="margin:0;flex:1">
          <div class="field"><label class="lbl" for="ieoMes">Ciclo (mês)</label><select id="ieoMes" data-a="rt-ieo" data-k="mes">${meses.map(x => `<option value="${x}" ${x === u.mes ? 'selected' : ''}>${this.mesLabel(x)}${Repo.get('ieo_fechamentos', x) ? ' · fechado' : ''}</option>`).join('')}</select></div>
          <div class="field"><label class="lbl" for="ieoZona">Zona</label><select id="ieoZona" data-a="rt-ieo" data-k="zona"><option value="">Todas</option>${Object.entries(IEO.ZONAS).map(([k, z]) => `<option value="${k}" ${k === u.zona ? 'selected' : ''}>${z.rotulo}</option>`).join('')}</select></div></div>
        <div class="row">${g('retaguarda.ieo.matriz') ? '<button class="btn sec" data-a="rt-ieo-matriz">Matriz de deduções</button>' : ''}${g('retaguarda.ieo.lancar') && !fechado ? '<button class="btn sec" data-a="rt-ieo-ocorrencia">+ Ocorrência</button>' : ''}
          ${g('retaguarda.ieo.fechar') ? (fechado ? '<button class="btn ghost" data-a="rt-ieo-reabrir">Reabrir ciclo</button>' : `<button class="btn" data-a="rt-ieo-fechar">Fechar ciclo</button>`) : ''}</div></div>`;
    const alertas = this.alertasAbertos().filter(a => a.mes === u.mes);
    const banner = vermelhas.length ? `<div class="alerta-critico" role="alert"><div class="ic">${ICON.alerta}</div><div style="flex:1;min-width:0"><b>${vermelhas.length} loja${vermelhas.length > 1 ? 's' : ''} em Zona Vermelha (abaixo de ${m.faixas.vermelha} pontos)</b>
        <div class="alerta-lista">${vermelhas.map(r => `<div class="row between" style="gap:8px;padding:6px 0;border-top:1px solid rgba(0,0,0,.08)"><span>${esc(r.codigo)} · ${esc(r.nome)} (${Fmt.num(r.pontos, 0)} pts${Repo.get('lojas', r.lojaId)?.supervisor ? ' · sup. ' + esc(Repo.get('lojas', r.lojaId).supervisor) : ''})</span>${this.botaoWhats(r, 'sm')}</div>`).join('')}</div>
        ${alertas.length ? `<div class="hint" style="color:inherit;opacity:.85">${alertas.length} alerta(s) aguardando ciência da supervisão.</div>` : ''}</div>
        ${alertas.length ? `<button class="btn sm" data-a="rt-ieo-alertas">Ver alertas</button>` : ''}</div>` : '';
    const kpis = `<div class="grid g4" style="margin-bottom:16px">
      <div class="kpi"><div class="k">Média da rede</div><div class="v">${Fmt.num(media, 1)}</div><div class="d">${ranking.length} lojas ativas · início com ${m.pontosIniciais} pontos</div></div>
      <div class="kpi zona-kpi ok"><div class="k">Zona Verde</div><div class="v">${cont.verde}</div><div class="d">${m.faixas.verde} pontos ou mais</div></div>
      <div class="kpi zona-kpi warn"><div class="k">Zona Amarela</div><div class="v">${cont.amarela}</div><div class="d">de ${m.faixas.vermelha} a ${m.faixas.verde - 1}</div></div>
      <div class="kpi zona-kpi bad"><div class="k">Zona Vermelha</div><div class="v">${cont.vermelha}</div><div class="d">abaixo de ${m.faixas.vermelha}</div></div></div>`;
    const card = (r, pos, pior) => `<button class="podio-item ${pior ? 'pior' : ''} p${pos}" data-a="rt-ieo-loja" data-id="${r.lojaId}">
        <span class="lugar">${pior ? `${r.posicao}º` : pos + 'º'}</span><b>${esc(r.codigo)} · ${esc(r.nome)}</b>
        <span class="pts">${Fmt.num(r.pontos, 0)}<small> pts</small></span><span class="pill ${IEO.ZONAS[r.zona].cls}">${IEO.ZONAS[r.zona].rotulo}</span>
        <span class="hint">${r.deducoes.length ? r.deducoes.length + ' dedução(ões)' : 'sem deduções'}</span></button>`;
    const top3 = ranking.slice(0, 3), bot3 = ranking.slice(-3).reverse();
    const podio = `<div class="grid g2 cs-top">
      <div class="panel"><h2>Top 3 · melhores lojas</h2><p class="sub">Maior pontuação no ciclo; empate decidido pelo menor número de ocorrências.</p>
        <div class="podio">${[top3[1], top3[0], top3[2]].map((r, i) => r ? card(r, [2, 1, 3][i], false) : '').join('')}</div></div>
      <div class="panel"><h2>3 piores lojas</h2><p class="sub">Menor pontuação no ciclo — prioridade da supervisão.</p>
        <div class="podio lista">${bot3.map((r, i) => card(r, i + 1, true)).join('')}</div></div></div>`;
    const lista = ranking.filter(r => !u.zona || r.zona === u.zona), mostrar = u.verTodas ? lista : lista.slice(0, 25);
    const tabela = `<div class="panel"><div class="row between"><div><h2>Ranking completo</h2><p class="sub">${fechado ? `Ciclo fechado em ${Fmt.dataHora(fechado.fechadoEm)} — pontuação congelada.` : 'Pontuação ao vivo: recalculada a cada falta, conciliação ou ocorrência lançada.'}</p></div>
        ${g('retaguarda.ieo.laudo') ? '<button class="btn ghost" data-a="rt-ieo-laudos-lote">Gerar laudos (zonas amarela e vermelha)</button>' : ''}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Posição</th><th>Loja</th><th>Pontuação</th><th>Zona</th><th>Deduções</th><th>Mês anterior</th><th></th></tr></thead><tbody>
      ${mostrar.map(r => { const ap = antPos[r.lojaId], dv = ap ? ap - r.posicao : 0;
        return `<tr class="click" data-a="rt-ieo-loja" data-id="${r.lojaId}"><td class="mono"><b>${r.posicao}º</b></td><td><div class="cell-main">${esc(r.codigo)} · ${esc(r.nome)}</div><div class="cell-sub">${esc(Repo.get('lojas', r.lojaId)?.supervisor || '')}</div></td>
          <td><div class="meter ${IEO.ZONAS[r.zona].cls}"><i style="width:${r.pontos}%"></i></div><span class="mono"><b>${Fmt.num(r.pontos, 0)}</b></span></td>
          <td><span class="pill ${IEO.ZONAS[r.zona].cls}">${IEO.ZONAS[r.zona].rotulo}</span></td>
          <td>${Object.values(r.resumo).map(x => `<span class="pill neutral" style="margin:1px" title="${esc(x.nome)}">${esc(x.nome.split(' (')[0])} ×${x.n} (${x.pontos})</span>`).join('') || '<span class="hint">—</span>'}</td>
          <td>${ap ? `<span class="delta ${dv > 0 ? 'up' : dv < 0 ? 'down' : ''}">${dv > 0 ? '▲ ' + dv : dv < 0 ? '▼ ' + -dv : '='}</span> <span class="hint">${ap}º</span>` : '<span class="hint">—</span>'}</td>
          <td class="acts">${Repo.get('ieo_laudos', u.mes + '_' + r.lojaId) ? '<span class="pill info">laudo</span>' : ''}${r.zona === 'vermelha' ? this.botaoWhats(r, 'sm') : ''}</td></tr>`; }).join('')}
      </tbody></table></div>${lista.length > 25 ? `<button class="btn ghost sm" style="margin-top:8px" data-a="rt-ieo-todas">${u.verTodas ? 'Mostrar 25' : `Ver todas (${lista.length})`}</button>` : ''}</div>`;
    return topo + banner + kpis + podio + tabela;
  },

  /** Detalhe da loja: extrato de deduções + laudo. */
  abrirLojaIEO(lojaId) {
    const { mes, ranking } = this._ieoDados, r = ranking.find(x => x.lojaId === lojaId); if (!r) return;
    const laudo = Repo.get('ieo_laudos', mes + '_' + lojaId), z = IEO.ZONAS[r.zona], pode = Auth.can('retaguarda.ieo.laudo');
    const ocorr = Repo.get('ieo_ocorrencias', mes + '_' + lojaId);
    UI.modal({
      titulo: `IEO · ${r.codigo} · ${r.nome} · ${this.mesLabel(mes)}`, largo: true,
      corpo: `<div class="row" style="gap:18px;align-items:center;margin-bottom:12px"><div class="score-big">${Fmt.num(r.pontos, 0)}</div><div><span class="pill ${z.cls}">${z.rotulo} — ${z.desc}</span><div class="hint" style="margin-top:4px">${r.posicao}º de ${ranking.length} lojas · início com ${IEO.matriz().pontosIniciais} pontos</div></div>${r.zona === 'vermelha' ? `<div style="margin-left:auto">${this.botaoWhats(r)}</div>` : ''}</div>
        ${r.deducoes.length ? `<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Ocorrência</th><th>Detalhe</th><th class="num">Pontos</th>${Auth.can('retaguarda.ieo.lancar') ? '<th></th>' : ''}</tr></thead><tbody>
          ${r.deducoes.map(d => `<tr><td class="mono">${Fmt.data(d.data)}</td><td>${esc(d.nome)}<div class="cell-sub">${esc(IEO_ORIGENS[d.origem] || '')}</div></td><td>${esc(d.detalhe || '—')}</td><td class="num"><b style="color:var(--bad)">${d.pontos}</b></td>
            ${Auth.can('retaguarda.ieo.lancar') ? `<td class="acts">${d.origem === 'manual' && ocorr?.itens?.some(i => i.id === d.ref) ? `<button class="iconbtn" data-oc-del="${esc(d.ref)}" aria-label="Excluir ocorrência">${ICON.lixo}</button>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nenhuma dedução neste ciclo.</div>'}
        <div class="ai-box" style="margin-top:16px"><div class="row between"><h4>${ICON.ia} Laudo de Performance</h4>${laudo ? `<span class="hint">${laudo.origem === 'ia' ? 'redigido por IA' : 'automático'} · ${Fmt.dataHora(laudo.geradoEm)}</span>` : ''}</div>
          <div id="laudoTexto" style="white-space:pre-wrap;margin-top:8px">${laudo ? esc(laudo.texto) : '<span class="hint">Ainda não gerado.</span>'}</div></div>`,
      aoAbrir: mm => mm.addEventListener('click', async e => {
        const b = e.target.closest('[data-oc-del]'); if (!b) return;
        await Repo.salvar('ieo_ocorrencias', ocorr.id, { ...ocorr, itens: ocorr.itens.filter(i => i.id !== b.dataset.ocDel) }, { modulo: 'retaguarda', rotulo: `IEO · ocorrência · ${this.nomeLoja(lojaId)}`, detalhe: 'Ocorrência excluída' });
        UI.toast('Ocorrência excluída'); mm.closest('.overlay').remove(); document.body.classList.remove('modal-aberto');
      }),
      acoes: [{ rotulo: 'Fechar', classe: 'sec' },
        ...(pode ? [{ rotulo: 'Laudo automático', classe: 'sec', fechar: false, acao: async m => { await this.gerarLaudo(r, false); $('#laudoTexto', m).textContent = Repo.get('ieo_laudos', mes + '_' + lojaId).texto; } },
                    { rotulo: 'Gerar laudo com IA', fechar: false, acao: async m => { $('#laudoTexto', m).textContent = 'Redigindo o laudo…'; try { await this.gerarLaudo(r, true); $('#laudoTexto', m).textContent = Repo.get('ieo_laudos', mes + '_' + lojaId).texto; } catch (err) { $('#laudoTexto', m).textContent = err.message; } } }] : []),
        { rotulo: 'Imprimir laudo', classe: 'sec', fechar: false, acao: () => this.imprimirLaudo(r) }],
    });
  },
  dadosLaudo(r) {
    const { mes, ranking } = this._ieoDados;
    return Laudo.dados(r, { ranking, anterior: this.rankingIEO(this.mesAnterior(mes)).ranking, mes, loja: Repo.get('lojas', r.lojaId) });
  },
  async gerarLaudo(r, ia) {
    const { mes } = this._ieoDados, dados = this.dadosLaudo(r);
    // sem movimento no mês anterior, a posição anterior não é informada (evita "caiu" artificial)
    const semHistorico = !this.rankingIEO(this.mesAnterior(mes)).ranking.some(x => x.deducoes?.length);
    if (semHistorico) { dados.posicaoAnterior = null; dados.pontosAnteriores = null; }
    const texto = ia ? await Laudo.gerarIA(dados) : Laudo.local(dados);
    if (!texto) throw new Error('A IA não devolveu texto.');
    await Repo.salvar('ieo_laudos', mes + '_' + r.lojaId, { mes, lojaId: r.lojaId, texto, origem: ia ? 'ia' : 'automatico', dados, pontos: r.pontos, zona: r.zona, geradoEm: new Date().toISOString(), geradoPor: Auth.id },
      { modulo: 'retaguarda', rotulo: `Laudo IEO · ${r.codigo} · ${r.nome}`, detalhe: ia ? 'Gerado por IA' : 'Gerado automaticamente' });
  },
  async laudosEmLote() {

  mensagemWhatsIEO(r, mes = this.ui.ieo.mes) {
    const pior = Object.entries(r.resumo || {}).sort((a, b) => a[1].pontos - b[1].pontos)[0];
    const fator = pior ? `${pior[1].n} ${(IEO_ROTULO_CURTO[pior[0]] || [pior[1].nome, pior[1].nome])[pior[1].n > 1 ? 1 : 0]} (${String(pior[1].pontos).replace('.', ',')} pontos)` : 'sem deduções registradas';

    if (a === 'rt-ieo') { this.ui.ieo[el.dataset.k] = el.value; return App.render(); }

/* =====================================================================
   MÓDULO 4 — AUDITORIA DE ADQUIRENTES (taxas + conciliação tripla de cartões)
   Regra de negócio: a operação antecipa 100% dos recebíveis (flag por regra).

   Camadas:
     5 Repositório → adq_taxas/<adquirente>__<bandeira>  regras por ADQUIRENTE + OPERADORA/BANDEIRA (GESTOR)
                     ex.: GETNET - VISA · GETNET - MASTER · CREDSYSTEM - ESPOSENDE CARD
                     adq_auditorias/<AAAA-MM> (KPIs) · adq_excecoes/<AAAA-MM>_<n> (exceções, 1.000 por doc)
     6 Serviços    → LeitorArquivosAdq (XLSX/CSV; reconhece os layouts oficiais e cai no mapeamento genérico)
                     MotorConciliacao   (ERP × adquirente × banco; o que não tem arquivo da adquirente vai no modo direto)
     7 UI          → Retaguarda.renderAdq … (aba "Auditoria de Adquirentes")

   ERP (VENDASGETNET_ERP.XLSX / VENDASCREDSYSTEM_ERP.XLSX — "Controle dos cartões"): uma linha por PARCELA.
     EMPRESA "05-005 - CAMARAGIBE" · LANÇAMENTO · VENCIMENTO · DOCUMENTO "CE244205-1/6" | "LOTE2016920012" · COMPLEMENTO "PAR 1/06"
     VALOR · TAXA (MDR no ERP) · VALOR LÍQUIDO · AUTORIZAÇÃO · OPERADORA "GETNET - VISA" | "CREDSYSTEM" · STATUS
     • DOCUMENTO com "LOTE" = Recebimento de Prestação; os demais = Venda.
     • OPERADORA → adquirente + bandeira ("CREDSYSTEM" → CREDSYSTEM / ESPOSENDE CARD).

   Liquidação da adquirente (layouts oficiais, reconhecidos pelo cabeçalho):
     GETNET  "Vendas_Detalhado_…xlsx" (aba CARTÕES): uma linha por VENDA — BANDEIRA, FORMA DE PAGAMENTO, DATA/HORA DA VENDA,
             PARCELAS, DATA PREVISTA DO 1º PAGAMENTO, NÚMERO DE AUTORIZAÇÃO (AUT), CV (NSU), VALOR BRUTO, VALOR TAXA, VALOR LÍQUIDO.
             Casa com o ERP por AUTORIZAÇÃO + data (soma as parcelas do ERP). O líquido do arquivo é pós-MDR; a antecipação
             é descontada no repasse (calculada pelo contrato, dias até o vencimento de cada parcela).
     CREDSYSTEM "Antecipados - 610.csv": uma linha por LOJA × VENCIMENTO antecipado — FANTASIA, PERIODO_VE (vendas),
             VALOR_LIQ (pós-MDR), VENCIMENTO, PAGAMENTO, TAXA (% a.m.), N_DIAS, VALOR_ANT (pago), RECEITA_AN (custo).
             Casa com o ERP por loja + período de venda + mês do vencimento (a Credsystem não informa NSU).

   Motor (por adquirente e data de venda):
     • coberto por arquivo da adquirente → TRIPLO
         Taxa:    esperado = bruto − MDR(contrato) − antecipação(contrato); pago abaixo do esperado − R$ 0,02 → "Divergência de taxa"
         Repasse: soma o líquido de vendas + prestações (LOTE) da mesma adquirente e data de pagamento e procura no OFX
                  (Módulo 3) até D+1 útil; ausente ou menor → "Furo de repasse"
     • sem arquivo da adquirente → DIRETO: líquido estimado pelo contrato × crédito no OFX (abaixo = divergência, ausente = furo)
   ===================================================================== */
const ADQ_CFG = { tolParcela: 0.02, tolRepasseAbs: 0.05, tolRepassePct: 0.0001, tolEstAbs: 1.00, tolEstPct: 0.0005, maxExcecoes: 10000, porDoc: 1000, lote: 4000, tolArred: 0.005 };
const ADQ_MODALIDADES = { debito: 'Débito', credito: 'Crédito', voucher: 'Voucher / benefício', pix: 'PIX' };
const ADQ_CREDSYSTEM = 'CREDSYSTEM', ADQ_ESPOSENDE_CARD = 'ESPOSENDE CARD'; // adquirente nativa + bandeira própria
const ADQ_ALIASES_PADRAO = {
  GETNET: ['GETNET', 'SANTANDER GETNET'], CIELO: ['CIELO'], REDE: ['REDE', 'REDECARD', 'ITAU REDE'], STONE: ['STONE'],
  PAGSEGURO: ['PAGSEGURO', 'PAGBANK', 'PAGSEG'], SAFRAPAY: ['SAFRAPAY', 'SAFRA PAY'], SIPAG: ['SIPAG'], VERO: ['VERO', 'BANRISUL'],
  CREDSYSTEM: ['CREDSYSTEM', 'CRED SYSTEM', 'ESPOSENDE CARD', 'ESP CARD', 'ESPCARD'],
};
/** Bandeiras reconhecidas na coluna OPERADORA (apelido → nome da regra). */
const ADQ_BANDEIRAS = [['MASTERCARD', 'MASTER'], ['MASTER', 'MASTER'], ['VISA', 'VISA'], ['ELO', 'ELO'], ['AMERICAN EXPRESS', 'AMEX'], ['AMEX', 'AMEX'], ['HIPERCARD', 'HIPERCARD'], ['HIPER', 'HIPERCARD'],
  ['CABAL', 'CABAL'], ['DINERS', 'DINERS'], ['SOROCRED', 'SOROCRED'], ['GOODCARD', 'GOODCARD'], ['BANESCARD', 'BANESCARD'], ['JCB', 'JCB'], ['DISCOVER', 'DISCOVER'], ['ESPOSENDE CARD', 'ESPOSENDE CARD']];
const ADQ_FAIXAS_PADRAO = [
  { modalidade: 'debito', de: 1, ate: 1, taxa: null }, { modalidade: 'credito', de: 1, ate: 1, taxa: null },
  { modalidade: 'credito', de: 2, ate: 6, taxa: null }, { modalidade: 'credito', de: 7, ate: 12, taxa: null },
];

/* ============================ Util: dias úteis (feriados nacionais bancários) ============================ */
const DiasUteis = {
  _fer: {},
  pascoa(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1; return Date.UTC(y, mes - 1, dia); },
  feriados(y) {
    if (this._fer[y]) return this._fer[y];
    const iso = t => new Date(t).toISOString().slice(0, 10), p = this.pascoa(y), D = 864e5;
    const s = new Set(['01-01', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-25'].map(x => `${y}-${x}`));
    [-48, -47, -2, 60].forEach(n => s.add(iso(p + n * D))); // carnaval (seg/ter), sexta-feira santa, Corpus Christi
    return this._fer[y] = s;
  },
  util(iso) { const d = new Date(iso + 'T12:00:00Z').getUTCDay(); return d !== 0 && d !== 6 && !this.feriados(+iso.slice(0, 4)).has(iso); },
  proximo(iso) { let x = iso; while (!this.util(x)) x = MotorConciliacao.somaDias(x, 1); return x; },
  somar(iso, n) { let x = iso; for (let i = 0; i < n; i++) { x = MotorConciliacao.somaDias(x, 1); while (!this.util(x)) x = MotorConciliacao.somaDias(x, 1); } return this.proximo(x); },
};

/* ============================ 5. REPOSITÓRIO ============================ */
const AdqTaxas = {
  COL: 'adq_taxas',
  chave: s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(),
  slug(s) { return this.chave(s).toLowerCase().replace(/\s+/g, '-') || 'x'; },
  adqId(nome) { return 'adq-' + this.slug(nome); },
  idRegra(adquirente, bandeira) { return `${this.adqId(adquirente)}__${bandeira && bandeira !== '*' ? this.slug(bandeira) : 'todas'}`; },
  /** Normaliza (inclui documentos da v9: taxa global por adquirente = regra "todas as bandeiras"). */
  norm(d) {
    if (!d) return null;
    let adquirente = this.chave(d.adquirente || d.nome || ''), bandeira = d.bandeira || '*';
    if (adquirente === ADQ_ESPOSENDE_CARD) { adquirente = ADQ_CREDSYSTEM; bandeira = ADQ_ESPOSENDE_CARD; } // regra da v10
    if (adquirente === ADQ_CREDSYSTEM && bandeira === '*') bandeira = ADQ_ESPOSENDE_CARD;
    return { ...d, adquirente, bandeira, adq: this.adqId(adquirente), antecipado: d.antecipado !== false, prazoRepasse: Number(d.prazoRepasse) || 1, mdr: d.mdr || [] };
  },
  regras() { return Repo.todos(this.COL).filter(t => t.ativo !== false).map(t => this.norm(t)).sort((a, b) => a.adquirente.localeCompare(b.adquirente) || (a.bandeira === '*' ? -1 : b.bandeira === '*' ? 1 : a.bandeira.localeCompare(b.bandeira))); },
  adquirentes() { const s = new Set(['GETNET', ADQ_CREDSYSTEM, ...this.regras().map(r => r.adquirente)]); return [...s].sort((a, b) => a === ADQ_CREDSYSTEM ? 1 : b === ADQ_CREDSYSTEM ? -1 : a.localeCompare(b)); },
  /** "GETNET - VISA" · "CREDSYSTEM - ESPOSENDE CARD" · "GETNET - todas as bandeiras". */
  rotulo(adquirente, bandeira) { return `${adquirente} - ${!bandeira || bandeira === '*' ? 'todas as bandeiras' : bandeira}`; },
  _idx: null,
  indice() {
    if (this._idx) return this._idx;
    const m = new Map(); this.regras().forEach(r => m.set(r.adq + '|' + r.bandeira, r));
    return this._idx = m;
  },
  regra(adq, bandeira) { const i = this.indice(); return i.get(adq + '|' + (bandeira || '*')) || i.get(adq + '|*') || null; },
  aliasesAdq(adq) {
    const regs = this.regras().filter(r => r.adq === adq), nome = regs[0]?.adquirente || this.nome(adq);
    return [...new Set([nome, ...regs.flatMap(r => r.aliases || []), ...(ADQ_ALIASES_PADRAO[nome] || [])].map(this.chave).filter(Boolean))];
  },
  nome(adq) { return this.regras().find(r => r.adq === adq)?.adquirente || String(adq).replace(/^adq-/, '').replace(/-/g, ' ').toUpperCase(); },
  _memo: new Map(),
  /** "GETNET - VISA", "GETNET-ES SPORTS (MASTER)", "ESPOSENDE CARD" → { adq, adquirente, bandeira }. Memoizado. */
  operadora(txt) {
    const s = String(txt ?? ''); if (this._memo.has(s)) return this._memo.get(s);
    const k = ' ' + this.chave(s) + ' ';
    let adquirente = null;
    const conhecidos = [...new Set([...this.regras().map(r => r.adquirente), ...Object.keys(ADQ_ALIASES_PADRAO)])];
    for (const a of conhecidos) { const al = [a, ...(ADQ_ALIASES_PADRAO[a] || []), ...this.regras().filter(r => r.adquirente === a).flatMap(r => r.aliases || [])].map(this.chave); if (al.some(x => x && k.includes(' ' + x + ' '))) { adquirente = a; break; } }
    if (!adquirente) adquirente = this.chave(s.split(/[-(]/)[0]) || 'DESCONHECIDA';
    const b = adquirente === ADQ_CREDSYSTEM ? [0, ADQ_ESPOSENDE_CARD] : ADQ_BANDEIRAS.find(([a]) => k.includes(' ' + a + ' '));
    const r = { adq: this.adqId(adquirente), adquirente, bandeira: b ? b[1] : '*' };
    this._memo.set(s, r); return r;
  },
  limparCache() { this._memo.clear(); this._idx = null; },
  mdr(r, modalidade, parcelas) {
    const f = (r?.mdr || []).find(x => x.modalidade === modalidade && parcelas >= Number(x.de || 1) && parcelas <= Number(x.ate || x.de || 1) && x.taxa != null && x.taxa !== '');
    return f ? Number(f.taxa) : null;
  },
  antecipacaoMes(r) {
    const a = r?.antecipacao; if (!a || a.taxa == null || a.taxa === '') return null;
    const i = Number(a.taxa) / 100;
    return a.unidade === 'aa' ? (a.metodo === 'composto' ? Math.pow(1 + i, 1 / 12) - 1 : i / 12) : i;
  },
  async salvar(id, d) {
    const adquirente = this.chave(d.adquirente), bandeira = d.bandeira && d.bandeira !== '*' ? this.chave(d.bandeira) : adquirente === ADQ_CREDSYSTEM ? ADQ_ESPOSENDE_CARD : '*';
    const rid = id || this.idRegra(adquirente, bandeira);
    const { id: _, ...antes } = Repo.get(this.COL, rid) || {};
    await Repo.salvar(this.COL, rid, { ...antes, ...d, adquirente, bandeira, ativo: true, nome: undefined }, { modulo: 'retaguarda', rotulo: `Taxas · ${this.rotulo(adquirente, bandeira)}` });
    this.limparCache(); return rid;
  },
  async remover(id) { const { id: _, ...x } = Repo.get(this.COL, id); await Repo.salvar(this.COL, id, { ...x, ativo: false }, { modulo: 'retaguarda', rotulo: `Taxas · ${x.adquirente || x.nome}`, detalhe: 'Regra removida' }); this.limparCache(); },
  /** Sugere regras (MDR por bandeira × modalidade × parcelas) a partir da TAXA lançada no ERP. */
  sugerir(vendas) {
    const obs = new Map();
    for (const v of vendas) {
      if (v.tipo === 'prestacao' || !(v.taxaErp > 0) || !(v.valor > 0)) continue;
      const k = `${v.adquirente}|${v.bandeira}|${v.modalidade}|${v.total}`, pct = Math.round(v.taxaErp / v.valor * 10000) / 100;
      const c = obs.get(k) || new Map(); c.set(pct, (c.get(pct) || 0) + 1); obs.set(k, c);
    }
    const regras = new Map();
    obs.forEach((c, k) => {
      const [adquirente, bandeira, modalidade, total] = k.split('|'), moda = [...c.entries()].sort((a, b) => b[1] - a[1])[0][0];
      const r = regras.get(adquirente + '|' + bandeira) || { adquirente, bandeira, mdr: [] };
      r.mdr.push({ modalidade, de: +total, ate: +total, taxa: moda, n: [...c.values()].reduce((a, b) => a + b, 0) }); regras.set(adquirente + '|' + bandeira, r);
    });
    // junta parcelas vizinhas com a mesma taxa (2x…6x a 1,63% → 2–6x) e cobre as lacunas até 12x
    const compactar = fs => {
      const out = [];
      for (const f of fs.sort((a, b) => a.de - b.de)) { const u = out.at(-1); if (u && u.taxa === f.taxa) { u.ate = f.ate; u.n += f.n; } else out.push({ ...f }); }
      if (fs[0]?.modalidade === 'credito') out.forEach((f, i) => { f.ate = i < out.length - 1 ? out[i + 1].de - 1 : Math.max(f.ate, 12); });
      return out;
    };
    return [...regras.values()].map(r => ({ ...r, mdr: ['debito', 'credito', 'voucher', 'pix'].flatMap(mo => compactar(r.mdr.filter(f => f.modalidade === mo))) }));
  },
};

const MotorConciliacao = {
  r2: n => Math.round((Number(n) + Number.EPSILON) * 100) / 100,
  tick: () => new Promise(r => setTimeout(r, 0)),
  dias(a, b) { return Math.round((Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10)) - Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10))) / 864e5); },
  somaDias(iso, n) { const d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10) + n)); return d.toISOString().slice(0, 10); },
  /** Janela de tolerância: D até D+1 útil. */
  janela(iso) { return [iso, DiasUteis.somar(iso, 1)]; },
  modalidade(txt) {
    const k = AdqTaxas.chave(txt);
    if (/DEB|ELECTRON|MAESTRO/.test(k)) return 'debito';
    if (/PIX/.test(k)) return 'pix';
    if (/VOUCHER|VALE|ALIMENT|REFEI|BENEF|TICKET|SODEXO|ALELO/.test(k)) return 'voucher';
    return 'credito';
  },
  indiceEC() {
    const m = new Map();
    Repo.todos('lojas').forEach(l => (l.adquirentes || []).forEach(a => { if (a.ec) m.set(String(a.ec).replace(/\D/g, ''), l.id); if (a.codigoLogico) m.set(AdqTaxas.chave(a.codigoLogico), l.id); }));
    return m;
  },
  /** "05-005 - CAMARAGIBE" → loja-005; EC da adquirente → loja; "014" → loja-014. */
  loja(txt, ec) {
    const s = String(txt ?? '').trim(); if (!s) return '';
    const m = s.match(/^\s*\d+\s*-\s*(\d{3})\b/); if (m && Repo.get('lojas', 'loja-' + m[1])) return 'loja-' + m[1];
    return ec.get(s.replace(/\D/g, '')) || ec.get(AdqTaxas.chave(s)) || Retaguarda.loja(s).lojaId || '';
  },
  dataISO(v) { return v instanceof Date ? Datas.iso(v) : Retaguarda.dataISO(v); },

  /** Parcelas do ERP (uma linha por parcela). LOTE no documento = recebimento de prestação. */
  async vendasERP(arq, adqPadrao, onLote = () => { }) {
    if (!arq) return { vendas: [], ignoradas: 0 };
    const ec = this.indiceEC(), out = []; let ignoradas = 0;
    for (let i = 0; i < arq.linhas.length; i++) {
      if (i && i % ADQ_CFG.lote === 0) { onLote(i / arq.linhas.length); await this.tick(); }
      const r = arq.linhas[i], data = this.dataISO(r.data), valor = Retaguarda.num(r.valor);
      if (!data || !(valor > 0)) { ignoradas++; continue; }
      const doc = String(r.documento ?? '').trim(), comp = String(r.complemento ?? '').trim(), prest = /LOTE/i.test(doc);
      const op = AdqTaxas.operadora([r.operadora || adqPadrao || '', r.bandeira || ''].join(' '));
      let parcela = 1, total = Retaguarda.num(r.totalParcelas) || 1, m;
      if ((m = comp.match(/PAR\w*\s*0*(\d+)\s*\/\s*0*(\d+)/i)) || (m = doc.match(/-0*(\d+)\s*\/\s*0*(\d+)\s*$/))) { parcela = +m[1]; total = +m[2]; }

    if (semLiq.length) avisos.push(`Parcelas do ERP sem correspondência no arquivo da adquirente (mesma data e adquirente): ${Object.values(meses).reduce((s, m) => s + m.erp.erpSemAdq, 0)} — ex.: ${semLiq.join('; ')}.`);
    if (taxaDoArquivo.size) avisos.push(`Sem taxa de antecipação na regra: usei a taxa declarada no arquivo (${[...taxaDoArquivo.entries()].map(([r, t]) => `${r} ${Fmt.pct(t)} a.m.`).join('; ')}). Cadastre a taxa negociada para auditar a antecipação.`);

    if (!a) return imp + topo + barra + `<div class="panel"><div class="empty">Nenhuma auditoria processada para ${this.mesLabel(u.mes)}. Envie o arquivo do ERP (e, se tiver, o da adquirente) e clique em “Processar auditoria”.</div></div>`;
    const k = a.kpis, direto = a.modo === 'direto', misto = a.modo === 'misto', pctV = (v, b) => b ? Fmt.pct(v / b * 100, 2) : '—', tp = a.tipos || { venda: {}, prestacao: {} };

  montarAdq() {

  },

  /* ---------------- taxas: regras por adquirente + bandeira ---------------- */
  resumoMdr(r) {
    return (r.mdr || []).filter(f => f.taxa != null && f.taxa !== '').map(f => `${f.modalidade === 'debito' ? 'déb.' : f.modalidade === 'credito' ? (f.de === f.ate ? `créd. ${f.de}x` : `créd. ${f.de}–${f.ate}x`) : ADQ_MODALIDADES[f.modalidade]} ${Fmt.pct(f.taxa)}`).join(' · ') || '<span style="color:var(--warn)">sem MDR</span>';
  },
  renderAdqTaxas() {
    const pode = Auth.can('retaguarda.adq.taxas'), regs = AdqTaxas.regras(), adqs = AdqTaxas.adquirentes(), temErp = !!this._adqVendas?.length;

    return `<div class="panel"><div class="row between"><div><h2>Regras de taxa: adquirente + bandeira</h2><p class="sub">Cada regra tem o MDR por modalidade e nº de parcelas e o parâmetro “100% antecipado”. A regra “todas as bandeiras” vale quando não houver uma específica.</p></div>
        ${pode ? `<div class="row"><button class="btn ghost" data-a="rt-adq-sugerir" ${temErp ? '' : 'disabled title="Carregue o arquivo do ERP no painel do mês"'}>Sugerir regras a partir do ERP</button><button class="btn" data-a="rt-adq-regra-nova">+ Regra</button></div>` : ''}</div>
      ${adqs.map(n => { const rs = regs.filter(r => r.adquirente === n), nativo = n === ADQ_CREDSYSTEM;

  /* ---------------- ações ---------------- */
  /* ---------------- estado em memória (RAM) dos arquivos importados ----------------
     Vive só enquanto a aba "Auditoria de Adquirentes" estiver aberta: liberarAdq() é chamado ao trocar de aba
     ou sair do Módulo 4. Cada arquivo guarda as linhas lidas e, por linha, as chaves adquirente|data (_ks),
     usadas para substituir dados quando chega um arquivo mais novo das mesmas adquirentes e datas. */
  liberarAdq() {
    const a = this._adqArq; if (!a.erps.length && !a.adqs.length && !this._adqVendas && !this._adqLista.length) return;
    this._adqArq = { erps: [], adqs: [] }; this._adqVendas = null; this._adqLista = []; this._adqErpUnido = null; this._adqUltimo = null; this._adqSeq = 0;
  },
  temArqAdq() { return this._adqArq.erps.length > 0 || this._adqArq.adqs.length > 0; },
  /** ERP único para o motor (os arquivos em memória concatenados), memorizado até a lista mudar. */
  erpUnido() {
    const es = this._adqArq.erps; if (!es.length) return null;
    return this._adqErpUnido ||= { nome: es.map(f => f.nome).join(' + '), linhas: es.flatMap(f => f.linhas), mapa: es[0].mapa, colunas: es[0].colunas };
  },
  /** Chaves adquirente|data de cada linha (em lotes, sem travar a tela) + período e adquirentes do arquivo. */
  async chavesArqAdq(tipo, f) {
    const M = MotorConciliacao, adqs = new Set(), base = f.adquirente || '';
    let ini = '', fim = '';
    for (let i = 0; i < f.linhas.length; i++) {
      if (i && i % ADQ_CFG.lote === 0) await M.tick();
      const r = f.linhas[i]; let op, ds = [];
      if (tipo === 'erp') { op = AdqTaxas.operadora([r.operadora || this.ui.adq.adqPadrao || '', r.bandeira || ''].join(' ')); const d = M.dataISO(r.data); if (d && Retaguarda.num(r.valor) > 0) ds = [d]; }
      else if (f.grao === 'lote') { op = AdqTaxas.operadora([base, r.bandeira || f.bandeira || ''].join(' ')); const p = M.periodo(r.periodo); if (p && M.dataISO(r.pagto)) for (let d = p[0]; d <= p[1]; d = M.somaDias(d, 1)) ds.push(d); }
      else { op = AdqTaxas.operadora([r.adquirente || base, r.bandeira || f.bandeira || ''].join(' ')); const d = M.dataISO(r.dataVenda) || M.dataISO(r.pagto); if (d && Retaguarda.num(r.bruto) > 0) ds = [d]; }
      // adquirente ainda não identificada: chave própria do arquivo, para dois arquivos sem adquirente não se substituírem por engano
      const pre = tipo === 'adq' && !base && !r.adquirente ? '?' + f.nome : op.adq;
      r._ks = ds.map(d => pre + '|' + d);
      if (ds.length) { adqs.add(op.adquirente); if (!ini || ds[0] < ini) ini = ds[0]; if (!fim || ds.at(-1) > fim) fim = ds.at(-1); }
    }
    f.meta = { adquirentes: [...adqs].sort(), ini, fim, n: f.linhas.filter(r => r._ks.length).length };
  },
  /**
   * Substituição inteligente: o arquivo novo prevalece. Arquivo com o mesmo nome é trocado inteiro; nos demais do mesmo
   * tipo, as linhas das MESMAS adquirentes e datas do novo saem da memória (sem duplicar no cruzamento).
   * Um arquivo antigo que fica sem linhas úteis é descartado. Devolve o que foi substituído, para o aviso na tela.
   */
  integrarArqAdq(tipo, novo) {
    const lista = tipo === 'erp' ? this._adqArq.erps : this._adqArq.adqs, notas = [];
    const novas = new Set(novo.linhas.flatMap(r => r._ks));
    for (const f of [...lista]) {
      if (f.nome === novo.nome) { lista.splice(lista.indexOf(f), 1); notas.push(`${f.nome} (versão anterior) substituído`); continue; }
      const antes = f.linhas.length; f.linhas = f.linhas.filter(r => !r._ks.some(k => novas.has(k)));
      const saiu = antes - f.linhas.length; if (!saiu) continue;
      if (!f.linhas.some(r => r._ks.length)) { lista.splice(lista.indexOf(f), 1); notas.push(`${f.nome} substituído (mesmas adquirentes e datas)`); }
      else { f.cedidas = (f.cedidas || 0) + saiu; this.metaArqAdq(f); notas.push(`${saiu} linha(s) de ${f.nome} trocada(s) pelo arquivo novo`); }
    }
    novo.id = ++this._adqSeq; novo.lidoEm = new Date().toISOString(); novo.substituiu = notas; lista.push(novo);
    if (tipo === 'erp') this._adqErpUnido = null;
    return notas;
  },
  /** Recalcula período e nº de linhas úteis depois de uma substituição parcial (datas saem das chaves adq|AAAA-MM-DD). */
  metaArqAdq(f) {
    const ds = f.linhas.flatMap(r => r._ks.map(k => k.slice(-10))).sort();
    f.meta = { ...f.meta, ini: ds[0] || '', fim: ds.at(-1) || '', n: f.linhas.filter(r => r._ks.length).length };
  },
  async atualizarVendasAdq() { const e = this.erpUnido(); this._adqVendas = e ? (await MotorConciliacao.vendasERP(e, this.ui.adq.adqPadrao)).vendas : null; },
  async lerArquivoAdq(tipo, files) {
    const msgs = [];
    for (const file of files) {
      try {
        const f = await LeitorArquivosAdq.ler(tipo, file);
        await this.chavesArqAdq(tipo, f);
        if (!f.meta.n) { msgs.push(`${file.name}: nenhuma linha com data e valor.`); continue; }
        const notas = this.integrarArqAdq(tipo, f);
        msgs.push(`${f.nome}: ${f.meta.n} linha(s)${tipo === 'adq' ? ` · ${f.adquirente || 'adquirente não identificada'} · ${f.layoutRotulo}` : ''}${notas.length ? ` — ${notas.join('; ')}` : ''}`);
      } catch (e) { msgs.push(e.message); }
    }
    if (tipo === 'erp') await this.atualizarVendasAdq();
    if (msgs.length) UI.toast(msgs.join(' | '));
    App.render();
  },
  removerArqAdq(tipo, id) {
    const lista = tipo === 'erp' ? this._adqArq.erps : this._adqArq.adqs, i = lista.findIndex(f => f.id === id); if (i < 0) return;
    const [f] = lista.splice(i, 1); f.linhas = null; // solta as linhas para o coletor de lixo
    if (tipo === 'erp') { this._adqErpUnido = null; this.atualizarVendasAdq().then(() => App.render()); }
    UI.toast(`${f.nome} removido da memória.`); App.render();
  },
  async processarAdq(recalculo = false) {
    if (this._adqOcupado) return;
    const arq = this._adqArq; if (!this.temArqAdq()) return UI.toast('Nenhum arquivo em memória: envie o ERP e/ou os arquivos das adquirentes.');
    const semAdq = arq.adqs.find(f => !f.adquirente && f.mapa.adquirente == null); if (semAdq) return UI.toast(`Escolha a adquirente do arquivo ${semAdq.nome}.`);
    const prog = $('#adqProg'), bar = prog?.querySelector('i'), txt = $('#adqProgTxt'), btns = $$('[data-a="rt-adq-processar"], [data-a="rt-adq-recalcular"]');
    const status = (f, t) => { if (bar) bar.style.width = Math.round(f * 100) + '%'; if (txt) txt.textContent = t; };
    this._adqOcupado = true; if (prog) prog.hidden = false; btns.forEach(b => { b.disabled = true; b.classList.add('girando'); });
    const t0 = performance.now();
    try {
      if (recalculo) { status(0, 'Lendo as taxas contratuais atualizadas…'); try { await Repo.recarregar(AdqTaxas.COL); } catch (e) { console.warn('recarregar taxas', e); } }
      const adqs = arq.adqs.slice(), erp = this.erpUnido(); // retrato da memória: remover um arquivo durante o cálculo não afeta esta rodada
      const res = await MotorConciliacao.processar({ adqs, erp, adqPadrao: this.ui.adq.adqPadrao }, (f, fase) => status(f, `${fase}… ${Math.round(f * 100)}%`));
      status(1, 'Gravando resultados…');
      Sync.ocupado(true);
      try { await MotorConciliacao.gravar(res, [...arq.erps.map(f => f.nome), ...adqs.map(f => f.nome)]); } finally { Sync.ocupado(false); }
      const meses = Object.keys(res.meses).filter(m => /^\d{4}-\d{2}$/.test(m)).sort();
      if (!recalculo || !meses.includes(this.ui.adq.mes)) this.ui.adq.mes = meses.at(-1) || this.ui.adq.mes;
      this.ui.adq.pagina = 1;
      this._adqUltimo = { em: new Date().toISOString(), regras: AdqTaxas.regras().length, modo: res.modo, meses };
      UI.toast(`${recalculo ? 'Recalculado com as taxas atuais' : 'Auditoria concluída'} (${{ direto: 'ERP × banco', triplo: 'tripla', misto: 'tripla + direta' }[res.modo]}) em ${Math.round((performance.now() - t0) / 100) / 10}s: ${res.vendas} linhas do ERP${res.parcelasAdq ? `, ${res.parcelasAdq} registros das adquirentes` : ''} · ${meses.map(m => this.mesLabel(m)).join(', ')}.`);
    } catch (e) { console.error(e); UI.toast('Falha na auditoria: ' + (e.message || e)); }
    finally { this._adqOcupado = false; }
    App.render();
  },
  exportarAdq() {
    const cab = ['Tipo', 'Modo', 'Adquirente', 'Bandeira', 'Loja', 'Data venda', 'Data repasse/pagamento', 'Vencimento original', 'NSU/Autorização', 'Parcela', 'Modalidade', 'Vendas (líq.)', 'Prestações (líq.)', 'Esperado', 'Pago/recebido', 'Diferença', 'Detalhe'];
    const n = v => v == null ? '' : String(v).replace('.', ',');
    const linhas = (this._adqLista || []).map(e => [e.t === 'taxa' ? 'Divergência de taxa' : 'Furo de repasse', e.modo || '', AdqTaxas.nome(e.adq), e.band && e.band !== '*' ? e.band : '', e.loja ? this.nomeLoja(e.loja) : e.lojaTxt || '', e.dv || '', e.dp || '', e.venc || '', e.nsu || '', e.parc || '', ADQ_MODALIDADES[e.mod] || '', n(e.venda), n(e.prest), n(e.esp), n(e.real), n(e.dif), e.det || '']);
    Documento.baixarArquivo(`excecoes_adquirentes_${this.ui.adq.mes}.csv`, new Blob(['\uFEFF' + CSV.gerar([cab, ...linhas], ';')], { type: 'text/csv' }));
  },
  async acaoAdq(a, el) {
    const u = this.ui.adq;
    switch (a) {
      case 'rt-adq-sub': u.sub = el.dataset.v; return App.render();
      case 'rt-adq-tipo': u.tipo = el.dataset.v; u.pagina = 1; return App.render();
      case 'rt-adq-pag': u.pagina += Number(el.dataset.d); this.montarAdq(); return $('#adqTab')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
      case 'rt-adq-processar': return this.processarAdq(false);
      case 'rt-adq-recalcular': return this.processarAdq(true);
      case 'rt-adq-limpar': return this.removerArqAdq(el.dataset.t, Number(el.dataset.id));
      case 'rt-adq-liberar': this.liberarAdq(); UI.toast('Arquivos removidos da memória.'); return App.render();

      case 'rt-adq-modelo': { const t = el.dataset.t; return Documento.baixarArquivo(`modelo_${t === 'erp' ? 'vendas_erp' : 'liquidacao_adquirente'}.csv`, new Blob(['\uFEFF' + LeitorArquivosAdq.MODELOS[t].join('\r\n') + '\r\n'], { type: 'text/csv' })); }
      case 'rt-adq-regra-nova': return this.abrirAdqRegra(null, { adquirente: el.dataset.n || '' });
      case 'rt-adq-regra-editar': return this.abrirAdqRegra(el.dataset.id);
      case 'rt-adq-regra-del': { const r = AdqTaxas.norm(Repo.get(AdqTaxas.COL, el.dataset.id)); if (!(await UI.confirmar('Remover regra', `Remover a regra ${esc(AdqTaxas.rotulo(r.adquirente, r.bandeira))}?`, 'Remover', true))) return; return AdqTaxas.remover(el.dataset.id); }
