        if (!(await UI.confirmar(novo === 'Inativo' ? 'Inativar' : 'Reativar', `${novo === 'Inativo' ? 'Inativar' : 'Reativar'} ${t === 'seguro' ? 'a apólice' : 'o contrato'} <b>${esc(ContratosLocacao.contraparte(c) || '')}</b> · ${esc(ContratosLocacao.rotuloLoja(c))}${c.data_vencimento ? ` (vence ${Fmt.data(c.data_vencimento)})` : ''}?${novo === 'Inativo' ? ' Sai dos radares, mas o histórico fica guardado.' : ''}`, novo === 'Inativo' ? 'Inativar' : 'Reativar', novo === 'Inativo'))) return;
        return ContratosLocacao.alterarStatus(c.id, novo);
      }
      case 'ct-pag': u.pagina += Number(el.dataset.d); this.montarLista(); return $('#ctTabela')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
      case 'ct-radar-todos': u.radarTodos = !u.radarTodos; return App.render();
    }
  },
  mudanca(a, el) { if (a === 'ct-filtro') { this.ui[el.dataset.k] = el.value; this.ui.pagina = 1; return App.render(); } },
  entrada(a, el) { if (a === 'ct-busca') { this.ui.busca = el.value; this.ui.pagina = 1; App.render(); } },
};
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.rd-row[data-a], .seg-alertas li[data-a]')) { e.preventDefault(); e.target.click(); } });

/* =====================================================================
   MÓDULO 3 — MOTOR DE ALUGUEL (fixo × percentual) e PROJEÇÃO DE CUSTOS DE OCUPAÇÃO
   Camadas:
     6 Serviços → MotorAluguel   (vendas previstas no FCX × % do contrato; sincroniza a provisão no FCX)
     7 UI       → ProjecaoOcupacao (aba do Módulo 3 · Contratos de Locação e Outros)

   REGRA: aluguel do mês = MAIOR entre o aluguel mínimo (contrato.valor_atual) e o aluguel
          variável (vendas previstas da loja no mês × contrato.percentual_faturamento).

   VENDAS PREVISTAS DA LOJA: o FCX projeta as vendas da REDE (meta comercial do mês, Parâmetro 1).
     vendas da loja = meta comercial do FCX × participação da loja nas vendas (%)
     • participação: config/participacao_vendas.porLoja (editável); lojas sem valor dividem o
       restante em partes iguais (marcadas como "estimada");
     • ajuste manual do mês: aluguel_projecoes/<AAAA-MM>.vendasManuais[lojaId] (prevalece).

   SINCRONIZAÇÃO COM O FCX (Módulo 4), meses do atual até +3:
     O FCX já tem linhas de aluguel por loja (às vezes divididas entre vários locadores). O motor
     não altera essas linhas: ele mantém UMA linha própria por loja/mês (id mtr-alg-<mês>-<centro>)
     com o valor que falta para o total de aluguel da loja no mês chegar ao Valor Final Projetado.
       • sem nenhuma linha de aluguel da loja no mês → a linha do motor leva o valor final inteiro;
       • linhas já lançadas ≥ valor final → a linha do motor é removida (nada a complementar).
     Contas: 4.10.06 (rua) · 4.10.07.01 (shopping) · 4.10.07.05 (complemento percentual em shopping).
   ===================================================================== */
const ALUGUEL_CONTAS = { rua: '4.10.06', shopping: '4.10.07.01', percentual: '4.10.07.05' };
const ALUGUEL_CONTAS_PADRAO = { '4.10.06': '4.10.06 – (-) Aluguel de Loja de Rua', '4.10.07.01': '4.10.07.01 – Aluguel Mensal Shopping', '4.10.07.05': '4.10.07.05 – Aluguel Percentual' };
const MOTOR_ALG_PREFIXO = 'mtr-alg-';
const ALG_POR_PAGINA = 25;

/* ============================ 6. SERVIÇOS ============================ */
const MotorAluguel = {
  r2: n => Math.round((Number(n) + Number.EPSILON) * 100) / 100,
  mesAtual: () => Datas.hojeISO().slice(0, 7),
  somaMes(mes, n) { const [y, m] = mes.split('-').map(Number), d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); },
  meses() { return [-1, 0, 1, 2, 3, 4, 5].map(i => this.somaMes(this.mesAtual(), i)); },
  mesesSync() { return [0, 1, 2, 3].map(i => this.somaMes(this.mesAtual(), i)); },

  /** Participação de cada loja ativa nas vendas da rede (%, soma 100). */
  participacoes() {
    const ativas = Repo.todos('lojas').filter(l => l.ativa), cfg = Repo.get('config', 'participacao_vendas')?.porLoja || {};
    const expl = ativas.filter(l => cfg[l.id] != null && cfg[l.id] !== ''), resto = Math.max(0, 100 - expl.reduce((a, l) => a + Number(cfg[l.id]), 0));
    const sem = ativas.filter(l => !expl.includes(l)), cada = sem.length ? resto / sem.length : 0;
    const mapa = {}, estimadas = new Set();
    expl.forEach(l => { mapa[l.id] = Number(cfg[l.id]); });
    sem.forEach(l => { mapa[l.id] = cada; estimadas.add(l.id); });
    return { mapa, estimadas, soma: Object.values(mapa).reduce((a, v) => a + v, 0), explicitas: expl.length };
  },
  /** Código do centro no formato do FCX ("2.05.014 – 014 - SHOPPING TACARUNA I"). */
  centroFCX(cc, api) { return api.centros().find(x => x.split('–')[0].trim() === cc.codigo) || `${cc.codigo} – ${cc.nome}`; },
  contaFCX(prefixo, api) { return api.contas().find(x => x.split('–')[0].trim() === prefixo) || ALUGUEL_CONTAS_PADRAO[prefixo]; },
  idLinha(mes, cc) { return `${MOTOR_ALG_PREFIXO}${mes}-${cc.codigo.replace(/\W/g, '')}`; },

  /**
   * Cálculo do mês. Retorna null enquanto o motor do FCX não estiver pronto.
   * linhas: { contrato, cc, loja, vendas{valor,origem,pct,estimada}, minimo, pct, variavel, final, acima,
   *           fcx{provisionado, linhas[], motor, complemento}, acao }
   */
  calcular(mes, api = FCX.api()) {
    if (!api) return null;
    const meta = api.vendasPrevistas(mes), part = this.participacoes(), proj = Repo.get('aluguel_projecoes', mes) || {};
    const saidasMes = api.saidas().filter(s => s.date && s.date.startsWith(mes));
    const fimMes = Datas.iso(new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0));
    const linhas = ContratosLocacao.ativos().filter(c => !c.data_inicio || c.data_inicio <= fimMes).map(c => {
      const cc = RH.get('centros', c.loja_id); if (!cc) return null;
      const loja = ContratosLocacao.lojaDoCentro(cc);
      const manual = loja ? proj.vendasManuais?.[loja.id] : null;
      const pctLoja = loja ? part.mapa[loja.id] || 0 : 0;
      const vendas = manual != null && manual !== '' ? { valor: Number(manual), origem: 'manual' } : { valor: this.r2(meta * pctLoja / 100), origem: 'rateio', pct: pctLoja, estimada: loja ? part.estimadas.has(loja.id) : true };
      const minimo = Number(c.valor_atual) || 0, pct = Number(c.percentual_faturamento) || 0;
      const variavel = this.r2(vendas.valor * pct / 100), final = this.r2(Math.max(minimo, variavel));
      // provisões de aluguel já lançadas no FCX para a loja no mês (fora a linha do motor)
      const doCentro = saidasMes.filter(s => (s.centro || '').split('–')[0].trim() === cc.codigo && Object.values(ALUGUEL_CONTAS).includes((s.conta || '').split('–')[0].trim()));
      const motor = doCentro.find(s => String(s.id).startsWith(MOTOR_ALG_PREFIXO)) || null, outras = doCentro.filter(s => s !== motor);
      const provisionado = this.r2(outras.reduce((a, s) => a + (Number(s.valor) || 0), 0));
      const complemento = this.r2(final - provisionado);
      return { contrato: c, cc, loja, vendas, minimo, pct, variavel, final, acima: pct > 0 && variavel > minimo,
        fcx: { provisionado, linhas: outras, motor, complemento: complemento > 0.009 ? complemento : 0, sobra: complemento < -0.009 ? -complemento : 0 } };
    }).filter(Boolean).sort((a, b) => (a.cc.nome || '').localeCompare(b.cc.nome || '', 'pt-BR', { numeric: true }));
    const t = k => this.r2(linhas.reduce((a, l) => a + l[k], 0));
    return { mes, meta, linhas, participacao: part, totais: { minimo: t('minimo'), final: t('final'), adicional: this.r2(t('final') - t('minimo')), acima: linhas.filter(l => l.acima).length, vendas: this.r2(linhas.reduce((a, l) => a + l.vendas.valor, 0)) } };
  },
  /** Linhas a gravar/remover no FCX para o mês (só a linha própria do motor, por loja). */
  plano(r, api) {
    const upserts = [], remover = [], hoje = Datas.hojeISO();
    const desejados = new Set();
    for (const l of r.linhas) {
      const id = this.idLinha(r.mes, l.cc); desejados.add(id);
      if (!l.fcx.complemento) { if (l.fcx.motor) remover.push(l.fcx.motor.id); continue; }
      const shopping = l.loja?.tipo === 'SHOPPING', temOutras = l.fcx.linhas.length > 0;
      const conta = this.contaFCX(shopping ? (temOutras ? ALUGUEL_CONTAS.percentual : ALUGUEL_CONTAS.shopping) : ALUGUEL_CONTAS.rua, api);
      let data = l.fcx.motor?.date || l.fcx.linhas.map(s => s.date).sort()[0] || `${r.mes}-05`;
      if (!l.fcx.motor && r.mes === hoje.slice(0, 7) && data < hoje) data = hoje; // provisão nova não nasce vencida
      upserts.push({ id, date: data, conta, centro: this.centroFCX(l.cc, api), tipo: 'previsto', valor: l.fcx.complemento, fornecedor: l.contrato.locador,
        obs: `Motor de Aluguel (Painel): final ${Fmt.brl(l.final)} = maior entre mínimo ${Fmt.brl(l.minimo)} e ${Fmt.pct(l.pct)} × vendas ${Fmt.brl(l.vendas.valor)}${temOutras ? ` · complemento sobre ${Fmt.brl(l.fcx.provisionado)} já lançados` : ''}` });
    }
    // linhas do motor de contratos que deixaram de existir/ficar ativos
    api.saidas().filter(s => s.date?.startsWith(r.mes) && String(s.id).startsWith(MOTOR_ALG_PREFIXO) && !desejados.has(s.id)).forEach(s => remover.push(s.id));
    return { upserts, remover };
  },
  _timer: null, _rodando: false, ultima: null,
  /** Automação: recalcula e grava no FCX (só o que mudou). Chamada após mudanças em contratos, participação, vendas ou no FCX. */
  agendar(motivo = 'automático') {
    if (!Auth.can('lojas.contratos.editar') || !Auth.can('fcx.editar')) return; // v14: grava no FCX só quem pode modificar o FCX
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.sincronizar(this.mesesSync(), motivo).catch(e => console.warn('Motor de aluguel:', e)), 1200);
  },
  async sincronizar(meses, motivo = 'manual') {
    if (this._rodando || !Auth.can('lojas.contratos.editar') || !Auth.can('fcx.editar')) return null;
    if (!Repo.prontas.has(ContratosLocacao.COL) || !Repo.prontas.has('lojas') || !Repo.prontas.has('rh_centros')) return null;
    const api = FCX.api(); if (!api) { FCX.montar(); return null; }
    this._rodando = true;
    try {
      const res = [];
      for (const mes of meses) {
        const r = this.calcular(mes, api); if (!r) continue;
        const p = this.plano(r, api), n = api.sincronizarSaidas(p.upserts, p.remover);
        res.push({ mes, alteradas: n, linhas: p.upserts.length, total: this.r2(p.upserts.reduce((a, s) => a + s.valor, 0)) });
        if (n) {
          const doc = Repo.get('aluguel_projecoes', mes) || {};
          const { id: _, ...x } = doc;
          await Repo.salvar('aluguel_projecoes', mes, { ...x, mes, sync: { em: new Date().toISOString(), por: Auth.id, motivo, linhasMotor: p.upserts.length, alteradas: n, valorMotor: res.at(-1).total, valorFinal: r.totais.final } },
            { modulo: 'lojas', rotulo: `Motor de aluguel · ${Retaguarda.mesLabel(mes)}`, detalhe: `${n} provisão(ões) de aluguel atualizada(s) no FCX (${motivo})` });
        }
      }
      this.ultima = { em: new Date(), res };
      return res;
    } finally { this._rodando = false; }
  },
};

/* ============================ 7. UI ============================ */
const ProjecaoOcupacao = {
  ui: { mes: '', pagina: 1, soAcima: false },
  _r: null,
  render() {
    if (!Contratos.pode()) return '';
    if (!['lojas', 'rh_centros', ContratosLocacao.COL, 'aluguel_projecoes'].every(c => Repo.prontas.has(c))) return '<div class="panel"><p class="muted">Carregando…</p></div>';
    const u = this.ui; if (!u.mes) u.mes = MotorAluguel.mesAtual();
    const r = MotorAluguel.calcular(u.mes); this._r = r;
    const ed = Auth.can('lojas.contratos.editar');
    const topo = `<div class="row between" style="margin-bottom:14px;align-items:flex-end;gap:12px">
      <div class="toolbar" style="margin:0;flex:1"><div class="field" style="max-width:240px"><label class="lbl" for="algMes">Mês</label><select id="algMes" data-a="alg-f" data-k="mes">${MotorAluguel.meses().map(m => `<option value="${m}" ${m === u.mes ? 'selected' : ''}>${Retaguarda.mesLabel(m)}${m === MotorAluguel.mesAtual() ? ' (atual)' : ''}</option>`).join('')}</select></div>
        <label class="check" style="padding-bottom:9px"><input type="checkbox" data-a="alg-acima" ${u.soAcima ? 'checked' : ''}> Só lojas com variável acima do mínimo</label></div>
      <div class="row">${ed ? `<button class="btn ghost" data-a="alg-participacao">Participação das lojas nas vendas</button><button class="btn sec" data-a="alg-sync">Sincronizar com o FCX</button>` : ''}</div></div>`;
    if (!r) { FCX.montar(); return topo + '<div class="panel"><p class="muted" style="margin:0">Lendo as vendas previstas no motor do FCX…</p></div>'; }
    const doc = Repo.get('aluguel_projecoes', u.mes), sync = doc?.sync, futuro = u.mes >= MotorAluguel.mesAtual(), passado = !futuro;
    const avisos = (!r.meta ? `<div class="note warn" style="margin-bottom:12px">O FCX não tem <b>meta comercial</b> para ${Retaguarda.mesLabel(u.mes)} (FCX → Gerenciar dados → Parâmetros). Sem vendas previstas, todas as lojas ficam no aluguel mínimo${ed ? ', a não ser que você informe as vendas da loja na tabela' : ''}.</div>` : '')
      + (r.participacao.explicitas === 0 && r.meta ? `<div class="note warn" style="margin-bottom:12px">A participação de cada loja nas vendas ainda não foi informada: a meta foi dividida igualmente entre as ${Object.keys(r.participacao.mapa).length} lojas ativas. Ajuste em “Participação das lojas nas vendas”.</div>` : '');
    const t = r.totais;
    const kpis = `<div class="grid g4" style="margin-bottom:16px">
      <div class="kpi"><div class="k">Vendas previstas (FCX)</div><div class="v mono">${Fmt.brl0(r.meta)}</div><div class="d">meta comercial da rede · ${Fmt.brl0(t.vendas)} nas lojas com contrato</div></div>
      <div class="kpi"><div class="k">Aluguel mínimo</div><div class="v mono">${Fmt.brl0(t.minimo)}</div><div class="d">${r.linhas.length} contrato(s) ativo(s)</div></div>
      <div class="kpi zona-kpi ${t.acima ? 'warn' : 'ok'}"><div class="k">Variável acima do mínimo</div><div class="v" style="color:var(${t.acima ? '--warn' : '--ink'})">${t.acima}</div><div class="d">adicional de ${Fmt.brl0(t.adicional)} sobre o mínimo</div></div>
      <div class="kpi"><div class="k">Valor final projetado</div><div class="v mono">${Fmt.brl0(t.final)}</div><div class="d">${passado ? 'mês encerrado: não sincroniza' : sync ? `FCX atualizado em ${Fmt.dataHora(sync.em)}` : 'ainda não sincronizado com o FCX'}</div></div></div>`;
    const tabela = r.linhas.length ? `<div class="panel"><h2>Projeção de custos de ocupação · ${Retaguarda.mesLabel(u.mes)}</h2>
        <p class="sub">Aluguel do mês = o maior entre o mínimo do contrato e o % contratual × vendas previstas. As linhas destacadas pagam pelo percentual. A coluna FCX mostra quanto já está lançado para a loja no mês e o que o motor provisiona.</p>
        <div class="tbl-wrap"><table id="algTabela" class="alg"><thead><tr><th>Filial</th><th class="num">Vendas previstas do mês</th><th class="num">Aluguel mínimo</th><th class="num">% contratual</th><th class="num">Valor variável</th><th class="num">Valor final projetado</th><th>FCX (Módulo 4)</th></tr></thead><tbody id="algBody"></tbody></table></div><div id="algPager"></div></div>`
      : `<div class="panel"><div class="empty">Nenhum contrato ativo. Cadastre os contratos (com o % sobre vendas, quando houver) na aba “Contratos e apólices” do Módulo 3.</div></div>`;
    return topo + avisos + kpis + tabela;
  },
  linhaHTML(l, ed, passado) {
    const v = l.vendas, f = l.fcx;
    const fcx = passado ? `<span class="hint">já lançados ${Fmt.brl(f.provisionado + (f.motor?.valor || 0))}</span>`
      : f.complemento ? `<span class="pill info">motor ${Fmt.brl(f.complemento)}</span><div class="cell-sub">${f.linhas.length ? `+ ${Fmt.brl(f.provisionado)} já lançados` : 'linha única do aluguel'}${f.motor && Math.abs(f.motor.valor - f.complemento) > 0.009 ? ' · a atualizar' : !f.motor ? ' · a criar' : ''}</div>`
      : f.sobra ? `<span class="pill neutral">coberto</span><div class="cell-sub">FCX tem ${Fmt.brl(f.provisionado)} (${Fmt.brl(f.sobra)} acima)</div>`
      : `<span class="pill ok">coberto</span><div class="cell-sub">${Fmt.brl(f.provisionado)} lançados</div>`;
    return `<tr class="${l.acima ? 'alg-acima' : ''}">
      <td><div class="cell-main">${esc(l.cc.nome)}</div><div class="cell-sub">${esc(l.loja?.tipo || '—')} · ${esc(l.contrato.locador)}</div></td>
      <td class="num">${ed ? `<input type="number" step="0.01" min="0" class="alg-vendas" id="algV_${l.loja?.id || l.cc.id}" value="${v.origem === 'manual' ? v.valor : ''}" placeholder="${Fmt.num(v.valor, 2)}" data-a="alg-vendas" data-l="${l.loja?.id || ''}" ${l.loja ? '' : 'disabled'} aria-label="Vendas previstas de ${esc(l.cc.nome)}">` : `<b>${Fmt.brl(v.valor)}</b>`}
        <div class="cell-sub">${v.origem === 'manual' ? 'informado para o mês' : !l.loja ? 'loja não encontrada no cadastro' : !l.loja.ativa ? 'loja inativa no cadastro: informe as vendas' : `${Fmt.pct(v.pct || 0, 2)} da meta${v.estimada ? ' (estimada)' : ''}`}</div></td>
      <td class="num">${Fmt.brl(l.minimo)}</td><td class="num">${l.pct ? Fmt.pct(l.pct, 2) : '<span class="hint">só fixo</span>'}</td>
      <td class="num">${l.pct ? `<b style="color:var(${l.acima ? '--warn' : '--ink-soft'})">${Fmt.brl(l.variavel)}</b>` : '<span class="hint">—</span>'}${l.acima ? `<div class="cell-sub" style="color:var(--warn)">+${Fmt.brl(l.variavel - l.minimo)} sobre o mínimo</div>` : ''}</td>
      <td class="num"><b>${Fmt.brl(l.final)}</b><div class="cell-sub">${l.acima ? '<span class="pill warn">percentual</span>' : 'mínimo'}</div></td>
      <td>${fcx}</td></tr>`;
  },
  montar() {
    const tb = $('#algBody'), r = this._r; if (!tb || !r) return;
    const u = this.ui, lista = u.soAcima ? r.linhas.filter(l => l.acima) : r.linhas, ed = Auth.can('lojas.contratos.editar'), passado = u.mes < MotorAluguel.mesAtual();
    const pags = Math.max(1, Math.ceil(lista.length / ALG_POR_PAGINA)); u.pagina = Math.min(Math.max(1, u.pagina), pags);
    const i0 = (u.pagina - 1) * ALG_POR_PAGINA, fatia = lista.slice(i0, i0 + ALG_POR_PAGINA);
    const tpl = document.createElement('template'); tpl.innerHTML = fatia.map(l => this.linhaHTML(l, ed, passado)).join('') || '<tr><td colspan="7"><div class="empty">Nenhuma loja com variável acima do mínimo neste mês.</div></td></tr>';
    const frag = document.createDocumentFragment(); frag.appendChild(tpl.content); tb.replaceChildren(frag);
    UI.rotularTabelas(tb.closest('.tbl-wrap'));
    const pg = $('#algPager');
    if (pg) pg.innerHTML = lista.length > ALG_POR_PAGINA ? `<div class="row between" style="margin-top:10px"><span class="hint">Linhas ${i0 + 1}–${i0 + fatia.length} de ${lista.length}</span><div class="row"><button class="btn sec sm" data-a="alg-pag" data-d="-1" ${u.pagina <= 1 ? 'disabled' : ''}>‹ Anterior</button><span class="hint">Página ${u.pagina} de ${pags}</span><button class="btn sec sm" data-a="alg-pag" data-d="1" ${u.pagina >= pags ? 'disabled' : ''}>Próxima ›</button></div></div>` : '';
  },
  afterRender() {
    this.montar();
    // automação: ao abrir/atualizar a projeção de um mês aberto, grava no FCX o que estiver diferente
    if (this._r && this.ui.mes >= MotorAluguel.mesAtual()) MotorAluguel.agendar('projeção aberta');
  },
  abrirParticipacao() {
    const p = MotorAluguel.participacoes(), cfg = Repo.get('config', 'participacao_vendas')?.porLoja || {};
    const lojas = Repo.todos('lojas').filter(l => l.ativa).sort((a, b) => a.codigo.localeCompare(b.codigo));
    const temFat = lojas.some(l => Number(l.faturamentoMedio) > 0);
    UI.modal({
      titulo: 'Participação das lojas nas vendas', largo: true,
      corpo: `<p class="hint" style="margin-top:0">O FCX projeta as vendas da rede (meta comercial). Aqui você define quanto cada loja representa (%). Lojas em branco dividem igualmente o que faltar para 100%.</p>

  },
};

/* =====================================================================
   SERVIÇOS FINANCEIROS — Módulo 4 (Retaguarda Financeira)
   Camada 6 (Serviços): lógica pura, sem tela. A UI fica em retaguarda.js.
     • OFX ........ leitura de extratos (OFX 1.x SGML e 2.x XML)
     • Contas ..... vínculo "de-para" entre o OFX e as contas cadastradas
     • DFC ........ classificação das transações e base de KPIs da DFC
     • IEO ........ Índice de Eficiência Operacional das lojas (100 pontos/mês)
     • Laudo ...... prompt e montagem do Laudo de Performance por IA
   Modelos de dados (coleções no banco):
     contasBancarias/<id>                 { apelido, banco, bancoNome, agencia, conta, digito, tipo, lojaId, ofxAcctId, ativa }
     extratos/<contaId>_<AAAA-MM>_<n>     { contaId, mes, parte, transacoes:[{id, data, valor, tipo, hist, doc, cat?}], saldo?, arquivos[] }
     dfc/<AAAA-MM>                        { mes, entradas, saidas, liquido, porGrupo{}, porCategoria{}, porConta{}, porDia{}, semRegra, atualizadoEm }
     config/dfc                           { regras:[{id, termos[], sentido, categoria}] }
     config/ieo                           { pontosIniciais, faixas{verde,vermelha}, prazoJustificativaDias, reincidenciaMinima, tipos[] }
     ieo_ocorrencias/<AAAA-MM>_<loja>     { mes, lojaId, itens:[{id, data, tipoId, descricao, lancadoPor}] }
     ieo_fechamentos/<AAAA-MM>            { mes, matriz, ranking[], fechadoEm, fechadoPor }
     ieo_laudos/<AAAA-MM>_<loja>          { texto, origem:'ia'|'automatico', dados, geradoEm, geradoPor }
     alertas/<AAAA-MM>_<loja>             { tipo:'ieo_vermelha', lojaId, mes, pontos, supervisor, criadoEm, cienteEm?, cientePor? }
   ===================================================================== */

/* ============================ OFX ============================ */
const OFX = {
  /** Decodifica o arquivo: UTF-8; se vier com caracteres inválidos, Windows-1252 (padrão de muitos bancos brasileiros). */
  decodificar(buf) {
    const utf = new TextDecoder('utf-8').decode(buf);
    return utf.includes('\uFFFD') ? new TextDecoder('windows-1252').decode(buf) : utf;
  },
  /** Valor de uma tag folha — funciona em SGML (sem fechamento) e XML. */
  tag(bloco, nome) {
    const m = bloco.match(new RegExp('<' + nome + '>\\s*([^<\\r\\n]*)', 'i'));
    return m ? m[1].trim() : '';
  },
  blocos(txt, nome) {
    const re = new RegExp('<' + nome + '>([\\s\\S]*?)</' + nome + '>', 'gi'); const out = []; let m;
    while ((m = re.exec(txt))) out.push(m[1]);
    return out;
  },
  /** 20260915120000[-3:BRT] → 2026-09-15 */
  data(v) { const m = String(v || '').match(/^(\d{4})(\d{2})(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : null; },
  /** Valores com ponto ou vírgula decimal ("-1.234,56" ou "-1234.56"). */
  valor(v) {
    let s = String(v || '').trim().replace(/\s/g, '');
    if (s.includes(',') && s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
    const n = Number(s); return isNaN(n) ? null : Math.round(n * 100) / 100;
  },
  hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); },

  /**
   * Lê o OFX e devolve um extrato por conta:
   * [{ conta:{bankId, branchId, acctId, acctType, cartao}, moeda, periodo:{inicio,fim}, saldo:{valor,data}, transacoes:[…] }]
   */
  ler(texto) {
    const corpo = texto.slice(Math.max(0, texto.search(/<OFX>/i)));
    if (!/<OFX>/i.test(corpo)) throw new Error('O arquivo não parece ser um OFX (tag <OFX> não encontrada).');
    const extratos = [];
    const processar = (bloco, cartao) => {
      const contaBloco = (cartao ? this.blocos(bloco, 'CCACCTFROM') : this.blocos(bloco, 'BANKACCTFROM'))[0] || bloco;
      const conta = { bankId: this.tag(contaBloco, 'BANKID'), branchId: this.tag(contaBloco, 'BRANCHID'), acctId: this.tag(contaBloco, 'ACCTID'), acctType: this.tag(contaBloco, 'ACCTTYPE') || (cartao ? 'CREDITCARD' : ''), cartao };
      const lista = this.blocos(bloco, 'BANKTRANLIST')[0] || bloco;
      const vistos = {};
      const transacoes = this.blocos(lista, 'STMTTRN').map(t => {
        const data = this.data(this.tag(t, 'DTPOSTED')), valor = this.valor(this.tag(t, 'TRNAMT'));
        const memo = this.tag(t, 'MEMO'), nome = this.tag(t, 'NAME');
        let id = this.tag(t, 'FITID');
        if (!id) { const base = `${data}|${valor}|${memo}|${nome}`; vistos[base] = (vistos[base] || 0) + 1; id = 'h' + this.hash(base + '#' + vistos[base]); }
        return { id, data, valor, tipo: this.tag(t, 'TRNTYPE').toUpperCase(), hist: [nome, memo].filter((x, i, a) => x && a.indexOf(x) === i).join(' · ').slice(0, 120), doc: this.tag(t, 'CHECKNUM') || this.tag(t, 'REFNUM') };
      }).filter(t => t.data && t.valor != null && t.valor !== 0);
      const lb = this.blocos(bloco, 'LEDGERBAL')[0];
      extratos.push({
        conta, moeda: this.tag(bloco, 'CURDEF') || 'BRL',
        periodo: { inicio: this.data(this.tag(lista, 'DTSTART')), fim: this.data(this.tag(lista, 'DTEND')) },
        saldo: lb ? { valor: this.valor(this.tag(lb, 'BALAMT')), data: this.data(this.tag(lb, 'DTASOF')) } : null,
        transacoes,
      });
    };
    this.blocos(corpo, 'STMTRS').forEach(b => processar(b, false));
    this.blocos(corpo, 'CCSTMTRS').forEach(b => processar(b, true));
    if (!extratos.length) throw new Error('Nenhum extrato (STMTRS) encontrado no arquivo.');
    return extratos;
  },
};

/* ======================= CONTAS (de-para) ======================= */
const BANCOS = [
  ['001', 'Banco do Brasil'], ['004', 'Banco do Nordeste (BNB)'], ['033', 'Santander'], ['041', 'Banrisul'], ['077', 'Inter'], ['104', 'Caixa Econômica Federal'],
  ['208', 'BTG Pactual'], ['237', 'Bradesco'], ['260', 'Nubank'], ['336', 'C6 Bank'], ['341', 'Itaú Unibanco'], ['422', 'Safra'],
  ['748', 'Sicredi'], ['756', 'Sicoob'], ['290', 'PagBank'], ['380', 'PicPay'], ['403', 'Cora'], ['197', 'Stone'],
];
const ContasBancarias = {
  dig: s => String(s ?? '').replace(/\D/g, ''),
  semZero: s => String(s ?? '').replace(/\D/g, '').replace(/^0+/, ''),
  rotulo(c) { return c ? `${c.apelido || c.bancoNome || c.banco} · Ag ${c.agencia || '—'} · CC ${c.conta}${c.digito ? '-' + c.digito : ''}` : '—'; },
  /**
   * Encontra a conta cadastrada que corresponde ao OFX. Ordem de prioridade:
   * 1) identificador OFX informado manualmente (ACCTID exato);
   * 2) banco + conta (com ou sem dígito, aceitando agência/zeros à esquerda no ACCTID) + agência quando o OFX trouxer.
   */
  vincular(ofxConta, contas) {
    const a = this.semZero(ofxConta.acctId), b = this.semZero(ofxConta.bankId), ag = this.semZero(ofxConta.branchId);
    const ativas = contas.filter(c => c.ativa !== false);
    const manual = ativas.find(c => c.ofxAcctId && this.semZero(c.ofxAcctId) === a);
    if (manual) return { conta: manual, criterio: 'identificador OFX' };
    let melhor = null;
    for (const c of ativas) {
      if (b && this.semZero(c.banco) !== b) continue;
      const comDv = this.semZero((c.conta || '') + (c.digito || '')), semDv = this.semZero(c.conta);
      const contaOk = a === comDv || a === semDv || (comDv.length >= 5 && a.endsWith(comDv)) || (semDv.length >= 5 && a.endsWith(semDv) && a.length - semDv.length <= 6);
      if (!contaOk) continue;
      const agOk = !ag || !c.agencia || this.semZero(c.agencia) === ag || ag.startsWith(this.semZero(c.agencia));
      if (!agOk) continue;
      const pontos = (a === comDv ? 3 : a === semDv ? 2 : 1) + (ag && c.agencia ? 1 : 0);
      if (!melhor || pontos > melhor.pontos) melhor = { conta: c, pontos, criterio: 'banco + agência + conta' };
    }
    return melhor ? { conta: melhor.conta, criterio: melhor.criterio } : null;
  },
  /** Sugestão de cadastro a partir do OFX (usada quando a conta ainda não existe). */
  sugestao(ofxConta) {
    const banco = this.dig(ofxConta.bankId).slice(-3).padStart(3, '0'), acct = String(ofxConta.acctId || '');
    const m = acct.match(/^(.*?)[-\s]?(\w)$/);
    const bancoNome = (BANCOS.find(x => x[0] === banco) || [])[1] || '';
    return { banco, bancoNome, agencia: this.dig(ofxConta.branchId), conta: m && acct.includes('-') ? this.dig(m[1]) : this.dig(acct), digito: m && acct.includes('-') ? m[2] : '', ofxAcctId: acct, tipo: ofxConta.cartao ? 'Cartão de crédito' : 'Conta corrente', apelido: bancoNome };
  },
};

  { id: 'r-ocupacao', termos: ['ALUGUEL', 'CONDOMINIO', 'SHOPPING', 'FUNDO DE PROMOCAO', 'IPTU'], sentido: 'S', categoria: 'pag_ocupacao' },
  { id: 'r-utilidades', termos: ['NEOENERGIA', 'ENERGISA', 'EQUATORIAL', 'COMPESA', 'CAGEPA', 'CAERN', 'CASAL', 'EMBASA', 'CLARO', 'VIVO', 'TIM ', 'OI '], sentido: 'S', categoria: 'pag_utilidades' },
  { id: 'r-admin', termos: ['CONTABIL', 'ASSESSORIA', 'HONORARIO', 'SISTEMA', 'SOFTWARE', 'LICENCA', 'CONSULTORIA', 'SEGURO'], sentido: 'S', categoria: 'pag_administrativas' },

];
const DFC = {
  cat: id => DFC_CATEGORIAS.find(c => c.id === id),
  norm: s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase(),
  regras() { return (typeof Repo !== 'undefined' && Repo.get('config', 'dfc')?.regras) || DFC_REGRAS_PADRAO; },
  /** Categoria de uma transação: manual (cat) > primeira regra que casar > padrão pelo sinal. */
  classificar(t, regras = this.regras()) {
    if (t.cat) return { categoria: t.cat, origem: 'manual' };
    const h = this.norm(t.hist), sentido = t.valor >= 0 ? 'E' : 'S';
    for (const r of regras) {
      if (r.sentido !== '*' && r.sentido !== sentido) continue;
      if ((r.termos || []).some(x => x && h.includes(this.norm(x)))) return { categoria: r.categoria, origem: 'regra', regra: r.id };
    }
    return { categoria: sentido === 'E' ? 'rec_outros' : 'pag_outros', origem: 'padrão' };
  },
  /**
   * Consolida transações (já com contaId) em KPIs da DFC.
   * Transferências entre contas próprias ficam fora de entradas/saídas.
   */
  consolidar(transacoes, regras = this.regras()) {
    const r = { entradas: 0, saidas: 0, liquido: 0, transferencias: 0, semRegra: 0, n: 0, porGrupo: {}, porCategoria: {}, porConta: {}, porDia: {} };
    Object.keys(DFC_GRUPOS).forEach(g => { r.porGrupo[g] = { entradas: 0, saidas: 0, liquido: 0 }; });
    for (const t of transacoes) {
      const c = this.classificar(t, regras), cat = this.cat(c.categoria) || this.cat(t.valor >= 0 ? 'rec_outros' : 'pag_outros');
      if (c.origem === 'padrão') r.semRegra++;
      const pc = r.porCategoria[cat.id] ||= { valor: 0, n: 0 }; pc.valor += t.valor; pc.n++;
      const g = r.porGrupo[cat.grupo]; if (t.valor >= 0) g.entradas += t.valor; else g.saidas += -t.valor; g.liquido += t.valor;
      r.n++;
      if (cat.grupo === 'TRANSFERENCIA') { r.transferencias += Math.abs(t.valor); continue; }
      if (t.valor >= 0) r.entradas += t.valor; else r.saidas += -t.valor;
      r.liquido += t.valor;
      const pk = r.porConta[t.contaId] ||= { entradas: 0, saidas: 0 }; if (t.valor >= 0) pk.entradas += t.valor; else pk.saidas += -t.valor;
      const d = r.porDia[t.data] ||= { entradas: 0, saidas: 0 }; if (t.valor >= 0) d.entradas += t.valor; else d.saidas += -t.valor;
    }
    const r2 = n => Math.round(n * 100) / 100;
    ['entradas', 'saidas', 'liquido', 'transferencias'].forEach(k => r[k] = r2(r[k]));
    Object.values(r.porGrupo).forEach(g => { g.entradas = r2(g.entradas); g.saidas = r2(g.saidas); g.liquido = r2(g.liquido); });
    Object.values(r.porCategoria).forEach(c => { c.valor = r2(c.valor); });
    return r;
  },
};

/* ============================ IEO ============================ */
/* Índice de Eficiência Operacional: cada loja começa o mês com 100 pontos. */
const IEO_PADRAO = {
  pontosIniciais: 100,
  faixas: { verde: 85, vermelha: 60 },   // ≥ 85 verde · 60 a 84,99 amarela · < 60 vermelha
  prazoJustificativaDias: 3,              // falta sem justificativa após N dias → "Atraso na justificativa"
  reincidenciaMinima: 3,                  // a partir da 3ª falta do mesmo caixa no mês, vale a dedução de reincidência
  tipos: [
    { id: 'falta_isolada', nome: 'Falta de caixa (numerário) isolada', pontos: -10, origem: 'faltas', ativo: true },
    { id: 'quebra_reincidente', nome: 'Quebra de caixa reincidente (3x ou mais)', pontos: -20, origem: 'faltas_reincidencia', ativo: true },
    { id: 'div_recebimentos', nome: 'Divergência de recebimentos (Cartão/Credsystem)', pontos: -5, origem: 'credsystem', ativo: true },
    { id: 'erro_pix', nome: 'Erro de lançamento ou baixa de PIX', pontos: -5, origem: 'manual', ativo: true },
    { id: 'atraso_justificativa', nome: 'Atraso na justificativa processual', pontos: -2, origem: 'faltas_atraso', ativo: true },
  ],
};
const IEO_ORIGENS = {
  manual: 'Lançamento manual',
  faltas: 'Automática · faltas de caixa (1ª e 2ª do caixa no mês)',
  faltas_reincidencia: 'Automática · faltas a partir da reincidência',
  credsystem: 'Automática · divergências da conciliação Credsystem',
  faltas_atraso: 'Automática · falta sem justificativa após o prazo',
};
const IEO = {
  matriz() { const s = typeof Repo !== 'undefined' && Repo.get('config', 'ieo'); return s && s.tipos ? { ...IEO_PADRAO, ...s, faixas: { ...IEO_PADRAO.faixas, ...(s.faixas || {}) } } : IEO_PADRAO; },
  zona(p, m = this.matriz()) { return p >= m.faixas.verde ? 'verde' : p < m.faixas.vermelha ? 'vermelha' : 'amarela'; },
  ZONAS: { verde: { rotulo: 'Zona Verde', desc: 'Excelência / Conformidade', cls: 'ok' }, amarela: { rotulo: 'Zona Amarela', desc: 'Atenção / Monitoramento', cls: 'warn' }, vermelha: { rotulo: 'Zona Vermelha', desc: 'Estado crítico', cls: 'bad' } },

  /**
   * Motor de pontuação (função pura).
   * @param mes        'AAAA-MM'
   * @param lojas      [{id, codigo, nome, ativa}]
   * @param faltas     itens de faltas [{lojaId, data, tipo, valor, status, justificativa, caixa}]
   * @param credsystem linhas conciliadas [{lojaId, data, st, dif}]
   * @param ocorrencias lançamentos manuais [{lojaId, data, tipoId, descricao}]
   * @returns ranking [{lojaId, pontos, zona, posicao, deducoes[], resumo{tipoId:{n,pontos}}}]
   */
  calcular({ mes, lojas, faltas = [], credsystem = [], ocorrencias = [], matriz = this.matriz(), hoje = new Date().toISOString().slice(0, 10) }) {
    const tipos = Object.fromEntries(matriz.tipos.filter(t => t.ativo !== false).map(t => [t.id, t]));
    const porOrigem = o => matriz.tipos.find(t => t.ativo !== false && t.origem === o);
    const res = {};
    lojas.forEach(l => { res[l.id] = { lojaId: l.id, codigo: l.codigo, nome: l.nome, deducoes: [] }; });
    const add = (lojaId, tipo, data, detalhe, ref) => { if (tipo && res[lojaId]) res[lojaId].deducoes.push({ tipoId: tipo.id, nome: tipo.nome, pontos: Number(tipo.pontos) || 0, data, detalhe, ref, origem: tipo.origem }); };

    // 1) Faltas de caixa: 1ª e 2ª do caixa no mês = isolada; a partir da N-ésima = reincidente. Sobras e abonadas não pontuam.
    const tIsolada = porOrigem('faltas'), tReinc = porOrigem('faltas_reincidencia'), tAtraso = porOrigem('faltas_atraso');
    const doMes = faltas.filter(f => f.data && f.data.startsWith(mes) && f.tipo !== 'Sobra' && f.status !== 'Abonada').sort((a, b) => a.data.localeCompare(b.data));
    const contagem = {};
    for (const f of doMes) {
      const k = f.lojaId + '|' + (f.caixa?.id || String(f.caixa?.nome || '').toUpperCase());
      const n = (contagem[k] = (contagem[k] || 0) + 1);
      const reinc = n >= (matriz.reincidenciaMinima || 3);
      add(f.lojaId, reinc && tReinc ? tReinc : tIsolada, f.data, `${reinc ? `${n}ª quebra do caixa` : 'Falta'} ${f.caixa?.nome || ''} · R$ ${Number(f.valor).toFixed(2).replace('.', ',')}`, f.id);
      // 2) Atraso na justificativa
      if (tAtraso && !String(f.justificativa || '').trim()) {
        const dias = Math.floor((Date.parse(hoje) - Date.parse(f.data)) / 864e5);
        if (dias > (matriz.prazoJustificativaDias ?? 3)) add(f.lojaId, tAtraso, f.data, `Falta de ${f.caixa?.nome || 'caixa'} sem justificativa há ${dias} dias`, f.id);
      }
    }
    // 3) Divergências de recebimento (Credsystem)
    const tDiv = porOrigem('credsystem');
    credsystem.filter(l => l.data && l.data.startsWith(mes) && l.st === 'div').forEach(l => add(l.lojaId, tDiv, l.data, `Divergência Credsystem de R$ ${l.dif.toFixed(2).replace('.', ',')}`, l.data));
    // 4) Ocorrências manuais (qualquer tipo da matriz)
    ocorrencias.filter(o => o.data && o.data.startsWith(mes)).forEach(o => add(o.lojaId, tipos[o.tipoId], o.data, o.descricao || '', o.id));

    const lista = Object.values(res).map(r => {
      const total = r.deducoes.reduce((a, d) => a + d.pontos, 0);
      const pontos = Math.max(0, Math.round((matriz.pontosIniciais + total) * 100) / 100);
      const resumo = {}; r.deducoes.forEach(d => { const x = resumo[d.tipoId] ||= { nome: d.nome, n: 0, pontos: 0, unit: d.pontos }; x.n++; x.pontos += d.pontos; });
      return { ...r, deducoes: r.deducoes.sort((a, b) => a.data.localeCompare(b.data)), pontos, zona: this.zona(pontos, matriz), resumo };
    }).sort((a, b) => b.pontos - a.pontos || a.deducoes.length - b.deducoes.length || a.codigo.localeCompare(b.codigo));
    lista.forEach((r, i) => { r.posicao = i + 1; });
    return lista;
  },
};

/* ============================ LAUDO (IA) ============================ */
/**
 * Prompt interno do Motor de Laudos. A IA recebe SOMENTE os dados do ciclo
 * (JSON abaixo) e redige o Laudo de Performance em texto corrido.
 */
const LAUDO_PROMPT = `Você é o auditor de retaguarda financeira da Esposende, rede de lojas de calçados do Nordeste.
Redija o LAUDO DE PERFORMANCE mensal de uma loja a partir do Índice de Eficiência Operacional (IEO).

Regras do IEO: toda loja inicia o mês com a pontuação inicial informada; cada ocorrência da matriz deduz pontos.
Zonas: Verde (Excelência/Conformidade) a partir do limite verde; Amarela (Atenção/Monitoramento) abaixo dele; Vermelha (Estado crítico) abaixo do limite vermelho.

Como escrever:
- Português do Brasil, texto corrido em 2 ou 3 parágrafos, de 110 a 200 palavras. Sem títulos, listas, tabelas, markdown ou emojis.
- 1º parágrafo: pontuação inicial, cada tipo de dedução com quantidade e pontos (ex.: "2 deduções por falhas no PIX (-10)"), pontuação final e zona.
- 2º parágrafo: posição no ranking entre o total de lojas, movimento em relação ao mês anterior quando houver, e comparação com a média da rede.
- 3º parágrafo (se houver dedução): uma recomendação objetiva focada na causa que mais tirou pontos. Se não houver deduções, reconheça a conformidade.
- Use somente os números fornecidos; não invente datas, valores, nomes ou causas. Números no padrão brasileiro (vírgula decimal).
- Tom profissional e direto, adequado para a supervisão regional e para o gerente da loja.
Responda apenas com o texto do laudo.`;

const Laudo = {
  /** Estrutura os dados do ciclo para a IA (e para o laudo automático). */
  dados(r, { ranking, anterior, mes, loja, matriz = IEO.matriz() }) {
    const ant = anterior ? anterior.find(x => x.lojaId === r.lojaId) : null;
    const media = ranking.reduce((a, x) => a + x.pontos, 0) / (ranking.length || 1);
    const [y, m] = mes.split('-');
    return {
      loja: { codigo: r.codigo, nome: r.nome, tipo: loja?.tipo || '', supervisor: loja?.supervisor || '' },
      periodo: ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'][+m - 1] + ' de ' + y,
      pontosIniciais: matriz.pontosIniciais, pontosFinais: r.pontos,
      zona: IEO.ZONAS[r.zona].rotulo + ' — ' + IEO.ZONAS[r.zona].desc,
      limites: { verde: matriz.faixas.verde, vermelha: matriz.faixas.vermelha },
      posicao: r.posicao, totalLojas: ranking.length,
      posicaoAnterior: ant ? ant.posicao : null, pontosAnteriores: ant ? ant.pontos : null,
      mediaRede: Math.round(media * 10) / 10,
      deducoes: Object.entries(r.resumo).sort((a, b) => a[1].pontos - b[1].pontos).map(([id, x]) => ({ tipoId: id, tipo: x.nome, quantidade: x.n, pontosPorOcorrencia: x.unit, totalPontos: x.pontos })),
      exemplos: r.deducoes.slice(0, 8).map(d => `${d.data.split('-').reverse().join('/')}: ${d.nome} (${d.pontos}) — ${d.detalhe}`),
    };
  },
  prompt(d) { return LAUDO_PROMPT + '\n\nDADOS DO CICLO (JSON):\n' + JSON.stringify(d, null, 2); },
  /** Laudo automático (sem IA) — mesmo formato; usado como alternativa e pré-visualização. */
  local(d) {
    const n = v => String(v).replace('.', ',');
    const plural = (q, s, p) => q === 1 ? s : p;
    const partes = d.deducoes.map(x => `${x.quantidade} ${plural(x.quantidade, 'dedução', 'deduções')} por ${x.tipo.charAt(0).toLowerCase() + x.tipo.slice(1)} (${n(x.totalPontos)})`);
    const lista = partes.length > 1 ? partes.slice(0, -1).join(', ') + ' e ' + partes.at(-1) : partes[0];
    let p1 = partes.length
      ? `A loja ${d.loja.codigo} · ${d.loja.nome} iniciou ${d.periodo} com ${d.pontosIniciais} pontos, mas sofreu ${lista}, terminando com ${n(d.pontosFinais)} pontos (${d.zona}).`
      : `A loja ${d.loja.codigo} · ${d.loja.nome} iniciou ${d.periodo} com ${d.pontosIniciais} pontos e não registrou nenhuma dedução, mantendo ${n(d.pontosFinais)} pontos (${d.zona}).`;
    const pos = d.posicao === d.totalLojas ? 'a última posição' : d.posicao === d.totalLojas - 1 ? 'a penúltima posição' : `a ${d.posicao}ª posição`;
    let mov = '';
    const dp = Math.abs((d.posicaoAnterior || 0) - d.posicao), pos2 = `${dp} ${plural(dp, 'posição', 'posições')}`;
    if (d.posicaoAnterior) mov = d.posicaoAnterior > d.posicao ? ` Subiu ${pos2} em relação ao mês anterior, quando era a ${d.posicaoAnterior}ª.` : d.posicaoAnterior < d.posicao ? ` Caiu ${pos2} em relação ao mês anterior, quando era a ${d.posicaoAnterior}ª.` : ' Manteve a mesma posição do mês anterior.';
    const p2 = `No ranking da rede, ocupa ${pos} entre ${d.totalLojas} lojas; a média da rede foi de ${n(d.mediaRede)} pontos.${mov}`;
    const pior = d.deducoes[0];
    const rec = {
      falta_isolada: 'reforçar a conferência de troco e o fechamento cego do caixa, com acompanhamento do gerente no encerramento de cada turno',
      quebra_reincidente: 'tratar individualmente o caixa reincidente (reciclagem, conversa formal e, se persistir, remanejamento de função)',
      div_recebimentos: 'conferir diariamente o relatório do Websystem contra o fechamento da loja antes do envio à retaguarda',
      erro_pix: 'padronizar a baixa de PIX pelo comprovante no sistema e conferir o extrato do dia antes do fechamento',
      atraso_justificativa: 'cumprir o prazo de justificativa das faltas, registrando o ocorrido no mesmo dia',
    };
    const p3 = pior ? `A principal causa de perda foi ${pior.tipo.charAt(0).toLowerCase() + pior.tipo.slice(1)} (${n(pior.totalPontos)} pontos). Recomenda-se ${rec[pior.tipoId] || 'que a supervisão acompanhe a rotina da loja com revisão semanal até o próximo ciclo'}.` : 'A loja segue em conformidade e serve de referência operacional para as demais.';
    return [p1, p2, p3].join('\n\n');
  },
  async gerarIA(d) {
    const sample = typeof Cloud !== 'undefined' && Cloud.caps.sample;
    if (!sample) throw new Error('A leitura por IA está desligada: o Master liga em Configurações de Integração.');
    const r = await sample(this.prompt(d), { modelTier: 'default' });
    return (r.text || '').trim();
  },
};

if (typeof module !== 'undefined') module.exports = { OFX, ContasBancarias, DFC, DFC_REGRAS_PADRAO, DFC_CATEGORIAS, IEO, IEO_PADRAO, Laudo, LAUDO_PROMPT };

/* =====================================================================
   MÓDULO 4 — RETAGUARDA FINANCEIRA
   Abas:
     1. Conciliação Credsystem — Websystem × sistema interno (dinheiro, PIX, cartão)
     2. Faltas de Caixa       — lançamentos, base de caixas, ranking de quebras
     3. IEO · Ranking         — pontuação, pódio, alertas, laudos e WhatsApp → retaguarda-fin.js
   (Conciliação bancária/OFX e DFC ficam no Módulo 3 — FCX, aba "DFC": fcx-dfc.js)
   Coleções (agrupadas para respeitar o limite de documentos do banco):
     credsystem/<AAAA-MM-DD>        { data, linhas:[{chave,lojaId,texto,web,din,cart,pix,obs}] , arquivos[] }
     faltas/<AAAA-MM>_<loja-XXX>    { mes, lojaId, itens:[{id,data,tipo,valor,caixa{tipo,id,nome,matricula},justificativa,status,origem}] }
     caixas/<loja-XXX>              { lojaId, operadores:[{id,nome,matricula,ativo}] }
   ===================================================================== */
const RETAGUARDA_CFG = {
  toleranciaCredsystem: 0.05,       // |diferença| até R$ 0,05 = conciliado (arredondamentos)
  reincidenciaFaltas: 3,            // nº de ocorrências no período para marcar o caixa como reincidente
  statusFalta: ['Em análise', 'Justificada', 'Descontada em folha', 'Abonada'],
  // cores categóricas fixas (paleta validada) — dinheiro, PIX, cartão
  corModalidade: { din: '#2a78d6', pix: '#1baf7a', cart: '#eb6834' },
};

const Retaguarda = {
  ui: {
    aba: 'credsystem',
    cs: { mes: '', loja: '', filtro: 'div', busca: '', limite: 150, verTodasLojas: false },
    ft: { periodo: '', loja: '', status: '', busca: '', verTodos: false },
  },
  _charts: {},
  colecoes() { return ['credsystem', 'faltas', 'caixas', 'lojas', 'funcionarios']; },

  /* ======================= utilitários ======================= */
  norm: s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim(),
  num(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v;
    const s = String(v).replace(/[R$\s]/g, ''); if (!s || s === '-') return null;
    const n = Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); return isNaN(n) ? null : n;
  },
  dataISO(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); } // serial do Excel
    if (v instanceof Date) return Datas.iso(v);
    const s = String(v).trim(); let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : null;
  },
  /** "30 -PALMARES", "09- MIX CASA FORTE" → loja-030 / loja-009 (pelo número da filial). */
  loja(texto) {
    const m = String(texto ?? '').match(/^\s*(\d{1,3})/); const cod = m ? m[1].padStart(3, '0') : null;
    const l = cod ? Repo.get('lojas', 'loja-' + cod) : null;
    return { lojaId: l ? l.id : null, codigo: cod, nome: l ? l.nome : String(texto ?? '').trim(), texto: String(texto ?? '').trim() };
  },
  nomeLoja(id, texto) { const l = id && Repo.get('lojas', id); return l ? `${l.codigo} · ${l.nome}` : (texto || '—'); },
  r2: n => Math.round((n + Number.EPSILON) * 100) / 100,
  mesLabel: mk => { const [y, m] = mk.split('-'); return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][+m - 1] + '/' + y; },
  /** Lê a primeira aba com cabeçalho reconhecível e devolve linhas como objetos por coluna-alvo. */
  async lerPlanilha(file, mapa) {
    const XLSX = await Libs.xlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    for (const nome of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: null });
      for (let h = 0; h < Math.min(rows.length, 15); h++) {
        const cab = (rows[h] || []).map(c => this.norm(c));
        const idx = {};
        for (const [alvo, nomes] of Object.entries(mapa)) idx[alvo] = cab.findIndex(c => nomes.some(n => c === n || c.startsWith(n)));
        const obrig = Object.entries(mapa).filter(([k]) => !k.startsWith('_opt')).map(([k]) => k);
        if (['loja', 'data'].every(k => !(k in idx) || idx[k] >= 0) && idx.loja >= 0) {
          return { aba: nome, linhas: rows.slice(h + 1).filter(r => r && r.some(c => c != null && c !== '')).map(r => Object.fromEntries(Object.entries(idx).map(([k, i]) => [k, i >= 0 ? r[i] : null]))), colunas: idx, obrig };
        }
      }
    }
    throw new Error('Não encontrei o cabeçalho (colunas LOJA e DATA) em nenhuma aba.');
  },
  async grafico(id, config) {
    const Chart = await Libs.chart(); const cv = document.getElementById(id); if (!cv) return;
    if (this._charts[id]) this._charts[id].destroy();
    this._charts[id] = new Chart(cv, config);
  },
  cor(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); },

  /* ======================= tela ======================= */
  render() {
    const abas = [['credsystem', 'Conciliação Credsystem'], ['faltas', 'Faltas de Caixa'], ['ieo', 'IEO · Ranking'], ['adquirentes', 'Auditoria de Adquirentes']];
    if (!abas.some(([k]) => k === this.ui.aba)) this.ui.aba = 'credsystem';
    const a = this.ui.aba;
    if (a !== 'adquirentes') this.liberarAdq?.(); // saiu da Auditoria de Adquirentes: solta os arquivos da memória
    const alertas = this.alertasAbertos ? this.alertasAbertos().length : 0;
    return `<div class="page-head"><div><h1>Retaguarda Financeira</h1><p>Operação das lojas: conciliação Credsystem, faltas de caixa e o Índice de Eficiência Operacional. Extratos bancários e DFC ficam no FCX (Módulo 4).</p></div></div>
      <div class="tabs" role="tablist">${abas.map(([k, r]) => `<button class="${a === k ? 'on' : ''}" data-a="rt-aba" data-v="${k}">${r}${k === 'ieo' && alertas ? ` <span class="pill bad" style="margin-left:4px">${alertas}</span>` : ''}</button>`).join('')}</div>
      ${({ credsystem: () => this.renderCS(), faltas: () => this.renderFT(), ieo: () => this.renderIEO(), adquirentes: () => this.renderAdq() })[a]()}`;
  },
  afterRender() {
    if (this.ui.aba === 'adquirentes') this.montarAdq();
    if (this.ui.aba === 'credsystem' && this._csDados) this.graficosCS(this._csDados);
    if (this.ui.aba === 'faltas' && this._ftDados) this.graficosFT(this._ftDados);
    if (this.ui.aba === 'ieo' && this._ieoDados) this.sincronizarAlertas(this._ieoDados.ranking, this._ieoDados.mes).catch(() => { });
  },

  /* =====================================================================
     1. CONCILIAÇÃO CREDSYSTEM
     ===================================================================== */
  statusLinha(l) {
    const temInterno = [l.din, l.cart, l.pix].some(v => v != null);
    const interno = this.r2((l.din || 0) + (l.cart || 0) + (l.pix || 0));
    const dif = this.r2((l.web || 0) - interno);
    if (!temInterno && (l.web || 0) > 0) return { interno, dif, st: 'pend' };
    return { interno, dif, st: Math.abs(dif) <= RETAGUARDA_CFG.toleranciaCredsystem ? 'ok' : 'div' };
  },
  linhasCS() {
    return Repo.todos('credsystem').flatMap(d => (d.linhas || []).map(l => ({ ...l, data: d.id, docId: d.id, ...this.statusLinha(l) })));
  },
  mesesCS() { return [...new Set(Repo.todos('credsystem').map(d => d.id.slice(0, 7)))].sort().reverse(); },

  renderCS() {
    if (!Repo.prontas.has('credsystem')) return '<div class="panel"><p class="muted">Carregando conciliações…</p></div>';
    const u = this.ui.cs, meses = this.mesesCS();
    if (!u.mes || (meses.length && !meses.includes(u.mes))) u.mes = meses[0] || Datas.hojeISO().slice(0, 7);
    const podeImp = Auth.can('retaguarda.credsystem.importar');
    const topo = `<div class="row between" style="margin-bottom:14px">
        <div class="toolbar" style="margin:0;flex:1">
          <div class="field"><label class="lbl" for="csMes">Mês</label><select id="csMes" data-a="rt-cs" data-k="mes">${(meses.length ? meses : [u.mes]).map(m => `<option value="${m}" ${m === u.mes ? 'selected' : ''}>${this.mesLabel(m)}</option>`).join('')}</select></div>
          <div class="field"><label class="lbl" for="csLoja">Loja</label><select id="csLoja" data-a="rt-cs" data-k="loja"><option value="">Todas</option>${Repo.todos('lojas').sort((a, b) => a.codigo.localeCompare(b.codigo)).map(l => `<option value="${l.id}" ${l.id === u.loja ? 'selected' : ''}>${l.codigo} · ${esc(l.nome)}</option>`).join('')}</select></div>
        </div>
        ${podeImp ? `<label class="btn" style="cursor:pointer">Importar relatório (.xlsx)<input type="file" accept=".xlsx,.xls,.csv" hidden data-a="rt-cs-upload"></label>` : ''}</div>`;
    const linhas = this.linhasCS().filter(l => l.data.startsWith(u.mes) && (!u.loja || l.lojaId === u.loja));
    this._csDados = null;
    if (!linhas.length) return topo + `<div class="panel"><div class="empty">Nenhuma conciliação em ${this.mesLabel(u.mes)}.${podeImp ? ' Importe o relatório do Websystem (colunas LOJA, DATA, WEBSYSTEM, DINHEIRO, CARTAO, PIX).' : ''}</div></div>`;

    /* ---- consolidação ---- */
    const soma = (arr, k) => this.r2(arr.reduce((a, l) => a + (l[k] || 0), 0));
    const lancadas = linhas.filter(l => l.st !== 'pend'), pend = linhas.filter(l => l.st === 'pend'), divs = linhas.filter(l => l.st === 'div');
    const web = soma(lancadas, 'web'), interno = soma(lancadas, 'interno'), difLiq = this.r2(web - interno), difAbs = this.r2(divs.reduce((a, l) => a + Math.abs(l.dif), 0));
    const din = soma(lancadas, 'din'), pix = soma(lancadas, 'pix'), cart = soma(lancadas, 'cart');
    const taxa = lancadas.length ? (lancadas.length - divs.length) / lancadas.length : 0;
    const porLoja = {};
    for (const l of linhas) {
      const k = l.lojaId || 'txt:' + l.texto, r = porLoja[k] ||= { chave: k, lojaId: l.lojaId, texto: l.texto, web: 0, n: 0, abs: 0, liq: 0, maior: 0, pend: 0 };
      r.web += l.web || 0; if (l.st === 'pend') r.pend++;
      if (l.st === 'div') { r.n++; r.abs += Math.abs(l.dif); r.liq += l.dif; if (Math.abs(l.dif) > Math.abs(r.maior)) r.maior = l.dif; }
    }
    const ranking = Object.values(porLoja).filter(r => r.n).sort((a, b) => b.abs - a.abs);
    const porDia = {}; linhas.forEach(l => { const d = porDia[l.data] ||= { data: l.data, dif: 0, web: 0, n: 0 }; if (l.st === 'div') { d.dif += l.dif; d.n++; } d.web += l.web || 0; });
    this._csDados = { dias: Object.values(porDia).sort((a, b) => a.data.localeCompare(b.data)) };

    const kpis = `<div class="grid g4" style="margin-bottom:16px">
      <div class="kpi"><div class="k">Recebido Websystem</div><div class="v mono">${Fmt.brl0(web)}</div><div class="d">${lancadas.length} loja-dias conferidos${pend.length ? ` · +${Fmt.brl0(soma(pend, 'web'))} aguardando lançamento` : ''}</div></div>
      <div class="kpi"><div class="k">Lançado no sistema interno</div><div class="v mono">${Fmt.brl0(interno)}</div><div class="d">diferença líquida <b style="color:var(${Math.abs(difLiq) > 0.05 ? '--bad' : '--ok'})">${Fmt.brl(difLiq)}</b></div></div>
      <div class="kpi"><div class="k">Taxa de conciliação</div><div class="v">${Fmt.pct(taxa * 100, 1)}</div><div class="d">${divs.length} divergência(s) · ${Fmt.brl(difAbs)} em valor absoluto</div></div>
      <div class="kpi"><div class="k">Pendentes de lançamento</div><div class="v" style="color:var(${pend.length ? '--warn' : '--ok'})">${pend.length}</div><div class="d">${pend.length ? 'loja-dias só com Websystem' : 'tudo lançado'}</div></div></div>`;
    const tot = din + pix + cart || 1;
    const mix = `<div class="panel"><div class="row between"><h2>Recebimento por modalidade</h2><span class="hint">sistema interno · ${this.mesLabel(u.mes)}</span></div>
      <div class="mixbar" role="img" aria-label="Dinheiro ${Fmt.pct(din / tot * 100, 1)}, PIX ${Fmt.pct(pix / tot * 100, 1)}, Cartão ${Fmt.pct(cart / tot * 100, 1)}">
        ${[['din', din], ['pix', pix], ['cart', cart]].map(([k, v]) => v > 0 ? `<i style="width:${v / tot * 100}%;background:${RETAGUARDA_CFG.corModalidade[k]}" title="${Fmt.brl(v)}"></i>` : '').join('')}</div>
      <div class="mixleg">${[['din', 'Dinheiro', din], ['pix', 'PIX', pix], ['cart', 'Cartão', cart]].map(([k, r, v]) => `<div><span class="sw" style="background:${RETAGUARDA_CFG.corModalidade[k]}"></span><span>${r}</span><b class="mono">${Fmt.brl0(v)}</b><span class="hint">${Fmt.pct(v / tot * 100, 1)}</span></div>`).join('')}</div></div>`;
    const maxAbs = ranking[0]?.abs || 1, rkLista = u.verTodasLojas ? ranking : ranking.slice(0, 10);
    const rank = `<div class="panel"><div class="row between"><div><h2>Lojas com maiores divergências</h2><p class="sub">Ordenado pela soma das diferenças em valor absoluto no mês.</p></div></div>
      ${ranking.length ? `<ol class="rank">${rkLista.map((r, i) => `<li><span class="pos">${i + 1}</span><div class="info"><div class="row between" style="gap:6px"><b>${esc(this.nomeLoja(r.lojaId, r.texto))}</b><span class="mono">${Fmt.brl(r.abs)}</span></div>
          <div class="rbar"><i style="width:${Math.max(3, r.abs / maxAbs * 100)}%"></i></div>
          <div class="hint">${r.n} ocorrência${r.n > 1 ? 's' : ''} · líquida ${Fmt.brl(r.liq)} · maior ${Fmt.brl(r.maior)}</div></div></li>`).join('')}</ol>
        ${ranking.length > 10 ? `<button class="btn ghost sm" data-a="rt-cs-todas">${u.verTodasLojas ? 'Mostrar top 10' : `Ver todas (${ranking.length})`}</button>` : ''}`
        : '<div class="empty">Nenhuma divergência no período.</div>'}</div>`;
    const grafico = `<div class="panel"><div class="row between"><div><h2>Diferença líquida por dia</h2><p class="sub">Positivo: Websystem maior que o sistema interno. Negativo: sistema interno maior.</p></div></div>
      <div class="chart-box"><canvas id="csDia" role="img" aria-label="Diferença líquida por dia"></canvas></div></div>`;

    /* ---- tabela ---- */
    const q = this.norm(u.busca);
    const filtradas = linhas.filter(l => (u.filtro === 'todos' || l.st === u.filtro) && (!q || this.norm(this.nomeLoja(l.lojaId, l.texto)).includes(q)))
      .sort((a, b) => u.filtro === 'div' ? Math.abs(b.dif) - Math.abs(a.dif) : b.data.localeCompare(a.data) || (a.texto || '').localeCompare(b.texto || ''));
    const podeEd = Auth.can('retaguarda.credsystem.editar'), podeFalta = Auth.can('retaguarda.faltas.lancar');
    const pill = st => ({ ok: '<span class="pill ok">Conciliado</span>', div: '<span class="pill bad">Divergente</span>', pend: '<span class="pill warn">Aguardando lançamento</span>' })[st];
    const tabela = `<div class="panel"><div class="row between" style="margin-bottom:10px"><h2>Loja × dia</h2>
        <div class="seg">${[['div', `Divergências (${divs.length})`], ['pend', `Pendentes (${pend.length})`], ['todos', `Todos (${linhas.length})`]].map(([k, r]) => `<button class="${u.filtro === k ? 'on' : ''}" data-a="rt-cs-filtro" data-v="${k}">${r}${k === 'adquirentes' && !Auth.can('retaguarda.adq.ver') ? ' <span class="pill neutral" style="margin-left:4px">GESTOR</span>' : ''}</button>`).join('')}</div></div>
      <div class="field" style="max-width:340px;margin-bottom:10px"><label class="lbl" for="csBusca">Buscar loja</label><input id="csBusca" type="search" value="${esc(u.busca)}" data-a="rt-cs-busca" placeholder="Ex.: Palmares"></div>
      ${filtradas.length ? `<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Loja</th><th class="num">Websystem</th><th class="num">Dinheiro</th><th class="num">PIX</th><th class="num">Cartão</th><th class="num">Diferença</th><th>Situação</th>${podeEd || podeFalta ? '<th></th>' : ''}</tr></thead><tbody>
        ${filtradas.slice(0, u.limite).map(l => `<tr><td class="mono">${Fmt.data(l.data)}</td><td>${esc(this.nomeLoja(l.lojaId, l.texto))}${!l.lojaId ? ' <span class="pill warn">loja não cadastrada</span>' : ''}${l.obs ? `<div class="cell-sub">${esc(l.obs)}</div>` : ''}</td>
          <td class="num">${Fmt.brl(l.web)}</td><td class="num">${l.din != null ? Fmt.brl(l.din) : '—'}</td><td class="num">${l.pix != null ? Fmt.brl(l.pix) : '—'}</td><td class="num">${l.cart != null ? Fmt.brl(l.cart) : '—'}</td>
          <td class="num"><b style="color:var(${l.st === 'div' ? '--bad' : '--ink-soft'})">${l.st === 'pend' ? '—' : Fmt.brl(l.dif)}</b></td><td>${pill(l.st)}</td>
          ${podeEd || podeFalta ? `<td class="acts">${podeEd ? `<button class="iconbtn" data-a="rt-cs-editar" data-doc="${l.docId}" data-k="${esc(l.chave)}" aria-label="Lançar ou corrigir valores do sistema interno">${ICON.editar}</button>` : ''}${podeFalta && l.st === 'div' && l.lojaId ? `<button class="btn ghost sm" data-a="rt-cs-falta" data-doc="${l.docId}" data-k="${esc(l.chave)}">Lançar falta</button>` : ''}</td>` : ''}</tr>`).join('')}
      </tbody></table></div>${filtradas.length > u.limite ? `<button class="btn sec sm" style="margin-top:10px" data-a="rt-cs-mais">Mostrar mais (${filtradas.length - u.limite} restantes)</button>` : ''}`
        : '<div class="empty">Nada para mostrar com esse filtro.</div>'}</div>`;
    return topo + kpis + `<div class="grid g2 cs-top"><div class="stack">${mix}${grafico}</div>${rank}</div>` + tabela;
  },
  graficosCS({ dias }) {
    const pos = this.cor('--warn'), neg = this.cor('--accent'), grid = this.cor('--line-soft'), ink = this.cor('--ink-soft');
    this.grafico('csDia', {
      type: 'bar',
      data: { labels: dias.map(d => Fmt.data(d.data).slice(0, 5)), datasets: [{ label: 'Diferença líquida', data: dias.map(d => this.r2(d.dif)), backgroundColor: dias.map(d => d.dif >= 0 ? pos : neg), borderRadius: 4, maxBarThickness: 26 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${Fmt.brl(c.parsed.y)} · ${dias[c.dataIndex].n} divergência(s)` } } },
        scales: { x: { grid: { display: false }, ticks: { color: ink } }, y: { grid: { color: grid }, ticks: { color: ink, callback: v => Fmt.brl0(v) } } } },
    });
  },

  /** Importa o relatório do Websystem. Colunas reconhecidas pelo nome (a ordem não importa). */
  async importarCS(file) {
    const r = await this.lerPlanilha(file, {
      loja: ['LOJA', 'FILIAL'], data: ['DATA'], web: ['WEBSYSTEM', 'CREDSYSTEM', 'VALOR RECEBIDO', 'RECEBIDO', 'TOTAL'],
      din: ['DINHEIRO'], cart: ['CARTAO', 'CARTOES'], pix: ['PIX'],
    });
    if (r.colunas.web < 0) throw new Error('Não encontrei a coluna do valor recebido (WEBSYSTEM ou TOTAL).');
    // agrega por data e loja (linhas repetidas da mesma loja no mesmo dia são somadas)
    const porData = {}, naoCad = new Set(); let n = 0, invalidas = 0;
    for (const x of r.linhas) {
      const data = this.dataISO(x.data), web = this.num(x.web);
      if (!data || x.loja == null || web == null) { invalidas++; continue; }
      const lj = this.loja(x.loja); if (!lj.lojaId) naoCad.add(lj.texto);
      const chave = lj.lojaId || 'txt:' + this.norm(lj.texto);
      const vals = { din: this.num(x.din), cart: this.num(x.cart), pix: this.num(x.pix) };
      const temInterno = Object.values(vals).some(v => v != null);
      const alvo = (porData[data] ||= {})[chave] ||= { chave, lojaId: lj.lojaId, texto: lj.texto, web: 0, din: null, cart: null, pix: null, _interno: false };
      alvo.web = this.r2(alvo.web + web);
      if (temInterno) { alvo._interno = true; ['din', 'cart', 'pix'].forEach(k => { alvo[k] = this.r2((alvo[k] || 0) + (vals[k] || 0)); }); }
      n++;
    }
    const datas = Object.keys(porData).sort();
    if (!datas.length) throw new Error('Nenhuma linha válida (confira as colunas LOJA, DATA e WEBSYSTEM).');
    return { porData, datas, n, invalidas, naoCad: [...naoCad], aba: r.aba, nomeArquivo: file.name };
  },
  async aplicarCS(imp) {
    let docs = 0;
    for (const data of imp.datas) {
      const atual = Repo.get('credsystem', data), mapa = new Map((atual?.linhas || []).map(l => [l.chave, l]));
      for (const nova of Object.values(imp.porData[data])) {
        const velha = mapa.get(nova.chave) || {};
        const l = { ...velha, chave: nova.chave, lojaId: nova.lojaId, texto: nova.texto, web: nova.web };
        // valores internos do arquivo substituem; se o arquivo não trouxer, mantém o que foi digitado no painel
        if (nova._interno) { l.din = nova.din; l.cart = nova.cart; l.pix = nova.pix; }
        else { l.din = velha.din ?? null; l.cart = velha.cart ?? null; l.pix = velha.pix ?? null; }
        mapa.set(nova.chave, l);
      }
      const arquivos = [...(atual?.arquivos || []), { nome: imp.nomeArquivo, em: new Date().toISOString(), por: Auth.id }].slice(-5);
      await Repo.salvar('credsystem', data, { data, linhas: [...mapa.values()], arquivos }, { modulo: 'retaguarda', rotulo: `Credsystem ${Fmt.data(data)}`, detalhe: `Importação de ${imp.nomeArquivo}` });
      docs++; await sleep(80);
    }
    return docs;
  },
  editarLinhaCS(docId, chave) {
    const doc = Repo.get('credsystem', docId), l = doc.linhas.find(x => x.chave === chave);
    UI.modal({
      titulo: `Sistema interno · ${this.nomeLoja(l.lojaId, l.texto)} · ${Fmt.data(docId)}`,
      corpo: `<p class="hint" style="margin-top:0">Websystem: <b class="mono">${Fmt.brl(l.web)}</b>. Informe o que consta no sistema interno por modalidade.</p>
        <div class="form-grid">${campo('Dinheiro (R$)', 'din', l.din, { tipo: 'number' })}${campo('PIX (R$)', 'pix', l.pix, { tipo: 'number' })}${campo('Cartão (R$)', 'cart', l.cart, { tipo: 'number' })}
        <div class="field"><span class="lbl">Diferença</span><div id="csDifPrev" class="mono" style="font-size:18px;padding-top:6px">—</div></div>
        ${campo('Observação', 'obs', l.obs, { full: true, attrs: 'placeholder="Ex.: estorno lançado no dia seguinte"' })}</div>`,
      aoAbrir: m => { const upd = () => { const d = UI.lerForm(m); const s = this.statusLinha({ web: l.web, ...d }); $('#csDifPrev', m).textContent = s.st === 'pend' ? '—' : Fmt.brl(s.dif); $('#csDifPrev', m).style.color = s.st === 'div' ? 'var(--bad)' : 'var(--ok)'; }; m.addEventListener('input', upd); upd(); },
      acoes: [{ rotulo: 'Cancelar', classe: 'sec' }, { rotulo: 'Salvar', acao: async m => {
        const d = UI.lerForm(m);
        await Repo.salvar('credsystem', docId, { ...doc, linhas: doc.linhas.map(x => x.chave === chave ? { ...x, ...d } : x) }, { modulo: 'retaguarda', rotulo: `Credsystem ${Fmt.data(docId)} · ${this.nomeLoja(l.lojaId, l.texto)}` });
        UI.toast('Conciliação atualizada');
      } }],
    });
  },

  /* =====================================================================
     2. FALTAS DE CAIXA
     ===================================================================== */
  itensFaltas() {
    return Repo.todos('faltas').flatMap(d => (d.itens || []).map(i => ({ ...i, lojaId: d.lojaId, docId: d.id })));
  },
  periodos() {
    const hoje = Datas.hojeISO().slice(0, 7);
    const meses = [...new Set([hoje, ...this.itensFaltas().map(i => i.data.slice(0, 7))])].sort().reverse();
    return [['ult3', 'Últimos 3 meses'], ['ano', 'Ano ' + hoje.slice(0, 4)], ...meses.map(m => [m, this.mesLabel(m)])];
  },
  noPeriodo(data, p) {
    const hoje = Datas.hoje();
    if (p === 'ult3') return data >= Datas.iso(new Date(hoje.getFullYear(), hoje.getMonth() - 2, 1));
    if (p === 'ano') return data.startsWith(String(hoje.getFullYear()));
    return data.startsWith(p);
  },
  /** Opções de caixa de uma loja: colaboradores do Módulo 1 lotados nela + base rápida de operadores. */
  caixasDaLoja(lojaId) {
    const funcs = Repo.todos('funcionarios').filter(f => f.lotacao === lojaId && (f.status || 'Ativo') !== 'Desligado')
      .sort((a, b) => (/caixa/i.test(b.cargo) - /caixa/i.test(a.cargo)) || a.nome.localeCompare(b.nome))
      .map(f => ({ tipo: 'func', id: f.id, nome: f.nome, matricula: f.matricula || '', rotulo: `${f.nome} · ${f.cargo || 'colaborador'}` }));
    const ops = (Repo.get('caixas', lojaId)?.operadores || []).filter(o => o.ativo !== false)
      .map(o => ({ tipo: 'op', id: o.id, nome: o.nome, matricula: o.matricula || '', rotulo: `${o.nome} · base de caixas` }));
    return [...funcs, ...ops];
  },
  chaveCaixa(i) { return i.caixa?.id ? i.caixa.tipo + ':' + i.caixa.id : 'txt:' + i.lojaId + ':' + this.norm(i.caixa?.nome); },

  renderFT() {
    if (!Repo.prontas.has('faltas')) return '<div class="panel"><p class="muted">Carregando faltas…</p></div>';
    const u = this.ui.ft; if (!u.periodo) u.periodo = Datas.hojeISO().slice(0, 7);
    const podeL = Auth.can('retaguarda.faltas.lancar'), podeCx = Auth.can('retaguarda.caixas.editar');
    const lojasOpt = Repo.todos('lojas').sort((a, b) => a.codigo.localeCompare(b.codigo));
    const topo = `<div class="row between" style="margin-bottom:14px">
        <div class="toolbar" style="margin:0;flex:1">
          <div class="field"><label class="lbl" for="ftPer">Período</label><select id="ftPer" data-a="rt-ft" data-k="periodo">${this.periodos().map(([v, l]) => `<option value="${v}" ${v === u.periodo ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label class="lbl" for="ftLoja">Loja</label><select id="ftLoja" data-a="rt-ft" data-k="loja"><option value="">Todas</option>${lojasOpt.map(l => `<option value="${l.id}" ${l.id === u.loja ? 'selected' : ''}>${l.codigo} · ${esc(l.nome)}</option>`).join('')}</select></div>
          <div class="field"><label class="lbl" for="ftSt">Situação</label><select id="ftSt" data-a="rt-ft" data-k="status"><option value="">Todas</option>${RETAGUARDA_CFG.statusFalta.map(s => `<option ${s === u.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        </div>
        <div class="row">${podeCx ? '<button class="btn sec" data-a="rt-caixas">Base de caixas</button>' : ''}${podeL ? `<button class="btn sec" data-a="rt-ft-lote">Upload em lote</button><button class="btn" data-a="rt-ft-nova">+ Lançar falta</button>` : ''}</div></div>`;
    const itens = this.itensFaltas().filter(i => this.noPeriodo(i.data, u.periodo) && (!u.loja || i.lojaId === u.loja) && (!u.status || i.status === u.status));
    this._ftDados = null;
    if (!itens.length) return topo + `<div class="panel"><div class="empty">Nenhuma falta ou sobra lançada no período.${podeL ? ' Use “+ Lançar falta” ou o upload em lote.' : ''}</div></div>`;

    const faltas = itens.filter(i => i.tipo !== 'Sobra'), sobras = itens.filter(i => i.tipo === 'Sobra');
    const totF = this.r2(faltas.reduce((a, i) => a + i.valor, 0)), totS = this.r2(sobras.reduce((a, i) => a + i.valor, 0));
    const porCaixa = {}, porLoja = {};
    for (const i of faltas) {
      const k = this.chaveCaixa(i), c = porCaixa[k] ||= { chave: k, nome: i.caixa?.nome || '—', vinculado: !!i.caixa?.id, lojaId: i.lojaId, n: 0, valor: 0, dias: new Set(), desc: 0 };
      c.n++; c.valor += i.valor; c.dias.add(i.data); if (i.status === 'Descontada em folha') c.desc += i.valor;
      const l = porLoja[i.lojaId] ||= { lojaId: i.lojaId, n: 0, valor: 0, caixas: new Set() }; l.n++; l.valor += i.valor; l.caixas.add(k);
    }
    const rkCx = Object.values(porCaixa).sort((a, b) => b.valor - a.valor || b.n - a.n);
    const rkLj = Object.values(porLoja).sort((a, b) => b.valor - a.valor);
    const reinc = rkCx.filter(c => c.n >= RETAGUARDA_CFG.reincidenciaFaltas).length;
    const pctSt = s => totF ? faltas.filter(i => i.status === s).reduce((a, i) => a + i.valor, 0) / totF * 100 : 0;
    const semanas = {}; faltas.forEach(i => { const d = Datas.de(i.data); const seg = new Date(d); seg.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const k = Datas.iso(seg); const w = semanas[k] ||= { k, valor: 0, n: 0 }; w.valor += i.valor; w.n++; });
    this._ftDados = { semanas: Object.values(semanas).sort((a, b) => a.k.localeCompare(b.k)) };

    const kpis = `<div class="grid g4" style="margin-bottom:16px">
      <div class="kpi"><div class="k">Total em faltas</div><div class="v mono" style="color:var(--bad)">${Fmt.brl(totF)}</div><div class="d">${faltas.length} ocorrência(s) · média ${Fmt.brl(faltas.length ? totF / faltas.length : 0)}</div></div>
      <div class="kpi"><div class="k">Caixas envolvidos</div><div class="v">${rkCx.length}</div><div class="d">${reinc} reincidente(s) (${RETAGUARDA_CFG.reincidenciaFaltas}+ ocorrências)</div></div>
      <div class="kpi"><div class="k">Recuperado</div><div class="v">${Fmt.pct(pctSt('Descontada em folha'), 0)}</div><div class="d">descontado em folha · ${Fmt.pct(pctSt('Abonada'), 0)} abonado · ${Fmt.pct(pctSt('Em análise'), 0)} em análise</div></div>
      <div class="kpi"><div class="k">Sobras de caixa</div><div class="v mono">${Fmt.brl(totS)}</div><div class="d">${sobras.length} ocorrência(s) no período</div></div></div>`;
    const maxC = rkCx[0]?.valor || 1, lista = u.verTodos ? rkCx : rkCx.slice(0, 10);
    const rankCx = `<div class="panel"><h2>Ranking de quebras por caixa</h2><p class="sub">Valor total de faltas no período; índice = ocorrências e dias com falta.</p>
      <ol class="rank">${lista.map((c, i) => `<li><span class="pos">${i + 1}</span><div class="info"><div class="row between" style="gap:6px"><b>${esc(c.nome)}${c.n >= RETAGUARDA_CFG.reincidenciaFaltas ? ' <span class="pill bad">reincidente</span>' : ''}${!c.vinculado ? ' <span class="pill neutral">não vinculado</span>' : ''}</b><span class="mono">${Fmt.brl(c.valor)}</span></div>
        <div class="rbar bad"><i style="width:${Math.max(3, c.valor / maxC * 100)}%"></i></div>
        <div class="hint">${esc(this.nomeLoja(c.lojaId))} · ${c.n} ocorrência${c.n > 1 ? 's' : ''} em ${c.dias.size} dia${c.dias.size > 1 ? 's' : ''}${c.desc ? ` · ${Fmt.brl(c.desc)} descontado` : ''}</div></div></li>`).join('')}</ol>
      ${rkCx.length > 10 ? `<button class="btn ghost sm" data-a="rt-ft-todos">${u.verTodos ? 'Mostrar top 10' : `Ver todos (${rkCx.length})`}</button>` : ''}</div>`;
    const maxL = rkLj[0]?.valor || 1;
    const rankLj = `<div class="panel"><h2>Faltas por loja</h2><p class="sub">Soma das faltas e quantidade de caixas com ocorrência.</p>
      <ol class="rank">${rkLj.slice(0, 10).map((l, i) => `<li><span class="pos">${i + 1}</span><div class="info"><div class="row between" style="gap:6px"><b>${esc(this.nomeLoja(l.lojaId))}</b><span class="mono">${Fmt.brl(l.valor)}</span></div>
        <div class="rbar"><i style="width:${Math.max(3, l.valor / maxL * 100)}%"></i></div><div class="hint">${l.n} ocorrência(s) · ${l.caixas.size} caixa(s)</div></div></li>`).join('')}</ol></div>`;
    const graf = `<div class="panel"><h2>Faltas por semana</h2><p class="sub">Soma semanal (semana iniciando na segunda-feira).</p><div class="chart-box"><canvas id="ftSem" role="img" aria-label="Faltas por semana"></canvas></div></div>`;

    const q = this.norm(u.busca), podeSt = Auth.can('retaguarda.faltas.status'), podeEx = Auth.can('retaguarda.faltas.excluir');
    const tab = itens.filter(i => !q || this.norm([i.caixa?.nome, i.justificativa, this.nomeLoja(i.lojaId)].join(' ')).includes(q)).sort((a, b) => b.data.localeCompare(a.data));
    const tabela = `<div class="panel"><div class="row between" style="margin-bottom:10px"><h2>Lançamentos</h2>
        <div class="field" style="min-width:220px"><label class="lbl" for="ftBusca">Buscar</label><input id="ftBusca" type="search" value="${esc(u.busca)}" data-a="rt-ft-busca" placeholder="Caixa, loja, justificativa…"></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Loja</th><th>Caixa responsável</th><th>Tipo</th><th class="num">Valor</th><th>Justificativa</th><th>Situação</th><th></th></tr></thead><tbody>
      ${tab.map(i => `<tr><td class="mono">${Fmt.data(i.data)}</td><td>${esc(this.nomeLoja(i.lojaId))}</td><td>${esc(i.caixa?.nome || '—')}${i.caixa?.matricula ? `<div class="cell-sub mono">Mat. ${esc(i.caixa.matricula)}</div>` : ''}</td>
        <td><span class="pill ${i.tipo === 'Sobra' ? 'info' : 'bad'}">${esc(i.tipo || 'Falta')}</span></td><td class="num"><b>${Fmt.brl(i.valor)}</b></td>
        <td style="max-width:260px">${esc(i.justificativa || '—')}${i.origem && i.origem !== 'manual' ? `<div class="cell-sub">origem: ${esc(i.origem)}</div>` : ''}</td>
        <td>${podeSt ? `<select data-a="rt-ft-status" data-doc="${i.docId}" data-id="${i.id}" aria-label="Situação" style="min-width:150px">${RETAGUARDA_CFG.statusFalta.map(s => `<option ${s === i.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` : `<span class="pill ${i.status === 'Abonada' || i.status === 'Justificada' ? 'ok' : i.status === 'Descontada em folha' ? 'navy' : 'warn'}">${esc(i.status)}</span>`}</td>
        <td class="acts">${Auth.can('retaguarda.faltas.lancar') ? `<button class="iconbtn" data-a="rt-ft-editar" data-doc="${i.docId}" data-id="${i.id}" aria-label="Editar">${ICON.editar}</button>` : ''}${podeEx ? `<button class="iconbtn" data-a="rt-ft-del" data-doc="${i.docId}" data-id="${i.id}" aria-label="Excluir">${ICON.lixo}</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div><p class="hint" style="margin-top:8px">${tab.length} lançamento(s) · total ${Fmt.brl(tab.reduce((a, i) => a + (i.tipo === 'Sobra' ? 0 : i.valor), 0))} em faltas</p></div>`;
    return topo + kpis + `<div class="grid g2">${rankCx}${rankLj}</div>` + graf + tabela;
  },
  graficosFT({ semanas }) {
    const cor = this.cor('--bad'), grid = this.cor('--line-soft'), ink = this.cor('--ink-soft');
    this.grafico('ftSem', {
      type: 'bar',
      data: { labels: semanas.map(s => Fmt.data(s.k).slice(0, 5)), datasets: [{ label: 'Faltas', data: semanas.map(s => this.r2(s.valor)), backgroundColor: cor, borderRadius: 4, maxBarThickness: 34 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { title: it => 'Semana de ' + Fmt.data(semanas[it[0].dataIndex].k), label: c => ` ${Fmt.brl(c.parsed.y)} · ${semanas[c.dataIndex].n} ocorrência(s)` } } },
        scales: { x: { grid: { display: false }, ticks: { color: ink } }, y: { grid: { color: grid }, ticks: { color: ink, callback: v => Fmt.brl0(v) } } } },
    });
  },

  /** Formulário de lançamento/edição. `pre` preenche a partir de uma divergência do Credsystem. */
  abrirFalta(docId, itemId, pre = {}) {
    const doc = docId ? Repo.get('faltas', docId) : null, it = doc ? doc.itens.find(i => i.id === itemId) : null;
    const v = it ? { ...it, lojaId: doc.lojaId } : { data: Datas.hojeISO(), tipo: 'Falta', status: 'Em análise', ...pre };
    const lojas = Repo.todos('lojas').filter(l => l.ativa || l.id === v.lojaId).sort((a, b) => a.codigo.localeCompare(b.codigo));
    const podeSt = Auth.can('retaguarda.faltas.status');
    const opcoesCx = lojaId => {
      const cx = this.caixasDaLoja(lojaId), atual = v.caixa?.id ? v.caixa.tipo + ':' + v.caixa.id : (v.caixa?.nome ? 'txt' : '');
      return `<option value="">Selecione…</option>${cx.map(c => `<option value="${c.tipo}:${c.id}" ${atual === c.tipo + ':' + c.id ? 'selected' : ''}>${esc(c.rotulo)}</option>`).join('')}<option value="txt" ${atual === 'txt' ? 'selected' : ''}>Outro (digitar nome)</option>`;
    };
    UI.modal({
      titulo: it ? 'Editar lançamento' : 'Lançar falta de caixa',
      corpo: `<div class="form-grid">
        ${campo('Data', 'data', v.data, { tipo: 'date' })}
        ${campo('Loja', 'lojaId', v.lojaId || '', { opcoes: [['', 'Selecione…'], ...lojas.map(l => [l.id, `${l.codigo} · ${l.nome}`])] })}
        <div class="field"><label class="lbl" for="ftCx">Caixa responsável</label><select id="ftCx" name="_cx">${opcoesCx(v.lojaId)}</select></div>
        <div class="field" id="ftCxTxtBox" ${v.caixa && !v.caixa.id ? '' : 'hidden'}><label class="lbl" for="ftCxTxt">Nome do caixa</label><input id="ftCxTxt" type="text" name="_cxNome" value="${esc(!v.caixa?.id ? v.caixa?.nome || '' : '')}"></div>
        ${campo('Tipo', 'tipo', v.tipo || 'Falta', { opcoes: ['Falta', 'Sobra'] })}
        ${campo('Valor (R$)', 'valor', v.valor, { tipo: 'number', attrs: 'min="0" required' })}
        ${podeSt ? campo('Situação', 'status', v.status, { opcoes: RETAGUARDA_CFG.statusFalta }) : ''}
        ${campo('Justificativa', 'justificativa', v.justificativa, { tipo: 'textarea', full: true })}</div>
        <p class="hint">Não achou o caixa? Cadastre-o no Módulo 1 (lotado na loja) ou na Base de caixas.</p>`,
      aoAbrir: m => {
        $('[name="lojaId"]', m).addEventListener('change', e => { v.caixa = null; $('#ftCx', m).innerHTML = opcoesCx(e.target.value); $('#ftCxTxtBox', m).hidden = true; });
